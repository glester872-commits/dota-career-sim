</script>
<script>
/* ============================================================
   ENGINE / MATCH — simulación de mapas y series
   ------------------------------------------------------------
   Nadie tiene la victoria garantizada. La probabilidad nace de
   la diferencia de fuerza entre los dos equipos, se corrige con
   forma, moral, sinergia y meta, y SIEMPRE queda acotada: un
   equipo inferior puede ganar cualquier mapa.
   ============================================================ */
(function (DCS) {
  'use strict';

  var U = DCS.util;

  var FORMATS = {
    bo1: { maps: 1, need: 1 },
    bo2: { maps: 2, need: 2 },
    bo3: { maps: 3, need: 2 },
    bo5: { maps: 5, need: 3 }
  };

  /** probabilidad de ganar un mapa, acotada para evitar determinismo */
  function mapWinProbability(us, them) {
    var p = U.logistic(us - them, 16);
    return U.clamp(p, 0.10, 0.90);
  }

  /**
   * Genera la línea estadística del jugador en un mapa.
   * f = qué tan por encima/debajo de la media compite hoy.
   */
  function statLine(state, rng, level, win, ctx) {
    var p = state.player;
    var role = DCS.data.ROLES[p.role];
    var model = role.statModel;
    var arch = DCS.data.ARCHETYPES[p.archetype];

    var f = U.clamp((level - 55) / 32, -1.35, 1.45);
    /* dispersión individual: los agresivos e inconsistentes oscilan más */
    var varMul = arch.variance * (1.30 - p.attrs.cons / 200) * ((ctx && ctx.varMul) || 1);
    /* rendimiento del equipo en ese mapa arrastra las estadísticas */
    var teamPull = ((ctx && ctx.teamLevel) || level) - level;
    f += U.clamp(teamPull / 90, -0.25, 0.25);

    var line = {};
    for (var k in model) {
      var m = model[k];
      var center;
      if (m.abs !== undefined) center = m.base + m.abs * f;
      else center = m.base * (1 + m.slope * f);
      center += (m.win || 0) * (win ? 1 : -1);
      var v = rng.gauss(center, Math.abs(m.sd) * varMul);
      if (m.min !== undefined) v = Math.max(m.min, v);
      if (m.max !== undefined) v = Math.min(m.max, v);
      line[k] = v;
    }
    return line;
  }

  /**
   * Simula un mapa completo.
   * @returns {win:boolean, line:Object, level:number}
   */
  function simulateMap(state, rng, ctx) {
    var p = state.player;
    var team = ctx.team;
    var teamLevel = ctx.teamLevel;
    var oppLevel = ctx.oppLevel;

    /* el día concreto del jugador: puede desviarse mucho de su nivel */
    var arch = DCS.data.ARCHETYPES[p.archetype];
    var dayVar = 4.2 * arch.variance * (1.25 - p.attrs.cons / 190);
    var level = U.clamp(DCS.engine.player.effectiveLevel(p, team) + rng.gauss(0, dayVar), 1, 99);

    /* el jugador influye en el resultado según el peso de su rol */
    var role = DCS.data.ROLES[p.role];
    var indiv = (level - DCS.engine.player.effectiveLevel(p, team)) * role.impact * 0.55;
    var us = teamLevel + indiv + (ctx.momentum || 0) + rng.gauss(0, 1.6);
    var them = oppLevel + rng.gauss(0, 1.6);

    var pWin = mapWinProbability(us, them);
    var win = rng.chance(pWin);

    return {
      win: win,
      level: level,
      pWin: pWin,
      line: statLine(state, rng, level, win, { teamLevel: teamLevel, varMul: ctx.varMul })
    };
  }

  /**
   * Simula una serie completa (BO1/BO3/BO5) y devuelve el desglose
   * de mapas para que el llamante acumule estadísticas.
   */
  function simulateSeries(state, rng, ctx) {
    var fmt = FORMATS[ctx.format || 'bo3'];
    var mapsWon = 0, mapsLost = 0, momentum = 0;
    var maps = [];

    while (true) {
      var res = simulateMap(state, rng, {
        team: ctx.team,
        teamLevel: ctx.teamLevel,
        oppLevel: ctx.oppLevel,
        momentum: momentum,
        varMul: ctx.varMul
      });
      maps.push(res);
      if (res.win) { mapsWon++; momentum = U.clamp(momentum + 1.1, -2.6, 2.6); }
      else { mapsLost++; momentum = U.clamp(momentum - 1.1, -2.6, 2.6); }

      if (fmt.need === fmt.maps) {                 /* bo2: se juegan todos */
        if (mapsWon + mapsLost >= fmt.maps) break;
      } else if (mapsWon >= fmt.need || mapsLost >= fmt.need) break;
    }

    var won;
    if (ctx.format === 'bo2') won = mapsWon > mapsLost ? true : (mapsWon === mapsLost ? null : false);
    else won = mapsWon > mapsLost;

    return { won: won, mapsWon: mapsWon, mapsLost: mapsLost, maps: maps };
  }

  DCS.engine = DCS.engine || {};
  DCS.engine.match = {
    FORMATS: FORMATS,
    mapWinProbability: mapWinProbability,
    simulateMap: simulateMap,
    simulateSeries: simulateSeries,
    statLine: statLine
  };
})(window.DCS = window.DCS || {});
</script>
<script>
/* ============================================================
   ENGINE / PERFORMANCE — rating de rendimiento 0-100
   ------------------------------------------------------------
   Cada posición se juzga con criterios distintos (ratingSpec).
   Un pos 5 puede firmar una temporada excepcional con 3 kills por
   mapa; un carry con muchas kills y mal farm, no.
   Ningún dato aislado domina: los pesos internos lo impiden.
   ============================================================ */
(function (DCS) {
  'use strict';

  var U = DCS.util;

  /* Calidad del resultado de un torneo, normalizada 0-1 y
     escalada por prestigio: ganar una copa T3 no es un Major.   */
  function tournamentQuality(t) {
    var field = t.field || 8;
    var pos = U.clamp(1 - (t.placement - 1) / Math.max(1, field - 1), 0, 1);
    var prestigeW = 0.42 + t.prestige / 16;           /* 0.48 .. 1.05 */
    var q = pos * prestigeW;
    if (t.placement === 1) q += 0.10 + t.prestige / 60;
    return U.clamp(q, 0, 1.25);
  }

  /**
   * @param {Object} acc  acumulador de estadísticas (sumas por mapa)
   * @param {Object} ctx  { role, tournaments:[], oppLevel, tier, maps }
   */
  function rate(state, acc, ctx) {
    if (!acc || !acc.maps) return null;
    var role = DCS.data.ROLES[ctx.role || state.player.role];
    var avg = DCS.engine.stats.averages(acc);

    /* --- 1. calidad estadística según el rol ------------------ */
    var statScore = 0, wsum = 0;
    role.ratingSpec.forEach(function (s) {
      var v = avg[s.key];
      if (v === undefined) return;
      statScore += s.w * U.norm(v, s.low, s.high);
      wsum += s.w;
    });
    statScore = wsum ? statScore / wsum : 0.5;

    /* --- 2. resultados competitivos -------------------------- */
    var wr = acc.maps ? acc.wins / acc.maps : 0;
    var wrScore = U.norm(wr, 0.33, 0.74);
    var best = 0, titleBonus = 0;
    (ctx.tournaments || []).forEach(function (t) {
      var q = tournamentQuality(t);
      if (q > best) best = q;
      if (t.placement === 1 && t.prestige >= 6) titleBonus += 0.05;
    });
    var resultScore = U.clamp(0.55 * wrScore + 0.45 * best + titleBonus, 0, 1.05);

    /* --- 3. contexto: nivel del circuito en el que compite ---- */
    var ctxScore = U.clamp(
      0.6 * U.norm(ctx.oppLevel || 50, 38, 86) +
      0.4 * U.norm(4 - (ctx.tier || 3), 0.5, 3),
      0, 1);

    var raw = 0.60 * statScore + 0.27 * resultScore + 0.13 * ctxScore;
    var rating = 22 + raw * 74;

    /* pequeña dosis de subjetividad: la percepción nunca es exacta */
    var rng = DCS.runtime.get();
    if (rng) rating += rng.gauss(0, 1.8);

    /* muestras cortas tiran hacia la media: 8 mapas no son una temporada */
    if (acc.maps < 25) rating = U.lerp(56, rating, 0.45 + acc.maps / 45);

    return Math.round(U.clamp(rating, 5, 99));
  }

  DCS.engine = DCS.engine || {};
  DCS.engine.performance = {
    rate: rate,
    tournamentQuality: tournamentQuality
  };
})(window.DCS = window.DCS || {});
</script>
<script>
/* ============================================================
   ENGINE / PROGRESSION — desarrollo del jugador
   ------------------------------------------------------------
   Nunca hay "+1 por temporada". El crecimiento nace de la
   distancia al techo oculto, la edad, el rendimiento, la calidad
   del entorno, la moral, el entrenamiento y el azar controlado.
   De ahí salen breakouts, estancamientos, regresiones y declives.
   ============================================================ */
(function (DCS) {
  'use strict';

  var U = DCS.util;
  var ATTR_KEYS = DCS.data.ATTR_KEYS;

  /* Qué atributos dependen de las manos y cuáles de la cabeza */
  var MECH_ATTRS = { mech: 1, pool: 0.6, cons: 0.3 };
  var MIND_ATTRS = { sense: 1, ment: 1, team: 1, adapt: 1, lead: 1, cons: 0.7, pool: 0.4 };

  function mechWeight(k) { return MECH_ATTRS[k] || 0; }
  function mindWeight(k) { return MIND_ATTRS[k] || 0; }

  /* Ventanas de desarrollo por edad (§11).
     Los valores expresan qué fracción de la distancia al techo se
     puede recorrer en un año: alta de joven, residual en el declive. */
  function ageFactorMech(age, peak, delay) {
    if (age <= 20) return 1.00;
    if (age <= 24) return 0.62;
    if (age <= peak) return 0.36;
    if (age <= peak + delay) return 0.16;
    return 0.02;
  }
  function ageFactorMind(age) {
    if (age <= 20) return 0.90;
    if (age <= 24) return 0.76;
    if (age <= 27) return 0.60;
    if (age <= 32) return 0.44;
    return 0.28;
  }

  function declinePressure(player) {
    var start = player.peakAge + player.declineDelay;
    if (player.age <= start) return 0;
    return (player.age - start) * 0.72;
  }

  /**
   * @param ctx { rating, teammateLevel, mapsPlayed, played }
   * @returns { deltas, notes, breakout, slump }
   */
  function develop(state, rng, ctx) {
    var p = state.player;
    var role = DCS.data.ROLES[p.role];
    var arch = DCS.data.ARCHETYPES[p.archetype];
    var notes = [];

    var rating = ctx.rating === null || ctx.rating === undefined ? 48 : ctx.rating;
    var perfMod = 0.62 + (rating / 100) * 0.86;
    if (!ctx.played) perfMod = 0.66;                        /* sin equipo: solo pubs */

    var teamMod = ctx.teammateLevel ? U.clamp(0.86 + (ctx.teammateLevel - 52) / 110, 0.75, 1.25) : 0.86;
    var moraleMod = U.clamp(0.84 + p.morale / 330, 0.74, 1.18);
    var volumeMod = U.clamp(0.80 + (ctx.mapsPlayed || 0) / 200, 0.80, 1.20);
    var trainMod = 1 + (p.trainingMod || 0);

    /* Sucesos de temporada: un salto o un frenazo brusco */
    var youth = U.clamp((24 - p.age) / 8, 0, 1);
    var breakoutChance = 0.055 * (0.45 + youth) * (rating > 68 ? 1.7 : 0.9) * p.growth;
    var slumpChance = 0.075 / arch.slumpResist * (rating < 55 ? 1.6 : 0.85) * (p.morale < 45 ? 1.5 : 1);
    var breakout = rng.chance(breakoutChance);
    var slump = !breakout && rng.chance(slumpChance);

    var eventMul = breakout ? rng.range(2.1, 3.0) : (slump ? rng.range(-0.35, 0.25) : 1);

    var deltas = {};
    var decline = declinePressure(p);

    /* Techo REAL de esta temporada: el potencial es solo un máximo
       teórico. Lo que se materializa depende del entorno, la cabeza
       y un factor personal que el jugador nunca llega a conocer.   */
    var realization = p.realization === undefined ? 0.92 : p.realization;
    var realMod = U.clamp(0.96 +
      (p.morale - 55) / 500 +
      (p.attrs.ment - 50) / 700 +
      ((ctx.teammateLevel || 50) - 52) / 900, 0.90, 1.08);

    ATTR_KEYS.forEach(function (k) {
      var cap = Math.min(99, p.caps[k] * realization * realMod);
      var cur = p.attrs[k];
      var gap = cap - cur;

      var mw = mechWeight(k), dw = mindWeight(k);
      var ageF = (ageFactorMech(p.age, p.peakAge, p.declineDelay) * mw + ageFactorMind(p.age) * dw) /
        Math.max(0.0001, mw + dw);

      var focusMod = 1;
      if (p.trainingFocus === 'balanced') focusMod = 1.04;
      else if (p.trainingFocus === k) focusMod = 1.65;
      else focusMod = 0.88;

      var rate = 0.34 * ageF * p.growth * role.growthBias[k] * arch.growth[k] *
        perfMod * teamMod * moraleMod * volumeMod * trainMod * focusMod * rng.range(0.55, 1.5);

      var d = gap * rate * eventMul;

      /* declive: las manos se van antes que la cabeza */
      if (decline > 0) d -= decline * (0.35 + mw * 0.95) * rng.range(0.4, 1.5);
      /* y hasta en el prime se puede regresar sin jugar */
      if (!ctx.played) d -= rng.range(0.2, 1.6) * (0.4 + mw);

      deltas[k] = d;
    });

    /* Aplicar */
    ATTR_KEYS.forEach(function (k) {
      p.attrs[k] = U.clamp(p.attrs[k] + deltas[k], 3, 99);
    });

    /* Superar (o no alcanzar) las expectativas iniciales */
    if (breakout && rng.chance(0.35)) {
      var up = rng.int(2, 5);
      ATTR_KEYS.forEach(function (k) { p.caps[k] = U.clamp(p.caps[k] + up, 20, 99); });
      p.potential = U.clamp(p.potential + up, 20, 99);
      notes.push('Algo ha cambiado: tu techo ya no parece el mismo.');
    } else if (slump && rng.chance(0.30)) {
      var down = rng.int(1, 4);
      ATTR_KEYS.forEach(function (k) { p.caps[k] = U.clamp(p.caps[k] - down, 15, 99); });
      p.potential = U.clamp(p.potential - down, 15, 99);
    }

    if (breakout) {
      p.morale = U.clamp(p.morale + rng.int(8, 16), 0, 100);
      p.form = U.clamp(p.form + rng.int(6, 14), 0, 100);
      notes.push('Temporada de explosión: todo lo que entrenas cuaja de golpe.');
    }
    if (slump) {
      p.morale = U.clamp(p.morale - rng.int(6, 15), 0, 100);
      p.form = U.clamp(p.form - rng.int(5, 13), 0, 100);
      notes.push('Te has estancado. El trabajo no se traduce en juego.');
    }

    /* Redondeo y valoración general */
    ATTR_KEYS.forEach(function (k) { p.attrs[k] = Math.round(p.attrs[k]); });
    var before = p.overall;
    p.overall = DCS.engine.player.overall(p);
    if (p.overall > p.peakOverall) p.peakOverall = p.overall;

    /* MMR: se mueve hacia su objetivo, no salta */
    var target = DCS.engine.player.targetMmr(p, rng);
    var pull = ctx.played ? 0.5 : 0.62;                      /* sin equipo se grindea más */
    p.mmr = Math.round(U.clamp(p.mmr + (target - p.mmr) * pull + rng.gauss(0, 120), 500, 16000));
    if (p.mmr > p.peakMmr) p.peakMmr = p.mmr;

    p.experience = U.clamp(p.experience + (ctx.mapsPlayed || 0) * 0.09 + (ctx.played ? 2 : 0.4), 0, 200);

    /* Notas de desarrollo para el usuario (sin revelar números ocultos) */
    var sorted = ATTR_KEYS.slice().sort(function (a, b) { return deltas[b] - deltas[a]; });
    var top = sorted[0], bottom = sorted[sorted.length - 1];
    var label = function (k) {
      for (var i = 0; i < DCS.data.ATTRS.length; i++) if (DCS.data.ATTRS[i].key === k) return DCS.data.ATTRS[i].label;
      return k;
    };
    if (deltas[top] > 2.2) notes.push('Progreso claro en ' + label(top).toLowerCase() + '.');
    if (deltas[bottom] < -1.6) notes.push('Retroceso en ' + label(bottom).toLowerCase() + '.');
    if (!notes.length) {
      notes.push(Math.abs(p.overall - before) < 1
        ? 'Temporada plana: ni avances ni retrocesos evidentes.'
        : 'Progresión discreta pero real.');
    }

    return { deltas: deltas, notes: notes, breakout: breakout, slump: slump, overallBefore: before };
  }

  DCS.engine = DCS.engine || {};
  DCS.engine.progression = { develop: develop, declinePressure: declinePressure };
})(window.DCS = window.DCS || {});
</script>
<script>
/* ============================================================
   ENGINE / TOURNAMENTS — calendario y simulación de eventos
   ------------------------------------------------------------
   El acceso a los grandes torneos NO es automático: hay que
   ganarse la plaza en liga o en clasificatorio. The International
   está deliberadamente lejos: la mayoría de carreras no lo pisan.
   ============================================================ */
(function (DCS) {
  'use strict';

  var U = DCS.util;
  var D = DCS.data;
  var T = D.TOURNAMENT_TEMPLATES;

  function eventName(rng, template, year) {
    if (template.id === 'ti') return 'The International ' + year;
    if (template.kind === 'league' || template.kind === 'qualifier') return null;
    return rng.pick(D.EVENT_HEADS) + ' ' + rng.pick(D.EVENT_TAILS);
  }

  function label(template, team, rng, year) {
    var nm = eventName(rng, template, year);
    if (nm) return nm;
    if (template.kind === 'league') return template.label + ' · ' + D.REGIONS[team.region].short;
    return template.label + ' · ' + D.REGIONS[team.region].short;
  }

  /* Rivales del evento: se toman equipos reales del mundo y se
     completa con relleno del nivel adecuado si no hay suficientes. */
  function buildField(state, rng, template, team) {
    var pool;
    if (template.regional) {
      pool = DCS.engine.world.teamsIn(state, team.region, null).filter(function (t) {
        return t.id !== team.id && Math.abs(t.tier - template.tier) <= 1;
      });
    } else {
      pool = state.world.teams.filter(function (t) {
        return t.id !== team.id && t.tier <= Math.max(1, template.tier);
      });
    }
    /* los eventos grandes reúnen a los mejores */
    pool.sort(function (a, b) {
      return DCS.engine.world.teamStrength(state, b, false) - DCS.engine.world.teamStrength(state, a, false);
    });
    var need = template.field - 1;
    var chosen;
    if (template.prestige >= 8 || template.strongField) chosen = pool.slice(0, need);
    else if (template.prestige >= 6) chosen = rng.sample(pool.slice(0, Math.min(pool.length, need * 2)), need);
    else chosen = rng.sample(pool, need);

    var strengths = chosen.map(function (t) { return DCS.engine.world.teamStrength(state, t, false); });
    while (strengths.length < need) {
      strengths.push(U.clamp(rng.gauss(template.tier === 1 ? 74 : (template.tier === 2 ? 60 : 45), 6), 10, 95));
    }
    return { teams: chosen, strengths: strengths };
  }

  function lives(template) {
    return (template.kind === 'ti' || template.kind === 'international' || template.kind === 'elite') ? 2 : 1;
  }

  /* Nombre de la ronda contando hacia atrás desde la final */
  function roundName(r, rounds) {
    var left = rounds - r;
    if (left === 0) return 'Final';
    if (left === 1) return 'Semifinal';
    if (left === 2) return 'Cuartos de final';
    if (left === 3) return 'Octavos de final';
    return 'Ronda ' + r;
  }

  /**
   * Simula un torneo completo desde la perspectiva del jugador.
   * @returns { record, acc }
   */
  function runTournament(state, rng, team, template, year, opts) {
    opts = opts || {};
    var acc = DCS.engine.stats.blank(state.player.role);
    var teamLevel = DCS.engine.world.teamStrength(state, team, true);
    var field = buildField(state, rng, template, team);
    var avgOpp = field.strengths.length ? U.avg(field.strengths) : 55;

    var seriesPlayed = 0, seriesWon = 0, seriesLost = 0;
    var groupWins = 0;
    var log = [];                      /* desglose serie a serie para la interfaz */

    var names = field.teams.map(function (t) { return t.name; });
    function oppName(i) {
      if (!names.length) return 'Rival ' + (i + 1);
      return names[((i % names.length) + names.length) % names.length];
    }

    function playSeries(oppLevel, format, stage, opponent) {
      var r = DCS.engine.match.simulateSeries(state, rng, {
        team: team, teamLevel: teamLevel, oppLevel: oppLevel, format: format
      });
      r.maps.forEach(function (m) { DCS.engine.stats.add(acc, m.line, m.win); });
      seriesPlayed++;
      if (r.won === true) seriesWon++; else if (r.won === false) seriesLost++;
      log.push({
        stage: stage,
        opp: opponent,
        fmt: format,
        w: r.mapsWon,
        l: r.mapsLost,
        won: r.won,
        maps: r.maps.map(function (m) { return m.win ? 'W' : 'L'; }).join('')
      });
      return r;
    }

    /* ---------- fase de grupos / liga regular ---------- */
    var groupStage = template.kind === 'league' ? 'Liga regular' : 'Fase de grupos';
    for (var i = 0; i < template.groupSeries; i++) {
      var opp = field.strengths[i % field.strengths.length] + rng.gauss(0, 2);
      var res = playSeries(opp, template.format, groupStage, oppName(i));
      if (res.won === true) groupWins += 1;
      else if (res.won === null) groupWins += 0.5;
    }

    var cut = Math.min(template.field, Math.pow(2, template.playoff));
    var groupRatio = template.groupSeries ? groupWins / template.groupSeries : 0.5;
    /* umbral de corte: los eventos grandes cortan más arriba */
    var needed = 0.42 + (template.prestige >= 8 ? 0.10 : 0) + (template.cutBonus || 0) + rng.range(-0.06, 0.06);
    var advanced = cut >= template.field ? true : groupRatio >= needed;

    var placement, roundsWon = 0;

    if (!advanced) {
      var lo = cut + 1, hi = template.field;
      var t = U.clamp(1 - groupRatio / Math.max(0.01, needed), 0, 1);
      placement = Math.round(U.lerp(lo, hi, t * rng.range(0.55, 1)));
      placement = U.clamp(placement, lo, hi);
    } else {
      /* ---------- playoffs ---------- */
      var l = lives(template);
      var rounds = template.playoff;
      for (var r = 1; r <= rounds; r++) {
        var strengthStep = (r - 1) * 2.4;
        var oppLevel = U.clamp(avgOpp + strengthStep + rng.gauss(0, 2.5), 10, 99);
        var fmt = (r === rounds && template.prestige >= 6) ? 'bo5' : template.playoffFormat;
        var pr = playSeries(oppLevel, fmt, roundName(r, rounds), oppName(rounds - r));
        if (pr.won) { roundsWon++; }
        else {
          l--;
          if (l <= 0) break;
          /* bracket inferior: sigue vivo, rival algo más asequible */
          var lowerOpp = U.clamp(oppLevel - rng.range(1, 4), 10, 99);
          var lr = playSeries(lowerOpp, template.playoffFormat,
            'Bracket inferior · ' + roundName(r, rounds), oppName(rounds - r + 1));
          if (lr.won) roundsWon++;
          else break;
        }
      }
      if (roundsWon >= template.playoff) placement = 1;
      else {
        var hiP = Math.max(2, Math.ceil(cut / Math.pow(2, roundsWon)));
        var loP = Math.max(2, Math.ceil(cut / Math.pow(2, roundsWon + 1)) + 1);
        placement = rng.int(Math.min(loP, hiP), Math.max(loP, hiP));
      }
    }

    /* ---------- premio ---------- */
    var teamPrize = 0;
    if (template.prize) {
      var split = D.PRIZE_SPLIT[Math.min(placement - 1, D.PRIZE_SPLIT.length - 1)] || 0.005;
      teamPrize = template.prize * split;
    }
    var prize = Math.round(teamPrize * D.PLAYER_PRIZE_SHARE);

    /* puntos de circuito para invitaciones */
    team.points += Math.round((template.prestige * 12) * U.clamp(1 - (placement - 1) / template.field, 0, 1));

    var record = {
      id: 'ev' + (state.counters.event++),
      key: template.id,
      name: opts.name || label(template, team, rng, year),
      kind: template.kind,
      prestige: template.prestige,
      teamId: team.id,
      teamName: team.name,
      year: year,
      field: template.field,
      placement: placement,
      result: D.resultLabel(placement, template.field, template),
      qualified: template.kind === 'qualifier' ? placement <= 2 : null,
      prize: prize,
      maps: acc.maps,
      wins: acc.wins,
      losses: acc.losses,
      seriesPlayed: seriesPlayed,
      seriesWon: seriesWon,
      seriesLost: seriesLost,
      log: log,
      opponents: field.teams.slice(0, 6).map(function (t) { return t.name; }),
      avgOpp: Math.round(avgOpp)
    };

    record.rating = DCS.engine.performance.rate(state, acc, {
      role: state.player.role,
      tournaments: [{ placement: placement, field: template.field, prestige: template.prestige }],
      oppLevel: avgOpp,
      tier: team.tier
    });

    return { record: record, acc: acc };
  }

  /* --------------------------------------------------------
     Calendario anual según el tier del equipo y sus méritos
     -------------------------------------------------------- */
  function planSeason(state, rng, team) {
    var plan = [];
    if (team.tier === 3) {
      plan.push(T.t3_league);
      if (rng.chance(0.75)) plan.push(T.t3_open);
      if (rng.chance(0.5)) plan.push(T.t3_online);
    } else if (team.tier === 2) {
      plan.push(T.t2_league);
      if (rng.chance(0.85)) plan.push(T.t2_qual);
    } else {
      plan.push(T.t1_league);
      plan.push(T.t1_major);
      if (rng.chance(0.55)) plan.push(T.t1_elite);
    }
    return plan;
  }

  DCS.engine = DCS.engine || {};
  DCS.engine.tournaments = {
    runTournament: runTournament,
    planSeason: planSeason,
    buildField: buildField,
    label: label
  };
})(window.DCS = window.DCS || {});
</script>
<script>
/* ============================================================
   ENGINE / MARKET — valor de mercado, ofertas y contratos
   ------------------------------------------------------------
   El mercado no mira solo tu valoración: mira lo que hiciste la
   última temporada, tu reputación, tu edad, lo que creen que
   puedes llegar a ser y si encajas en un hueco concreto.
   Y a veces, simplemente, tienes suerte.
   ============================================================ */
(function (DCS) {
  'use strict';

  var U = DCS.util;
  var D = DCS.data;

  /* Umbral aproximado de nivel exigido por un equipo */
  function requiredScore(team) {
    if (team.tier === 1) return 73 + (team.quality - 72) * 0.8;
    if (team.tier === 2) return 53 + (team.quality - 60) * 0.75;
    return 27 + (team.quality - 46) * 0.6;
  }

  /** Puntuación de mercado del jugador: 0-100 */
  function marketScore(state, rng) {
    var p = state.player;
    var last = state.career.lastRating;
    var mmrNorm = U.norm(p.mmr, 2800, 11000) * 100;
    var base = 0.49 * p.overall + 0.22 * (last === null || last === undefined ? p.overall * 0.9 : last) +
      0.15 * p.reputation + 0.14 * mmrNorm;

    var perceived = DCS.engine.player.perceivedPotential(p, rng);
    var potWeight = U.clamp((23 - p.age) / 9, 0, 1) * 0.32;
    var score = base * (1 - potWeight) + perceived * potWeight;

    if (p.age >= 29) score -= (p.age - 28) * 2.6;
    if (p.age >= 34) score -= (p.age - 33) * 2.6;
    /* Estar parado pesa, pero que un chaval de 16-18 aún no tenga
       equipo es lo normal: no puede convertirse en una espiral. */
    var idle = Math.min(3, p.seasonsWithoutTeam - (p.age <= 18 ? 1 : 0));
    if (idle > 0) score -= idle * 3.4;
    if (p.flags && p.flags.provisional) score -= 3;
    return U.clamp(score, 1, 100);
  }

  /* ¿Tiene ese equipo un hueco real en tu posición? */
  function opening(state, team, rng) {
    var incumbent = null;
    team.roster.forEach(function (m) { if (m.role === state.player.role && !m.isPlayer) incumbent = m; });
    if (!incumbent) return 0.9;
    var weak = incumbent.rating < team.quality - 3;
    var old = incumbent.age >= 30;
    var base = 0.22;
    if (weak) base += 0.35;
    if (old) base += 0.22;
    if (team.synergy < 45) base += 0.12;
    return U.clamp(base, 0.05, 0.9);
  }

  function salaryFor(team, score, rng) {
    var band;
    if (team.tier === 1) band = [70000, 620000];
    else if (team.tier === 2) band = [22000, 150000];
    else band = [4000, 34000];
    var t = U.clamp((score - requiredScore(team)) / 30 + 0.35, 0, 1.15);
    var res = 0.75 + team.resources / 200;
    var value = U.lerp(band[0], band[1], t) * res * rng.range(0.88, 1.14);
    return Math.round(value / 500) * 500;
  }

  function oddsLabel(team, tier) {
    if (tier === 1) {
      if (team.quality >= 80) return 'Candidato a todo, incluido The International';
      if (team.quality >= 74) return 'Presencia habitual en torneos internacionales';
      return 'Peleará por entrar en los grandes eventos';
    }
    if (tier === 2) {
      if (team.quality >= 66) return 'Opciones reales de dar el salto a Tier 1';
      return 'Circuito regional y algún clasificatorio';
    }
    return 'Ligas menores y clasificatorios abiertos';
  }

  /**
   * Genera las ofertas del mercado de fin de temporada.
   * @param ctx { renewal:boolean }
   */
  function generateOffers(state, rng, ctx) {
    ctx = ctx || {};
    var p = state.player;
    var score = marketScore(state, rng);
    var offers = [];
    var current = DCS.engine.world.getTeam(state, p.teamId);

    var candidates = state.world.teams.filter(function (t) {
      if (current && t.id === current.id) return false;
      if (t.hasPlayer) return false;
      return true;
    });

    var scored = [];
    candidates.forEach(function (team) {
      var req = requiredScore(team);
      var fit = U.logistic(score - req, 7);
      var regionMod = team.region === p.region ? 1 : (p.reputation > 45 ? 0.5 : 0.16);
      var interest = fit * opening(state, team, rng) * regionMod;
      /* factor suerte: alguien se fija en ti sin motivo evidente */
      interest *= rng.range(0.55, 1.5);
      /* las estructuras pequeñas viven de apostar por chavales */
      if (team.tier === 3 && p.age <= 20) interest *= 1.35;
      if (team.tier === 1 && score < req - 8) interest *= 0.05;
      if (interest > 0.08) scored.push({ team: team, interest: interest, req: req });
    });

    scored.sort(function (a, b) { return b.interest - a.interest; });

    var maxOffers = 0;
    var top = scored.length ? scored[0].interest : 0;
    if (top > 0.12) maxOffers = 1;
    if (top > 0.26) maxOffers = 2;
    if (top > 0.42) maxOffers = 3;
    if (top > 0.60) maxOffers = 4;
    if (top > 0.75 && rng.chance(0.5)) maxOffers = 5;

    var picked = scored.slice(0, Math.min(scored.length, maxOffers + 3));
    picked = rng.sample(picked, maxOffers);

    picked.forEach(function (s) {
      offers.push(buildOffer(state, rng, s.team, score, false));
    });

    /* Renovación del equipo actual */
    if (current && ctx.renewal !== false) {
      var keep = U.logistic(score - requiredScore(current) + 6, 8) *
        (state.career.lastRating > 55 ? 1 : 0.6) *
        (current.synergy > 55 ? 1.1 : 0.9);
      if (rng.chance(U.clamp(keep, 0.05, 0.94))) {
        var o = buildOffer(state, rng, current, score, true);
        offers.unshift(o);
      }
    }

    offers.sort(function (a, b) {
      if (a.isRenewal !== b.isRenewal) return a.isRenewal ? -1 : 1;
      return a.tier - b.tier || b.salary - a.salary;
    });
    return offers;
  }

  function buildOffer(state, rng, team, score, isRenewal) {
    var p = state.player;
    var others = team.roster.filter(function (m) { return !m.isPlayer && m.role !== p.role; });
    var rosterLevel = others.length ? Math.round(U.avg(others, function (m) { return m.rating; })) : team.quality;

    /* A veces te quieren para otra posición: decisión de verdad.
       Solo ocurre cuando tiene sentido: a un jugador asentado y en
       forma nadie le pide que se reinvente.                        */
    var role = p.role;
    var last = state.career.lastRating;
    var reinventable = p.age <= 19 || (last !== null && last < 62);
    if (!isRenewal && reinventable && rng.chance(0.06)) {
      var alt = D.ROLE_LIST.filter(function (r) { return r !== p.role; });
      role = rng.pick(alt);
    }

    var years = team.tier === 1 ? rng.int(1, 3) : rng.int(1, 2);
    return {
      id: 'o' + (state.counters.offer++),
      teamId: team.id,
      teamName: team.name,
      region: team.region,
      tier: team.tier,
      role: role,
      years: years,
      salary: salaryFor(team, score, rng),
      expectation: team.expectation,
      rosterLevel: rosterLevel,
      synergy: team.synergy,
      reputation: team.reputation,
      odds: oddsLabel(team, team.tier),
      isRenewal: !!isRenewal,
      note: role !== p.role ? 'Te quieren como ' + D.ROLES[role].name + ' (' + D.ROLES[role].label + ')' : null
    };
  }

  function acceptOffer(state, offer) {
    var p = state.player;
    var rng = DCS.runtime.get();
    var team = DCS.engine.world.getTeam(state, offer.teamId);
    if (!team) return false;

    var wasTeam = p.teamId;
    if (wasTeam && wasTeam !== team.id) {
      DCS.engine.world.leaveTeam(state, 'transfer');
      p.teamChanges++;
      /* cambiar demasiado desgasta la imagen */
      if (state.career.lastChangeYear && state.year - state.career.lastChangeYear <= 1) {
        p.reputation = U.clamp(p.reputation - 2, 0, 100);
      }
      state.career.lastChangeYear = state.year;
    }
    if (offer.role !== p.role) {
      p.role = offer.role;
      p.overall = DCS.engine.player.overall(p);
    }
    if (team.region !== p.region) p.region = team.region;

    DCS.engine.world.joinTeam(state, team, {
      years: offer.years,
      salary: offer.salary,
      signedYear: state.year,
      expectation: offer.expectation
    });
    p.seasonsWithoutTeam = 0;
    if (offer.isRenewal) {
      team.synergy = U.clamp(team.synergy + 6, 15, 95);
      p.morale = U.clamp(p.morale + 3, 0, 100);
    }
    return true;
  }

  DCS.engine = DCS.engine || {};
  DCS.engine.market = {
    marketScore: marketScore,
    generateOffers: generateOffers,
    acceptOffer: acceptOffer,
    requiredScore: requiredScore,
    salaryFor: salaryFor
  };
})(window.DCS = window.DCS || {});
</script>
<script>
/* ============================================================
   ENGINE / EVENTS — motor de acontecimientos
   ------------------------------------------------------------
   Los efectos se aplican en el momento en que el evento se genera
   (o en que se elige una opción) y quedan escritos en el estado.
   Recargar la página no vuelve a tirar los dados.
   ============================================================ */
(function (DCS) {
  'use strict';

  var U = DCS.util;
  var D = DCS.data;

  function makeFx(state, rng, season) {
    var p = state.player;
    var team = DCS.engine.world.getTeam(state, p.teamId);
    var changes = [];

    function note(t) { changes.push(t); }

    return {
      changes: changes,
      form: function (d) { p.form = U.clamp(p.form + d, 0, 100); },
      morale: function (d) { p.morale = U.clamp(p.morale + d, 0, 100); },
      rep: function (d) { p.reputation = U.clamp(p.reputation + d, 0, 100); },
      synergy: function (d) { if (team) team.synergy = U.clamp(team.synergy + d, 10, 96); },
      attrDrift: function (k, d) { p.attrs[k] = U.clamp(p.attrs[k] + d, 3, 99); p.overall = DCS.engine.player.overall(p); },
      capPenalty: function (k, d) { p.caps[k] = U.clamp(p.caps[k] - d, 15, 99); },
      capBoost: function (k, d) { p.caps[k] = U.clamp(p.caps[k] + d, 15, 99); },
      money: function (d) {
        state.career.earnings.other += d;
        if (season) season.earnings.other += d;
      },
      salary: function (mult) {
        if (p.contract) p.contract.salary = Math.round(p.contract.salary * mult);
      },
      trainingBonus: function (x) { p.trainingMod = (p.trainingMod || 0) + x; },
      trainingPenalty: function (x) { p.trainingMod = (p.trainingMod || 0) - x; },
      captain: function (v) { p.isCaptain = !!v; if (team && v) team.synergy = U.clamp(team.synergy + 2, 10, 96); },
      flag: function (k, v) { p.flags[k] = v; },
      rerollTeammate: function () {
        if (!team) return;
        var idx = [];
        team.roster.forEach(function (m, i) { if (!m.isPlayer) idx.push(i); });
        if (!idx.length) return;
        var i2 = rng.pick(idx);
        team.roster[i2] = DCS.engine.world.makeNpc(rng, state.world, team.region, team.roster[i2].role,
          team.quality + rng.gauss(-1, 5));
        team.quality = DCS.engine.world.rosterQuality(team);
      },
      changeRole: function (role) {
        p.role = role;
        p.overall = DCS.engine.player.overall(p);
        if (team) team.roster.forEach(function (m) { if (m.isPlayer) m.role = role; });
      },
      changeRegion: function (reg) {
        p.region = reg;
        if (p.teamId) DCS.engine.world.leaveTeam(state, 'region');
      },
      leaveTeam: function (reason) {
        DCS.engine.world.leaveTeam(state, reason);
        p.teamChanges++;
      }
    };
  }

  function buildContext(state, rng, season) {
    var p = state.player;
    var team = DCS.engine.world.getTeam(state, p.teamId);
    var mates = team ? team.roster.filter(function (m) { return !m.isPlayer; }).map(function (m) { return m.nick; }) : [];
    var rivals = state.world.teams.filter(function (t) { return t.region === p.region && t.id !== p.teamId; })
      .slice(0, 8).map(function (t) {
        var r = t.roster[0];
        return r ? r.nick + ' (' + t.name + ')' : t.name;
      });
    var altRoles = D.ROLE_LIST.filter(function (r) { return r !== p.role; });
    var altRegions = D.REGION_LIST.filter(function (r) { return r !== p.region; });

    var c = {
      state: state,
      rng: rng,
      player: p,
      team: team,
      teammateNames: mates.length ? mates : null,
      rivalNames: rivals.length ? rivals : ['un rival de la región'],
      lastRating: state.career.lastRating === null || state.career.lastRating === undefined ? 55 : state.career.lastRating,
      altRole: rng.pick(altRoles),
      altRegion: rng.pick(altRegions)
    };
    c.fx = makeFx(state, rng, season);
    return c;
  }

  /**
   * Extrae un evento para la fase indicada. Devuelve null si no toca.
   */
  function draw(state, rng, phase, season, chance) {
    if (!rng.chance(chance === undefined ? 0.5 : chance)) return null;
    var c = buildContext(state, rng, season);

    var pool = D.EVENTS.filter(function (e) {
      if (e.phase !== phase && e.phase !== 'any') return false;
      if (state.usedEvents[e.id] && !rng.chance(0.35)) return false;   /* evita repetir demasiado */
      try { return e.when(c); } catch (err) { return false; }
    });
    if (!pool.length) return null;

    var chosen = rng.weighted(pool, function (e) { return Math.max(0, e.weight(c)); });
    if (!chosen) return null;

    var built = chosen.build(c);
    state.usedEvents[chosen.id] = (state.usedEvents[chosen.id] || 0) + 1;

    var inst = {
      id: 'e' + (state.counters.event++),
      key: chosen.id,
      year: state.year,
      age: state.player.age,
      title: built.title,
      text: built.text,
      tone: built.tone || 'neutral',
      options: (built.options || []).map(function (o) { return { label: o.label, hint: o.hint }; }),
      resolved: !built.options,
      outcome: null
    };
    if (built.options) {
      /* las funciones no se serializan: se recuperan por clave al resolver */
      inst.pendingKey = chosen.id;
      inst.ctxSnapshot = { altRole: c.altRole, altRegion: c.altRegion };
    }
    return inst;
  }

  /** Resuelve una decisión pendiente aplicando la opción elegida. */
  function resolve(state, rng, inst, optionIndex, season) {
    var def = null;
    for (var i = 0; i < D.EVENTS.length; i++) if (D.EVENTS[i].id === inst.pendingKey) def = D.EVENTS[i];
    if (!def) { inst.resolved = true; return 'La situación se resuelve sola.'; }

    var c = buildContext(state, rng, season);
    if (inst.ctxSnapshot) {
      c.altRole = inst.ctxSnapshot.altRole;
      c.altRegion = inst.ctxSnapshot.altRegion;
    }
    /* Los eventos con opciones no aplican efectos en build(): se puede
       reconstruir sin riesgo para recuperar las funciones de cada opción. */
    var rebuilt = def.build(c);
    var opt = (rebuilt.options || [])[optionIndex];
    if (!opt) { inst.resolved = true; return 'No haces nada.'; }

    var text = opt.apply(c);
    inst.resolved = true;
    inst.outcome = text;
    inst.chosen = opt.label;
    return text;
  }

  DCS.engine = DCS.engine || {};
  DCS.engine.events = { draw: draw, resolve: resolve, makeFx: makeFx, buildContext: buildContext };
})(window.DCS = window.DCS || {});
