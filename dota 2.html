    statGrid: statGrid, resultRow: resultRow, seriesList: seriesList,
    toneClass: toneClass
  };
})(window.DCS = window.DCS || {});
</script>
<script>
/* ============================================================
   UI / ANIM — vida en la interfaz
   ------------------------------------------------------------
   Animaciones cortas y con propósito: los números suben al
   aparecer, los resultados se revelan en cascada y los grandes
   títulos se celebran. Nada de esto altera el estado del juego.
   ============================================================ */
(function (DCS) {
  'use strict';

  var reduced = false;
  try {
    reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  } catch (e) { reduced = false; }

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  /** Recorre [data-count] y hace subir el número hasta su valor final. */
  function countUp(root, duration) {
    var nodes = (root || document).querySelectorAll('[data-count]');
    if (!nodes.length) return;
    var dur = duration || 460;

    for (var i = 0; i < nodes.length; i++) {
      (function (el) {
        var target = parseFloat(el.getAttribute('data-count'));
        var kind = el.getAttribute('data-fmt') || 'int';
        if (!isFinite(target)) { return; }

        /* números pequeños y enteros: sin teatro */
        if (reduced || (Math.abs(target) < 20 && kind === 'int')) {
          el.textContent = DCS.ui.fmt.stat(kind, target);
          el.removeAttribute('data-count');
          return;
        }

        var start = performance.now();
        el.removeAttribute('data-count');
        function frame(now) {
          var t = Math.min(1, (now - start) / dur);
          var v = target * easeOutCubic(t);
          el.textContent = DCS.ui.fmt.stat(kind, t === 1 ? target : v);
          if (t < 1) requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      })(nodes[i]);
    }
  }

  /** Escalona la aparición de una lista de elementos ya renderizados. */
  function stagger(selector, step, root) {
    var nodes = (root || document).querySelectorAll(selector);
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].style.animationDelay = (i * (step || 70)) + 'ms';
    }
  }

  /** Pantallazo de celebración para títulos grandes y The International. */
  function celebrate(o) {
    if (reduced) return;
    var el = document.createElement('div');
    el.className = 'celebrate';
    el.innerHTML = '<div class="c-inner">' +
      '<div class="c-kicker">' + DCS.ui.c.esc(o.kicker || '') + '</div>' +
      '<div class="c-title">' + DCS.ui.c.esc(o.title || '') + '</div>' +
      (o.sub ? '<div class="c-sub">' + DCS.ui.c.esc(o.sub) + '</div>' : '') +
      '</div>';
    document.body.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.remove(); }, 2700);
  }

  /**
   * Decide si un informe de competición merece celebración.
   * Solo lo grande: The International y títulos de prestigio.
   */
  function celebrateFromReport(report) {
    if (!report || !report.tournaments) return;
    var best = null;
    report.tournaments.forEach(function (t) {
      if (t.placement !== 1 || t.kind === 'qualifier') return;
      if (!best || t.prestige > best.prestige) best = t;
    });
    if (!best) return;
    if (best.kind === 'ti') {
      celebrate({ kicker: 'Campeones del mundo', title: best.name, sub: best.teamName + ' levanta el Aegis' });
    } else if (best.prestige >= 8) {
      celebrate({ kicker: 'Título internacional', title: best.name, sub: 'Campeón con ' + best.teamName });
    } else if (best.prestige >= 6) {
      celebrate({ kicker: 'Campeón', title: best.name, sub: 'con ' + best.teamName });
    }
  }

  DCS.ui.anim = {
    countUp: countUp,
    stagger: stagger,
    celebrate: celebrate,
    celebrateFromReport: celebrateFromReport,
    reduced: reduced
  };
})(window.DCS = window.DCS || {});
</script>
<script>
/* ============================================================
   UI / CHARTS — gráficos SVG sin dependencias
   ------------------------------------------------------------
   El gráfico de trayectoria es el mapa de la carrera: se ve de un
   vistazo el arranque, el crecimiento, el prime, el declive y la
   retirada. Y cada año es pulsable.
   ============================================================ */
(function (DCS) {
  'use strict';

  var U = DCS.util;
  var C = { ember: '#ff6b3d', teal: '#1fd9b0', gold: '#ffc247', blue: '#4d9dff', steel: '#8496ab', dim: '#8494a7' };

  function esc(s) { return DCS.ui.c.esc(s); }

  function bandColor(r) {
    if (r === null || r === undefined) return C.steel;
    if (r >= 90) return C.gold;
    if (r >= 80) return C.ember;
    if (r >= 70) return C.teal;
    if (r >= 60) return C.blue;
    return C.steel;
  }

  function tierColor(t) {
    return t === 1 ? C.ember : (t === 2 ? C.blue : (t === 3 ? C.steel : '#2a3646'));
  }

  /* --------------------------------------------------------
     Línea simple (evolución de un valor)
     -------------------------------------------------------- */
  function sparkline(series, opts) {
    opts = opts || {};
    var pts = series.filter(function (s) { return s.value !== null && s.value !== undefined; });
    if (pts.length < 2) return '<p class="empty">Aún no hay suficientes temporadas para dibujar la evolución.</p>';
    var w = 640, h = 150, padX = 26, padT = 14, padB = 24;
    var min = opts.min !== undefined ? opts.min : Math.min.apply(null, pts.map(function (p) { return p.value; })) - 5;
    var max = opts.max !== undefined ? opts.max : Math.max.apply(null, pts.map(function (p) { return p.value; })) + 5;
    if (max - min < 12) max = min + 12;
    var color = opts.color || C.ember;
    var id = 'sg' + Math.random().toString(36).slice(2, 7);
    var x = function (i) { return padX + (i / (pts.length - 1)) * (w - padX * 2); };
    var y = function (v) { return padT + (1 - (v - min) / (max - min)) * (h - padT - padB); };

    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(p.value).toFixed(1); }).join(' ');
    var area = line + ' L' + x(pts.length - 1).toFixed(1) + ',' + (h - padB) + ' L' + x(0).toFixed(1) + ',' + (h - padB) + ' Z';

    var grid = '';
    [0.25, 0.5, 0.75].forEach(function (g) {
      var gy = padT + g * (h - padT - padB);
      grid += '<line x1="' + padX + '" y1="' + gy + '" x2="' + (w - padX) + '" y2="' + gy +
        '" stroke="#1f2833" stroke-width="1"/>';
    });

    var dots = pts.map(function (p, i) {
      return '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(p.value).toFixed(1) + '" r="3" fill="' + color + '">' +
        '<title>' + esc(p.label + ': ' + p.value) + '</title></circle>';
    }).join('');

    var labels = pts.map(function (p, i) {
      if (pts.length > 10 && i % 2) return '';
      return '<text x="' + x(i).toFixed(1) + '" y="' + (h - 6) + '" fill="#8494a7" font-size="9.5" text-anchor="middle">' +
        esc(String(p.label).slice(-2)) + '</text>';
    }).join('');

    return '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:150px" preserveAspectRatio="none">' +
      '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="' + color + '" stop-opacity=".3"/>' +
      '<stop offset="100%" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>' +
      grid +
      '<path d="' + area + '" fill="url(#' + id + ')"/>' +
      '<path d="' + line + '" fill="none" stroke="' + color + '" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>' +
      dots + labels + '</svg>';
  }

  /* --------------------------------------------------------
     Trayectoria completa: rating + valoración + tier, pulsable
     -------------------------------------------------------- */
  function careerChart(history, openYear) {
    if (!history.length) return '<p class="empty">Todavía no has completado ninguna temporada.</p>';
    var n = history.length;
    var w = 900, h = 250, padX = 34, padT = 18, padB = 54;
    var innerH = h - padT - padB;
    var step = n > 1 ? (w - padX * 2) / (n - 1) : 0;
    var x = function (i) { return n > 1 ? padX + i * step : w / 2; };
    var y = function (v) { return padT + (1 - U.clamp(v, 0, 100) / 100) * innerH; };
    var colW = n > 1 ? step : (w - padX * 2);

    /* rejilla y referencias */
    var svg = '';
    [90, 75, 60, 45, 30].forEach(function (v) {
      svg += '<line x1="' + padX + '" y1="' + y(v) + '" x2="' + (w - padX) + '" y2="' + y(v) +
        '" stroke="#1f2833" stroke-width="1"/>' +
        '<text x="' + (padX - 8) + '" y="' + (y(v) + 3) + '" fill="#5d6c80" font-size="9" text-anchor="end">' + v + '</text>';
    });

    /* franja de tier bajo el gráfico */
    svg += '<text x="' + (padX - 8) + '" y="' + (h - padB + 21) + '" fill="#5d6c80" font-size="8.5" text-anchor="end" letter-spacing="1">TIER</text>';
    history.forEach(function (hh, i) {
      var cx = x(i) - colW / 2;
      svg += '<rect x="' + Math.max(0, cx).toFixed(1) + '" y="' + (h - padB + 12) + '" width="' + Math.max(2, colW - 2).toFixed(1) +
        '" height="7" rx="2" fill="' + tierColor(hh.tier) + '" opacity="' + (hh.tier ? '.9' : '.28') + '">' +
        '<title>' + esc(hh.year + ': ' + (hh.tier ? 'Tier ' + hh.tier : 'sin equipo')) + '</title></rect>';
    });

    /* líneas */
    function pathFor(getter) {
      var d = '', started = false;
      history.forEach(function (hh, i) {
        var v = getter(hh);
        if (v === null || v === undefined) { started = false; return; }
        d += (started ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(v).toFixed(1) + ' ';
        started = true;
      });
      return d.trim();
    }
    var overallPath = pathFor(function (hh) { return hh.overallEnd; });
    var ratingPath = pathFor(function (hh) { return hh.rating; });

    /* relleno bajo la línea de rating: da cuerpo a la trayectoria */
    var rated = history.filter(function (hh) { return hh.rating !== null && hh.rating !== undefined; });
    if (rated.length > 1) {
      var firstI = history.indexOf(rated[0]), lastI = history.indexOf(rated[rated.length - 1]);
      var gid = 'cg' + Math.random().toString(36).slice(2, 7);
      svg = '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="' + C.teal + '" stop-opacity=".26"/>' +
        '<stop offset="100%" stop-color="' + C.teal + '" stop-opacity="0"/></linearGradient></defs>' + svg +
        '<path d="' + ratingPath + ' L' + x(lastI).toFixed(1) + ',' + (h - padB) +
        ' L' + x(firstI).toFixed(1) + ',' + (h - padB) + ' Z" fill="url(#' + gid + ')"/>';
    }

    svg += '<path d="' + overallPath + '" fill="none" stroke="' + C.ember +
      '" stroke-width="2" stroke-linejoin="round" stroke-dasharray="4 4" opacity=".75"/>';
    svg += '<path d="' + ratingPath + '" fill="none" stroke="' + C.teal +
      '" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>';

    /* puntos, hitos y zonas pulsables */
    history.forEach(function (hh, i) {
      var cx = x(i), open = openYear === hh.year;
      if (hh.rating !== null && hh.rating !== undefined) {
        svg += '<circle class="dot" cx="' + cx.toFixed(1) + '" cy="' + y(hh.rating).toFixed(1) + '" r="' + (open ? 5.5 : 3.6) +
          '" fill="' + bandColor(hh.rating) + '" stroke="#080a0f" stroke-width="1.5"/>';
      }
      var titles = (hh.tournaments || []).filter(function (t) { return t.placement === 1 && t.kind !== 'qualifier' && t.prestige >= 6; }).length;
      var ti = (hh.tournaments || []).some(function (t) { return t.kind === 'ti'; });
      var tiWin = (hh.tournaments || []).some(function (t) { return t.kind === 'ti' && t.placement === 1; });
      if (tiWin) {
        svg += '<text x="' + cx.toFixed(1) + '" y="' + (y(hh.rating || 50) - 12) + '" fill="' + C.gold +
          '" font-size="15" text-anchor="middle">★</text>';
      } else if (titles) {
        svg += '<text x="' + cx.toFixed(1) + '" y="' + (y(hh.rating || 50) - 11) + '" fill="' + C.gold +
          '" font-size="11" text-anchor="middle">●</text>';
      } else if (ti) {
        svg += '<circle cx="' + cx.toFixed(1) + '" cy="' + (y(hh.rating || 50) - 12) + '" r="3" fill="none" stroke="' + C.gold + '" stroke-width="1.4"/>';
      }
      /* etiqueta de año */
      if (n <= 14 || i % 2 === 0 || open) {
        svg += '<text x="' + cx.toFixed(1) + '" y="' + (h - padB + 34) + '" fill="' + (open ? '#f0f4f9' : '#8494a7') +
          '" font-size="10" font-weight="' + (open ? '700' : '400') + '" text-anchor="middle">' + hh.year + '</text>';
      }
      svg += '<rect class="hit" data-action="toggle-year" data-value="' + hh.year + '" x="' + (cx - colW / 2).toFixed(1) +
        '" y="' + padT + '" width="' + Math.max(6, colW).toFixed(1) + '" height="' + (innerH + 26).toFixed(1) +
        '" fill="' + (open ? 'rgba(255,107,61,.10)' : 'transparent') + '">' +
        '<title>' + esc(hh.year + ' · ' + hh.age + ' años · ' + hh.teamName +
          (hh.rating !== null ? ' · rating ' + hh.rating : '')) + '</title></rect>';
    });

    var legend = '<div class="row small muted" style="justify-content:center;gap:18px;margin-top:6px">' +
      '<span><span style="display:inline-block;width:14px;height:2.6px;background:' + C.teal + ';vertical-align:middle;margin-right:6px"></span>Rating de temporada</span>' +
      '<span><span style="display:inline-block;width:14px;height:0;border-top:2px dashed ' + C.ember + ';vertical-align:middle;margin-right:6px"></span>Valoración</span>' +
      '<span><span style="color:' + C.gold + '">★</span> The International</span>' +
      '<span><span style="color:' + C.gold + '">●</span> Título de prestigio</span>' +
      '</div>';

    return '<svg class="tl-chart" viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:250px">' + svg + '</svg>' + legend;
  }

  /* --------------------------------------------------------
     Anillo de rating
     -------------------------------------------------------- */
  function ring(value, label) {
    if (value === null || value === undefined) {
      return '<div class="center muted small">Sin rating</div>';
    }
    var size = 116, stroke = 9, r = (size - stroke) / 2, cx = size / 2;
    var circ = 2 * Math.PI * r;
    var pct = U.clamp(value, 0, 100) / 100;
    var color = bandColor(value);
    return '<div style="display:flex;flex-direction:column;align-items:center;gap:6px">' +
      '<svg viewBox="0 0 ' + size + ' ' + size + '" style="width:116px;height:116px">' +
      '<circle cx="' + cx + '" cy="' + cx + '" r="' + r + '" fill="none" stroke="#212c3a" stroke-width="' + stroke + '"/>' +
      '<circle cx="' + cx + '" cy="' + cx + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="' + stroke +
      '" stroke-linecap="round" stroke-dasharray="' + circ.toFixed(1) + '" stroke-dashoffset="' + (circ * (1 - pct)).toFixed(1) +
      '" transform="rotate(-90 ' + cx + ' ' + cx + ')"/>' +
      '<text x="' + cx + '" y="' + (cx + 3) + '" text-anchor="middle" fill="#f0f4f9" font-size="30" font-weight="700" font-family="ui-monospace,Consolas,monospace">' +
      Math.round(value) + '</text>' +
      '<text x="' + cx + '" y="' + (cx + 20) + '" text-anchor="middle" fill="#8494a7" font-size="9" letter-spacing="1.5">/100</text>' +
      '</svg>' +
      (label ? '<span class="small muted">' + esc(label) + '</span>' : '') +
      '</div>';
  }

  DCS.ui.charts = {
    sparkline: sparkline,
    careerChart: careerChart,
    ring: ring,
    bandColor: bandColor,
    tierColor: tierColor
  };
})(window.DCS = window.DCS || {});
</script>
<script>
/* ============================================================
   UI / SCREENS · INICIO, CREACIÓN, DASHBOARD E INFORMES
   ============================================================ */
(function (DCS) {
  'use strict';

  var c = DCS.ui.c, fmt = DCS.ui.fmt, D = DCS.data;
  var S = DCS.ui.screens = DCS.ui.screens || {};

  /* ---------------------------------------------------------
     INICIO
     --------------------------------------------------------- */
  S.home = function () {
    var save = DCS.store.peek();
    var html = '<div class="hero">' +
      '<div class="kicker">Simulador de carrera profesional</div>' +
      '<h1>De pubs a <em>The International</em>.<br>O a ninguna parte.</h1>' +
      '<p>Creas a un jugador de 16 años sin nombre y sin equipo. A partir de ahí, ' +
      'cada decisión, cada temporada y cada golpe de suerte construyen una carrera que nadie ha jugado antes. ' +
      'La mayoría no llegan. Alguna sí.</p>' +
      '<div class="hero-actions">' +
      c.btn('Nueva carrera', 'new-career', { variant: 'primary', size: 'lg' }) +
      (save ? c.btn('Continuar', 'continue', { size: 'lg' }) : '') +
      '</div>';

    if (save) {
      html += '<div class="save-card">' + c.card({
        title: 'Partida guardada',
        meta: c.tierBadge(save.tier),
        body: '<div class="row" style="margin-bottom:10px">' +
          '<span style="font-size:18px;font-weight:700">' + c.esc(save.nick) + '</span>' +
          c.posChip(save.role) +
          (save.finished ? c.badge('Retirado', 'muted') : c.badge(save.year, 'info')) +
          '</div>' +
          '<div class="kv"><span>Edad</span><span>' + save.age + ' años</span></div>' +
          '<div class="kv"><span>Equipo</span><span>' + c.esc(save.teamName) + '</span></div>' +
          '<div class="kv"><span>Valoración</span><span>' + save.overall + '</span></div>',
        footer: c.btn('Continuar carrera', 'continue', { variant: 'primary' }) +
          c.btn('Borrar y empezar de cero', 'wipe', { variant: 'danger' })
      }) + '</div>';
    }

    html += '<p class="hero-note">Cada carrera genera su propia semilla. Recargar la página no cambia lo que ya ha pasado.' +
      (DCS.store.persistent ? '' : '<br><b>Aviso:</b> tu navegador ha bloqueado el almacenamiento local; la partida solo vivirá en esta pestaña.') +
      '</p></div>';
    return html;
  };

  /* ---------------------------------------------------------
     CREACIÓN DE JUGADOR
     --------------------------------------------------------- */
  S.create = function (draft) {
    var region = D.REGIONS[draft.region];
    var natOptions = region.nationalities.map(function (n) {
      return '<option value="' + c.esc(n) + '"' + (draft.nationality === n ? ' selected' : '') + '>' + c.esc(n) + '</option>';
    }).join('');

    var regionOptions = D.REGION_LIST.map(function (r) {
      return '<option value="' + r + '"' + (draft.region === r ? ' selected' : '') + '>' + D.REGIONS[r].name + '</option>';
    }).join('');

    var roles = D.ROLE_LIST.map(function (r) {
      var role = D.ROLES[r];
      return '<button data-action="pick-role" data-value="' + r + '" class="' + (draft.role === r ? 'sel' : '') + '">' +
        '<b>' + c.posChip(r) + ' ' + role.name + '</b><i>' + role.desc + '</i></button>';
    }).join('');

    var archs = D.ARCHETYPE_LIST.map(function (a) {
      var ar = D.ARCHETYPES[a];
      return '<button data-action="pick-arch" data-value="' + a + '" class="' + (draft.archetype === a ? 'sel' : '') + '">' +
        '<b>' + ar.name + '</b><i>' + ar.desc + '</i>' +
        '<i class="pro">+ ' + ar.pros + '</i><i class="con">− ' + ar.cons + '</i></button>';
    }).join('');

    var role = D.ROLES[draft.role], arch = D.ARCHETYPES[draft.archetype];

    return '<div class="page-head"><div><h2>Crear jugador</h2>' +
      '<div class="sub">Todos empiezan con 16 años. Lo demás está por escribirse.</div></div>' +
      '<div class="head-right">' + c.posChip(draft.role) + c.badge(arch.name, 'info') + c.badge(region.short) + '</div></div>' +

      c.card({
        title: 'Identidad',
        body: '<div class="form-grid">' +
          '<div class="field"><label>Nombre real</label>' +
          '<input id="f-name" type="text" maxlength="28" value="' + c.esc(draft.name) + '" placeholder="Nombre y apellido"></div>' +
          '<div class="field"><label>Nickname</label>' +
          '<input id="f-nick" type="text" maxlength="16" value="' + c.esc(draft.nick) + '" placeholder="Tu nombre en el escenario"></div>' +
          '<div class="field"><label>Región competitiva</label>' +
          '<select id="f-region">' + regionOptions + '</select>' +
          '<span class="hint">Define tu circuito, tus rivales y qué equipos te verán jugar.</span></div>' +
          '<div class="field"><label>Nacionalidad</label>' +
          '<select id="f-nat">' + natOptions + '</select>' +
          '<span class="hint">Edad de inicio: 16 años, fija para todos.</span></div>' +
          '</div>'
      }) +

      c.card({
        title: 'Posición', meta: c.posChipFull(draft.role),
        subtitle: 'Cambia tus atributos, tus estadísticas, tu desarrollo y tu mercado.',
        body: '<div class="pick">' + roles + '</div>'
      }) +

      c.card({
        title: 'Estilo', meta: c.badge(arch.name, 'info'),
        subtitle: 'Ninguno es mejor que otro: todos ganan algo y pagan algo.',
        body: '<div class="pick">' + archs + '</div>'
      }) +

      c.card({
        title: 'Empezar',
        body: '<p class="small muted">Tu potencial se genera ahora y permanece oculto. Solo lo descubrirás jugando ' +
          '— y tener techo alto tampoco garantiza alcanzarlo.</p>' +
          '<div class="row">' + c.btn('Comenzar carrera', 'create-submit', { variant: 'primary', size: 'lg' }) +
          c.btn('Volver', 'go-home', { variant: 'ghost' }) + '</div>'
      });
  };

  /* ---------------------------------------------------------
     DASHBOARD
     --------------------------------------------------------- */
  S.dashboard = function (state) {
    var p = state.player;
    var team = DCS.game.team();
    var role = D.ROLES[p.role];
    var career = state.career;
    var totalEarn = career.earnings.salary + career.earnings.prize + career.earnings.other;
    var last = career.lastRating;

    var head = c.card({
      title: 'Estado actual',
      meta: c.tierBadge(team ? team.tier : null) + c.posChip(p.role),
      body: c.kpis([
        c.kpi('Edad', p.age, state.year + ' · temporada ' + (p.proYears + 1)),
        c.kpi('Valoración', p.overall, 'máx ' + p.peakOverall, 'gold'),
        c.kpi('MMR', fmt.int(p.mmr), 'máx ' + fmt.int(p.peakMmr), null, { v: p.mmr, fmt: 'int' }),
        c.kpi('Rating', last === null ? '—' : last, 'última temporada', null, last === null ? null : { v: last, fmt: 'int' }),
        c.kpi('Reputación', Math.round(p.reputation), 'en el circuito'),
        c.kpi('Earnings', fmt.money(totalEarn), 'acumulado', null, { v: totalEarn, fmt: 'money' })
      ]) +
        '<div class="mt">' + c.tiles([
          c.tile('Equipo', team ? c.esc(team.name) : '<span class="muted">Libre</span>',
            team ? D.REGIONS[team.region].name : 'agente libre'),
          c.tile('Posición', role.short, role.name),
          c.tile('Forma', Math.round(p.form), estado(p.form), tone(p.form)),
          c.tile('Moral', Math.round(p.morale), estado(p.morale), tone(p.morale)),
          c.tile('Años pro', p.proYears, 'Tier 1: ' + (p.tierYears[1] || 0)),
          c.tile('Títulos', career.titles, career.tiWon ? 'TI: ' + career.tiWon : null, career.titles ? 'gold' : null)
        ]) + '</div>'
    });

    var contract = '';
    if (team && p.contract) {
      contract = c.card({
        title: 'Contrato', meta: c.badge(p.contract.years + (p.contract.years === 1 ? ' año' : ' años'), 'info'),
        body: '<div class="kv"><span>Equipo</span><span>' + c.esc(team.name) + '</span></div>' +
          '<div class="kv"><span>Salario anual</span><span>' + fmt.moneyFull(p.contract.salary) + '</span></div>' +
          '<div class="kv"><span>Objetivo del club</span><span>' + c.esc(p.contract.expectation) + '</span></div>' +
          '<div class="kv"><span>Sinergia del roster</span><span>' + team.synergy + '</span></div>' +
          (p.isCaptain ? '<div class="kv"><span>Rol interno</span><span>Capitán</span></div>' : '')
      });
    } else {
      contract = c.card({
        title: 'Situación contractual',
        body: '<p class="muted small">Eres agente libre. Sin equipo no hay mapas oficiales: ' +
          'grindeas pubs y esperas que alguien se fije en ti en el mercado.</p>' +
          '<div class="kv"><span>Temporadas sin equipo</span><span>' + p.seasonsWithoutTeam + '</span></div>'
      });
    }

    var training = c.card({
      title: 'Enfoque de entrenamiento',
      meta: c.badge(p.trainingFocus === 'balanced' ? 'Equilibrado' : attrLabel(p.trainingFocus), 'info'),
      subtitle: 'Se aplica al desarrollo del cierre de temporada. Concentrarte acelera un atributo y frena el resto.',
      body: '<div class="pick compact">' +
        '<button data-action="set-training" data-value="balanced" class="' + (p.trainingFocus === 'balanced' ? 'sel' : '') + '">' +
        '<b>Equilibrado</b><i>Progreso repartido, sin renuncias.</i></button>' +
        D.ATTRS.map(function (a) {
          return '<button data-action="set-training" data-value="' + a.key + '" class="' + (p.trainingFocus === a.key ? 'sel' : '') + '">' +
            '<b>' + a.label + '</b><i>Actual: ' + p.attrs[a.key] + '</i></button>';
        }).join('') + '</div>'
    });

    return '<div class="page-head"><div><h2>' + c.esc(p.nick) + '</h2>' +
      '<div class="sub">' + c.esc(p.name) + ' · ' + c.esc(p.nationality) + ' · ' +
      D.ARCHETYPES[p.archetype].name + '</div></div>' +
      '<div class="head-right">' + c.badge(D.REGIONS[p.region].name) + '</div></div>' +
      head + S.reportCard(state) + '<div class="grid grid-2">' + contract + training + '</div>';
  };

  function estado(v) {
    if (v >= 78) return 'excelente';
    if (v >= 60) return 'buena';
    if (v >= 42) return 'normal';
    if (v >= 26) return 'baja';
    return 'crítica';
  }
  function tone(v) { return v >= 70 ? 'good' : (v < 35 ? 'bad' : null); }
  function attrLabel(k) {
    for (var i = 0; i < D.ATTRS.length; i++) if (D.ATTRS[i].key === k) return D.ATTRS[i].label;
    return k;
  }

  /* ---------------------------------------------------------
     INFORME DE LA ÚLTIMA FASE
     --------------------------------------------------------- */
  S.reportCard = function (state) {
    var r = state.lastReport;
    if (!r) {
      return c.card({
        title: 'Próximo paso',
        body: '<p class="muted">Tu carrera empieza aquí. Pulsa <b>' + DCS.game.nextLabel() +
          '</b> abajo a la derecha (o la barra espaciadora) para avanzar.</p>'
      });
    }
    if (r.type === 'preseason') return S.reportPreseason(state, r);
    if (r.type === 'competition') return S.reportCompetition(state, r);
    if (r.type === 'review') return S.reportReview(state, r);
    if (r.type === 'market') return S.reportMarket(state, r);
    if (r.type === 'yearEnd') return S.reportYearEnd(state, r);
    return '';
  };

  function linesHtml(lines) {
    if (!lines || !lines.length) return '';
    return '<ul class="lines">' + lines.map(function (l) { return '<li>' + l + '</li>'; }).join('') + '</ul>';
  }

  function eventHtml(ev) {
    if (!ev) return '';
    var icon = ev.tone === 'great' ? '★' : (ev.tone === 'good' ? '▲' : (ev.tone === 'bad' ? '▼' : '◆'));
    return '<div class="event ' + c.toneClass(ev.tone) + '">' +
      '<h4><span class="muted small">' + icon + '</span> ' + c.esc(ev.title) + '</h4><p>' + c.esc(ev.text) + '</p>' +
      (ev.outcome ? '<div class="outcome"><b>' + c.esc(ev.chosen || '') + '</b> — ' + c.esc(ev.outcome) + '</div>' : '') +
      '</div>';
  }
  S.eventHtml = eventHtml;

  S.reportPreseason = function (state, r) {
    var body = '';
    if (r.team) {
      body += c.tiles([
        c.tile('Calidad del roster', r.team.quality),
        c.tile('Sinergia', r.team.synergy, null, r.team.synergy >= 65 ? 'good' : (r.team.synergy < 45 ? 'bad' : null)),
        c.tile('Reputación', r.team.reputation),
        c.tile('Recursos', r.team.resources),
        c.tile('Estilo', c.esc(r.team.style))
      ]) + '<div class="mt"></div>';
    }
    body += linesHtml(r.lines);
    if (r.plan && r.plan.length) {
      body += '<p class="small muted mt">Calendario previsto:</p><ul class="lines">' +
        r.plan.map(function (x) { return '<li>' + c.esc(x) + '</li>'; }).join('') + '</ul>';
    }
    body += eventHtml(r.event);
    return c.card({ title: r.title, meta: c.badge('Pretemporada', 'info'), body: body });
  };

  S.reportCompetition = function (state, r) {
    var open = DCS.ui.app.openTourn;
    var body = linesHtml(r.lines);

    if (r.totals && r.totals.acc.maps) {
      var a = r.totals.avg, acc = r.totals.acc;
      body += c.kpis([
        c.kpi('Mapas', acc.maps),
        c.kpi('Victorias', acc.wins, null, 'good'),
        c.kpi('Derrotas', acc.losses, null, 'bad'),
        c.kpi('Winrate', fmt.pct(a.winrate), null, null, { v: a.winrate, fmt: 'pct' }),
        c.kpi('Series', r.tournaments.reduce(function (s, t) { return s + t.seriesPlayed; }, 0)),
        c.kpi('KDA', fmt.dec(a.kda, 2), null, null, { v: a.kda, fmt: 'dec2' })
      ]) + '<div class="mt"></div>';
    }

    if (r.tournaments && r.tournaments.length) {
      body += '<p class="small muted" style="margin-bottom:8px">Pulsa cualquier torneo para ver serie a serie.</p>';
      body += r.tournaments.map(function (t, i) { return c.resultRow(t, open === t.id, i); }).join('');
    }
    body += eventHtml(r.event);
    return (r.ti ? S.tiCard(r.ti) : '') +
      c.card({ title: r.title, meta: c.badge('Competición', 'info'), body: body });
  };

  /* The International merece su propia ficha (§32) */
  S.tiCard = function (ti) {
    var champion = ti.placement === 1;
    return c.card({
      className: 'ti-card',
      title: ti.name,
      meta: c.badge(ti.via || 'Clasificado', 'gold'),
      body: '<div class="ti-head">' +
        '<span class="ti-result' + (champion ? ' champ' : '') + '">' + c.esc(ti.result) + '</span>' +
        (champion ? c.badge('★ campeón del mundo', 'gold') : c.badge(fmt.ordinal(ti.placement) + ' de ' + ti.field, 'muted')) +
        '</div>' +
        c.tiles([
          c.tile('Equipo', c.esc(ti.teamName)),
          c.tile('Mapas', ti.maps, ti.wins + '-' + ti.losses),
          c.tile('Series', ti.seriesPlayed, ti.seriesWon + '-' + ti.seriesLost),
          c.tile('Posición final', fmt.ordinal(ti.placement)),
          c.tile('Premio', fmt.money(ti.prize), null, 'gold', { v: ti.prize, fmt: 'money' }),
          c.tile('Rating', ti.rating)
        ]) +
        (ti.log && ti.log.length ? c.seriesList(ti.log) : '') +
        (ti.opponents && ti.opponents.length
          ? '<p class="small muted mt">Rivales en el evento: ' + ti.opponents.map(c.esc).join(' · ') + '</p>'
          : '')
    });
  };

  S.reportReview = function (state, r) {
    var rec = r.record;
    var avg = DCS.engine.stats.averages(rec.acc);
    var p = state.player;

    var left = '<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">' +
      DCS.ui.charts.ring(r.rating, 'Rating de temporada') +
      '<div style="flex:1;min-width:180px">' +
      '<div class="row" style="margin-bottom:10px">' + c.badge(rec.bestResult, rec.titles ? 'gold' : 'muted') + '</div>' +
      '<div class="kv"><span>Reputación</span><span>' + Math.round(p.reputation) + ' (' + fmt.signed(r.repDelta) + ')</span></div>' +
      '<div class="kv"><span>Valoración</span><span>' + p.overall + ' (' + fmt.signed(p.overall - r.dev.overallBefore) + ')</span></div>' +
      '<div class="kv"><span>MMR</span><span>' + fmt.int(p.mmr) + '</span></div>' +
      '<div class="kv"><span>Salario</span><span>' + fmt.money(rec.earnings.salary) + '</span></div>' +
      '<div class="kv"><span>Premios</span><span class="gold">' + fmt.money(rec.earnings.prize) + '</span></div>' +
      '</div></div>';

    var dev = '';
    if (r.dev && r.dev.deltas) {
      dev = D.ATTRS.map(function (a) {
        return c.attrRow(a.label, p.attrs[a.key], Math.round(r.dev.deltas[a.key]));
      }).join('');
    }

    var body = left +
      '<div class="mt">' + linesHtml(r.dev.notes.map(c.esc)) + '</div>';

    var cards = c.card({ title: r.title, meta: c.badge('Cierre', 'info'), body: body });

    if (rec.acc.maps) {
      cards += c.card({
        title: 'Cómo te ha evaluado el circuito',
        subtitle: 'Tus promedios frente al baremo de un ' + D.ROLES[rec.role].name + '. Esto es lo que pesa en tu rating.',
        body: c.statBars(rec.role, avg), delay: 60
      });
    }
    cards += c.card({ title: 'Desarrollo', subtitle: 'Cambio de atributos en la temporada.', body: dev, delay: 120 });
    if (r.event) cards += c.card({ title: 'Y además…', body: eventHtml(r.event), delay: 180 });
    return cards;
  };

  S.reportMarket = function (state, r) {
    var body;
    if (!r.offers.length) {
      body = '<p class="muted">' + (r.hasTeam
        ? 'Nadie ha llamado a tu puerta este año. Sigues donde estás.'
        : 'Ningún equipo te ha hecho una oferta. El teléfono no suena.') + '</p>';
    } else {
      body = '<p class="small muted">Tienes ' + r.offers.length + ' oferta' + (r.offers.length > 1 ? 's' : '') +
        ' sobre la mesa. No puedes cerrar el año sin responder.</p>' +
        '<div class="row">' + c.btn('Ver ofertas', 'nav', { value: 'offers', variant: 'primary' }) + '</div>';
    }
    return c.card({
      title: r.title,
      meta: c.badge('Valor de mercado ' + r.marketScore, 'info'),
      body: body
    });
  };

  S.reportYearEnd = function (state, r) {
    var body = linesHtml((r.notes || []).map(c.esc));
    if (!r.notes || !r.notes.length) body = '<p class="muted small">El año se cierra sin sobresaltos.</p>';
    body += '<p class="small mt">Cumples <b>' + r.age + '</b> años.</p>';
    return c.card({ title: r.title, meta: c.badge('Fin de año', 'info'), body: body });
  };
})(window.DCS = window.DCS || {});
</script>
<script>
/* ============================================================
   UI / SCREENS · PERFIL, EQUIPO, TEMPORADA, OFERTAS, CARRERA
   ============================================================ */
(function (DCS) {
  'use strict';

  var c = DCS.ui.c, fmt = DCS.ui.fmt, D = DCS.data, U = DCS.util;
  var S = DCS.ui.screens = DCS.ui.screens || {};
  var ch = function () { return DCS.ui.charts; };

  /* ---------------------------------------------------------
     PERFIL
     --------------------------------------------------------- */
  S.profile = function (state, tab) {
    var p = state.player;
    var role = D.ROLES[p.role];
    var perceived = DCS.engine.player.perceivedPotential(p, null);
    var opinion = DCS.engine.player.scoutingOpinion(perceived);
    var careerAvg = DCS.engine.stats.averages(state.career.acc);

    var head = '<div class="page-head"><div><h2>Perfil</h2><div class="sub">' +
      c.esc(p.nick) + ' · ' + D.ARCHETYPES[p.archetype].name + ' · ' + p.age + ' años</div></div>' +
      '<div class="head-right">' + c.posChipFull(p.role) + c.badge('General ' + p.overall, 'info') + '</div></div>' +
      c.tabs([
        { id: 'attrs', label: 'Atributos' },
        { id: 'evo', label: 'Evolución' },
        { id: 'stats', label: 'Estadísticas' }
      ], tab, 'tab-profile');

    if (tab === 'evo') {
      var evo = state.history.map(function (h) { return { label: h.year, value: h.overallEnd }; });
      var ratings = state.history.map(function (h) { return { label: h.year, value: h.rating }; });
      var mmr = state.history.map(function (h) { return { label: h.year, value: h.mmrEnd }; });
      return head +
        c.card({ title: 'Valoración general', subtitle: 'Tu nivel real año a año.', body: ch().sparkline(evo, { color: '#ff6b3d' }) }) +
        c.card({ title: 'Rating de temporada', subtitle: 'Cómo te evaluó el circuito cada año.', body: ch().sparkline(ratings, { color: '#1fd9b0', min: 0, max: 100 }), delay: 60 }) +
        c.card({ title: 'MMR', subtitle: 'Habilidad individual pura. Importa, pero no manda.', body: ch().sparkline(mmr, { color: '#4d9dff' }), delay: 120 });
    }

    if (tab === 'stats') {
      if (!state.career.acc || !state.career.acc.maps) {
        return head + c.card({ title: 'Sin datos', body: c.empty('Todavía no has disputado mapas oficiales.') });
      }
      return head +
        c.card({
          title: 'Promedios de carrera · ' + role.name, meta: state.career.maps + ' mapas',
          body: c.statGrid(p.role, careerAvg)
        }) +
        c.card({
          title: 'Frente al baremo de tu posición',
          subtitle: 'Dónde caen tus números entre un jugador flojo y uno de élite en ' + role.name + '.',
          body: c.statBars(p.role, careerAvg), delay: 60
        });
    }

    return head +
      '<div class="grid grid-2">' +
      c.card({
        title: 'Atributos', meta: c.badge('General ' + p.overall, 'info'),
        body: D.ATTRS.map(function (a) { return c.attrRow(a.label, p.attrs[a.key]); }).join('') +
          '<p class="small muted mt">La valoración general se pondera con los criterios de ' + role.name +
          '. Un ' + role.name + ' y un Hard Support no necesitan lo mismo para llegar a 90.</p>'
      }) +
      c.card({
        title: 'Estado y percepción',
        body: c.tiles([
          c.tile('Forma', Math.round(p.form)),
          c.tile('Moral', Math.round(p.morale)),
          c.tile('Reputación', Math.round(p.reputation)),
          c.tile('Experiencia', Math.round(p.experience)),
          c.tile('MMR', fmt.int(p.mmr), null, null, { v: p.mmr, fmt: 'int' }),
          c.tile('MMR máximo', fmt.int(p.peakMmr), null, null, { v: p.peakMmr, fmt: 'int' })
        ]) +
          '<div class="mt">' +
          '<div class="kv"><span>Opinión del scouting</span><span>' + opinion + '</span></div>' +
          '<div class="kv"><span>Mejor valoración alcanzada</span><span>' + p.peakOverall + '</span></div>' +
          '<div class="kv"><span>Equipos en su carrera</span><span>' + p.teamsPlayed.length + '</span></div></div>' +
          '<p class="small muted mt">Nadie conoce tu techo real, ni siquiera tú. Solo se descubre jugando.</p>',
        delay: 60
      }) +
      '</div>';
  };

  /* ---------------------------------------------------------
     EQUIPO
     --------------------------------------------------------- */
  S.team = function (state) {
    var team = DCS.game.team();
    if (!team) {
      return '<div class="page-head"><div><h2>Equipo</h2><div class="sub">Agente libre</div></div></div>' +
        c.card({
          title: 'Sin equipo',
          body: '<p class="muted">Ahora mismo no perteneces a ninguna organización. Grindeas pubs, ' +
            'juegas tryouts y esperas que alguien se fije en ti en el mercado.</p>' +
            '<div class="kv"><span>Temporadas seguidas sin equipo</span><span>' + state.player.seasonsWithoutTeam + '</span></div>'
        });
    }

    var rows = team.roster.map(function (m) {
      return {
        attrs: m.isPlayer ? 'class="you"' : '',
        cells: [
          (m.isPlayer ? '<span class="nick">' + c.esc(m.nick) + '</span>' : c.esc(m.nick)),
          c.posChip(m.role),
          '<span class="mono">' + m.rating + '</span>',
          m.age + '',
          m.isPlayer ? '<span class="muted">Tú</span>' : c.esc(m.name)
        ]
      };
    });

    var season = state.season && state.season.tournaments.length ? state.season.tournaments : [];
    var open = DCS.ui.app.openTourn;

    return '<div class="page-head"><div><h2>' + c.esc(team.name) + '</h2><div class="sub">' +
      D.REGIONS[team.region].name + ' · Estilo ' + team.style + '</div></div>' +
      '<div class="head-right">' + c.tierBadge(team.tier) + '</div></div>' +

      c.card({
        title: 'Organización',
        body: c.kpis([
          c.kpi('Calidad', DCS.engine.world.rosterQuality(team), 'del roster'),
          c.kpi('Sinergia', team.synergy, 'química interna'),
          c.kpi('Reputación', team.reputation, 'del club'),
          c.kpi('Recursos', team.resources, 'presupuesto'),
          c.kpi('Puntos', team.points, 'circuito')
        ]) +
          '<div class="mt"><div class="kv"><span>Expectativa</span><span>' + c.esc(team.expectation) + '</span></div></div>'
      }) +

      c.card({ title: 'Roster', meta: c.badge(team.roster.length + ' jugadores'), body: c.table(['Jugador', 'Pos', 'Rating', 'Edad', 'Nombre'], rows), delay: 60 }) +

      (season.length ? c.card({
        title: 'Resultados de la temporada',
        subtitle: 'Pulsa un torneo para ver el recorrido serie a serie.',
        body: season.map(function (t, i) { return c.resultRow(t, open === t.id, i); }).join(''),
        delay: 120
      }) : '');
  };

  /* ---------------------------------------------------------
     TEMPORADA
     --------------------------------------------------------- */
  S.season = function (state, tab) {
    var s = state.season;
    var useHistory = (!s || !s.acc || !s.acc.maps) && state.history.length;
    var rec = useHistory ? state.history[state.history.length - 1] : null;
    var acc = rec ? rec.acc : (s ? s.acc : null);
    var role = rec ? rec.role : state.player.role;
    var tournaments = rec ? rec.tournaments : (s ? s.tournaments : []);
    var title = rec ? 'Temporada ' + rec.year : 'Temporada ' + state.year;
    var rating = rec ? rec.rating : (s ? s.rating : null);

    var head = '<div class="page-head"><div><h2>' + title + '</h2><div class="sub">' +
      D.ROLES[role].name + ' · ' + (rec ? c.esc(rec.teamName) : (DCS.game.team() ? c.esc(DCS.game.team().name) : 'Sin equipo')) +
      '</div></div><div class="head-right">' + c.posChip(role) +
      (rating !== null && rating !== undefined ? c.ratingChip(rating) : '') + '</div></div>';

    if (!acc || !acc.maps) {
      return head + c.card({
        title: 'Sin mapas oficiales',
        body: '<p class="muted">Todavía no has disputado partidas oficiales esta temporada.</p>'
      });
    }

    head += c.tabs([
      { id: 'summary', label: 'Resumen' },
      { id: 'stats', label: 'Estadísticas' },
      { id: 'tourn', label: 'Torneos' }
    ], tab, 'tab-season');

    var avg = DCS.engine.stats.averages(acc);
    var sw = rec ? rec.seriesWon : s.seriesWon;
    var sl = rec ? rec.seriesLost : s.seriesLost;
    var sp = rec ? rec.seriesPlayed : s.seriesPlayed;
    var stints = (rec ? rec.stints : (s ? s.stints : [])) || [];
    var open = DCS.ui.app.openTourn;

    if (tab === 'stats') {
      return head +
        c.card({ title: 'Estadísticas · ' + D.ROLES[role].name, meta: acc.maps + ' mapas', body: c.statGrid(role, avg) }) +
        c.card({
          title: 'Frente al baremo de la posición',
          subtitle: 'Esto es exactamente lo que pesa en tu rating de temporada.',
          body: c.statBars(role, avg), delay: 60
        });
    }

    if (tab === 'tourn') {
      return head + c.card({
        title: 'Torneos', subtitle: 'Pulsa cualquier torneo para desplegar el recorrido serie a serie.',
        body: tournaments.length
          ? tournaments.map(function (t, i) { return c.resultRow(t, open === t.id, i); }).join('')
          : c.empty('Sin torneos disputados.')
      });
    }

    var stintHtml = '';
    if (stints.length > 1) {
      stintHtml = c.card({
        title: 'Desglose por equipo',
        subtitle: 'Cambiaste de equipo durante el año: el total anual se conserva y el reparto también.',
        body: c.table(['Equipo', 'Mapas', 'V', 'D', 'Winrate'],
          stints.map(function (x) {
            return [c.esc(x.teamName), x.acc.maps, '<span class="good">' + x.acc.wins + '</span>',
            '<span class="bad">' + x.acc.losses + '</span>', fmt.pct(x.acc.maps ? x.acc.wins / x.acc.maps : 0)];
          }).concat([[
            '<b>TOTAL</b>', '<b>' + acc.maps + '</b>', '<b>' + acc.wins + '</b>',
            '<b>' + acc.losses + '</b>', '<b>' + fmt.pct(avg.winrate) + '</b>'
          ]])),
        delay: 60
      });
    }

    return head +
      c.card({
        title: 'Resumen',
        meta: rating !== null && rating !== undefined ? c.ratingChip(rating) : '',
        body: c.kpis([
          c.kpi('Mapas', acc.maps),
          c.kpi('Victorias', acc.wins, null, 'good'),
          c.kpi('Derrotas', acc.losses, null, 'bad'),
          c.kpi('Winrate', fmt.pct(avg.winrate), null, null, { v: avg.winrate, fmt: 'pct' }),
          c.kpi('Series', sp, sw + '-' + sl),
          c.kpi('Torneos', tournaments.filter(function (t) { return t.kind !== 'qualifier'; }).length)
        ])
      }) +
      stintHtml +
      c.card({
        title: 'Torneos de la temporada',
        body: tournaments.length
          ? tournaments.map(function (t, i) { return c.resultRow(t, open === t.id, i); }).join('')
          : c.empty('Sin torneos disputados.'),
        delay: 120
      });
  };

  /* ---------------------------------------------------------
     OFERTAS
     --------------------------------------------------------- */
  S.offers = function (state) {
    var offers = state.offers || [];
    var p = state.player;
    if (!offers.length) {
      return '<div class="page-head"><div><h2>Mercado</h2><div class="sub">Sin ofertas activas</div></div></div>' +
        c.card({
          title: 'Nada sobre la mesa',
          body: '<p class="muted">No tienes ofertas pendientes ahora mismo. El mercado se abre al cerrar cada temporada.</p>'
        });
    }

    var bestTier = Math.min.apply(null, offers.map(function (o) { return o.tier; }));

    var html = '<div class="page-head"><div><h2>Mercado</h2><div class="sub">' + offers.length +
      ' oferta' + (offers.length > 1 ? 's' : '') + ' · decide antes de cerrar el año</div></div>' +
      '<div class="head-right">' + c.badge('No siempre gana el mejor equipo', 'muted') + '</div></div>';

    html += offers.map(function (o, i) {
      var roleChanged = o.role !== p.role;
      var top = o.tier === bestTier;
      return '<div class="' + c.cls(['offer', 'reveal', o.isRenewal ? 'renewal' : '', top && !o.isRenewal ? 'top' : '']) +
        '" style="animation-delay:' + (i * 70) + 'ms">' +
        '<div class="offer-head"><span class="oname">' + c.esc(o.teamName) + '</span>' +
        c.tierBadge(o.tier) + c.badge(D.REGIONS[o.region].short) +
        (o.isRenewal ? c.badge('Renovación', 'good') : '') +
        (roleChanged ? c.badge('Cambio de rol', 'gold') : '') + '</div>' +
        c.tiles([
          c.tile('Rol', D.ROLES[o.role].short, D.ROLES[o.role].name),
          c.tile('Duración', o.years + (o.years === 1 ? ' año' : ' años')),
          c.tile('Salario', fmt.money(o.salary), 'por temporada', 'gold', { v: o.salary, fmt: 'money' }),
          c.tile('Nivel del roster', o.rosterLevel),
          c.tile('Sinergia', o.synergy),
          c.tile('Reputación', o.reputation)
        ]) +
        '<div class="mt"><div class="kv"><span>Expectativa</span><span>' + c.esc(o.expectation) + '</span></div>' +
        '<div class="kv"><span>Perspectiva competitiva</span><span>' + c.esc(o.odds) + '</span></div></div>' +
        (o.note ? '<p class="note">' + c.esc(o.note) + '</p>' : '') +
        '<div class="offer-actions">' +
        c.btn('Aceptar y firmar', 'accept-offer', { value: o.id, variant: top ? 'primary' : undefined }) +
        '</div></div>';
    }).join('');

    html += c.card({
      title: 'Rechazar todo',
      body: '<p class="small muted">Puedes quedarte donde estás o seguir libre esperando algo mejor. ' +
        'No siempre llega.</p>' + c.btn('Rechazar todas las ofertas', 'decline-offers', { variant: 'danger' })
    });
    return html;
  };

  /* ---------------------------------------------------------
     CARRERA
     --------------------------------------------------------- */
  S.career = function (state, tab, openYear) {
    var p = state.player;
    var cr = state.career;
    var avg = DCS.engine.stats.averages(cr.acc);
    var totalEarn = cr.earnings.salary + cr.earnings.prize + cr.earnings.other;

    var head = '<div class="page-head"><div><h2>Carrera</h2><div class="sub">' +
      c.esc(p.nick) + ' · semilla <span class="seed">' + c.esc(state.seed) + '</span></div></div>' +
      '<div class="head-right">' + c.posChip(p.role) + c.badge(p.proYears + ' temporadas pro', 'info') + '</div></div>' +
      c.tabs([
        { id: 'timeline', label: 'Trayectoria' },
        { id: 'totals', label: 'Totales' },
        { id: 'teams', label: 'Equipos' }
      ], tab, 'tab-career');

    if (tab === 'totals') {
      var played = cr.rolesPlayed || {};
      var roleKeys = Object.keys(played);
      var roleSplit = roleKeys.length > 1
        ? '<p class="small muted mt">Has jugado en varias posiciones: ' +
        roleKeys.map(function (r) { return D.ROLES[r].name + ' (' + played[r] + ' mapas)'; }).join(' · ') +
        '. Cada dato se promedia sobre los mapas en los que se registró.</p>'
        : '';

      return head +
        c.card({
          title: 'Totales de carrera',
          body: c.kpis([
            c.kpi('Mapas', cr.maps),
            c.kpi('Victorias', cr.wins, null, 'good'),
            c.kpi('Derrotas', cr.losses, null, 'bad'),
            c.kpi('Winrate', fmt.pct(cr.maps ? cr.wins / cr.maps : 0), null, null, { v: cr.maps ? cr.wins / cr.maps : 0, fmt: 'pct' }),
            c.kpi('Series', cr.seriesPlayed, cr.seriesWon + '-' + cr.seriesLost),
            c.kpi('Títulos', cr.titles, cr.tournaments + ' torneos', 'gold')
          ]) +
            '<div class="mt">' + c.tiles([
              c.tile('TI disputados', cr.tiPlayed),
              c.tile('TI ganados', cr.tiWon, null, cr.tiWon ? 'gold' : null),
              c.tile('Mejor rating', cr.bestRating === null ? '—' : cr.bestRating, cr.bestSeason || ''),
              c.tile('MMR máximo', fmt.int(p.peakMmr), null, null, { v: p.peakMmr, fmt: 'int' }),
              c.tile('Años Tier 1', p.tierYears[1] || 0),
              c.tile('Años Tier 2', p.tierYears[2] || 0),
              c.tile('Años Tier 3', p.tierYears[3] || 0),
              c.tile('Earnings', fmt.money(totalEarn), null, 'gold', { v: totalEarn, fmt: 'money' }),
              c.tile('Salarios', fmt.money(cr.earnings.salary), null, null, { v: cr.earnings.salary, fmt: 'money' }),
              c.tile('Premios', fmt.money(cr.earnings.prize), null, 'gold', { v: cr.earnings.prize, fmt: 'money' })
            ]) + '</div>'
        }) +
        (cr.acc && cr.acc.maps ? c.card({
          title: 'Promedios de carrera · ' + D.ROLES[p.role].name,
          body: c.statGrid(p.role, avg) + roleSplit, delay: 60
        }) : '') +
        retireCard(state);
    }

    if (tab === 'teams') {
      var map = {};
      state.history.forEach(function (h) {
        h.stints.forEach(function (st) {
          if (!map[st.teamId]) map[st.teamId] = { name: st.teamName, tier: st.tier, seasons: 0, maps: 0, wins: 0, losses: 0, from: h.year, to: h.year };
          var e = map[st.teamId];
          e.seasons++; e.maps += st.acc.maps; e.wins += st.acc.wins; e.losses += st.acc.losses;
          e.to = h.year;
          if (st.tier && (!e.tier || st.tier < e.tier)) e.tier = st.tier;
        });
      });
      var list = Object.keys(map).map(function (k) { return map[k]; });
      return head + c.card({
        title: 'Equipos en tu carrera', meta: c.badge(list.length + ' clubes'),
        body: list.length ? c.table(['Equipo', 'Tier', 'Años', 'Temporadas', 'Mapas', 'V-D', 'Winrate'],
          list.map(function (e) {
            return [c.esc(e.name), c.tierBadge(e.tier), e.from + (e.to !== e.from ? '–' + e.to : ''),
            e.seasons, e.maps, '<span class="good">' + e.wins + '</span>-<span class="bad">' + e.losses + '</span>',
            fmt.pct(e.maps ? e.wins / e.maps : 0)];
          })) : c.empty('Todavía no has jugado en ningún equipo.')
      }) + retireCard(state);
    }

    var timeline = state.history.length
      ? '<div class="timeline">' + state.history.slice().reverse().map(function (h) {
        return yearItem(state, h, openYear === h.year);
      }).join('') + '</div>'
      : c.empty('Todavía no has completado ninguna temporada.');

    return head +
      c.card({
        title: 'Mapa de la carrera',
        subtitle: 'Inicio, crecimiento, prime, declive y retirada. Pulsa cualquier año para abrirlo.',
        body: ch().careerChart(state.history, openYear)
      }) +
      c.card({ title: 'Temporada a temporada', body: timeline, delay: 60 }) +
      retireCard(state);
  };

  function retireCard(state) {
    if (state.finished) return '';
    return c.card({
      title: 'Colgar el ratón',
      body: '<p class="small muted">Puedes retirarte cuando quieras. La carrera se cierra al instante y ' +
        'se calcula tu legado con todo lo conseguido hasta hoy.</p>' +
        c.btn('Retirarme ahora', 'retire-now', { variant: 'danger' }),
      delay: 120
    });
  }

  function yearItem(state, h, open) {
    var tierCls = h.tier ? 't' + h.tier : '';
    var head = '<div class="tl-item ' + tierCls + '" data-action="toggle-year" data-value="' + h.year + '">' +
      '<div class="tl-head">' +
      '<span class="tl-year">' + h.year + '</span>' +
      '<span class="muted small">' + h.age + ' años</span>' +
      c.tierBadge(h.tier) +
      '<span class="tl-team">' + c.esc(h.teamName) + '</span>' +
      (h.titles ? c.badge('★ ' + h.titles, 'gold') : '') +
      '<span class="tl-right">' + c.ratingChip(h.rating) + '</span>' +
      '</div>' +
      '<div class="tl-best">' + c.esc(h.bestResult) + '</div></div>';
    return head + (open ? yearDetail(state, h) : '');
  }

  function yearDetail(state, h) {
    var avg = DCS.engine.stats.averages(h.acc);
    var open = DCS.ui.app.openTourn;
    var body = c.tiles([
      c.tile('Mapas', h.acc.maps),
      c.tile('Victorias', h.acc.wins, null, 'good'),
      c.tile('Derrotas', h.acc.losses, null, 'bad'),
      c.tile('Winrate', fmt.pct(avg.winrate)),
      c.tile('Series', h.seriesPlayed, h.seriesWon + '-' + h.seriesLost),
      c.tile('Rating', h.rating === null ? '—' : h.rating),
      c.tile('MMR final', fmt.int(h.mmrEnd)),
      c.tile('Salario', fmt.money(h.earnings.salary)),
      c.tile('Premios', fmt.money(h.earnings.prize), null, 'gold')
    ]);

    if (h.acc.maps) body += '<div class="mt">' + c.statGrid(h.role, avg) + '</div>';

    if (h.stints.length > 1) {
      body += '<div class="mt">' + c.table(['Etapa', 'Mapas', 'V', 'D', 'Winrate'],
        h.stints.map(function (x) {
          return [c.esc(x.teamName), x.acc.maps, x.acc.wins, x.acc.losses,
          fmt.pct(x.acc.maps ? x.acc.wins / x.acc.maps : 0)];
        }).concat([['<b>TOTAL ' + h.year + '</b>', '<b>' + h.acc.maps + '</b>', '<b>' + h.acc.wins + '</b>',
          '<b>' + h.acc.losses + '</b>', '<b>' + fmt.pct(avg.winrate) + '</b>']])) + '</div>';
    }

    if (h.tournaments.length) {
      body += '<div class="mt">' + h.tournaments.map(function (t, i) {
        return c.resultRow(t, open === t.id, i);
      }).join('') + '</div>';
    }

    if (h.events && h.events.length) {
      body += '<div class="mt">' + h.events.map(function (e) {
        return '<div class="event ' + c.toneClass(e.tone) + '"><h4>' + c.esc(e.title) + '</h4>' +
          '<p>' + c.esc(e.text) + '</p>' +
          (e.outcome ? '<div class="outcome"><b>' + c.esc(e.chosen || '') + '</b> — ' + c.esc(e.outcome) + '</div>' : '') +
          '</div>';
      }).join('') + '</div>';
    }

    if (h.devNotes && h.devNotes.length) {
      body += '<ul class="lines mt">' + h.devNotes.map(function (n) { return '<li>' + c.esc(n) + '</li>'; }).join('') + '</ul>';
    }

    return '<div class="tl-detail">' + body + '</div>';
  }

  /* ---------------------------------------------------------
     LEGADO
     --------------------------------------------------------- */
  S.legacy = function (state) {
    var l = state.legacy;
    var p = state.player;
    var cr = state.career;
    if (!l) {
      return '<div class="page-head"><div><h2>Legado</h2></div></div>' +
        c.card({ title: 'Carrera en curso', body: '<p class="muted">Tu legado se escribirá cuando cuelgues el ratón.</p>' });
    }
    var avg = DCS.engine.stats.averages(cr.acc);
    var totalEarn = cr.earnings.salary + cr.earnings.prize + cr.earnings.other;

    var html = '<div class="legacy-hero">' +
      '<div class="kicker">Tu legado</div>' +
      '<h1>' + c.esc(p.nick) + '</h1>' +
      '<div class="muted small">' + c.esc(p.name) + ' · ' + c.esc(p.nationality) + ' · ' +
      D.ROLES[p.role].name + ' · retirado a los ' + l.retireAge + '</div>' +
      '<div class="cat">' + c.esc(l.category) + '</div>' +
      '<p class="desc">' + c.esc(l.categoryDesc) + '</p></div>';

    if (state.history.length > 1) {
      html += c.card({
        title: 'La carrera de un vistazo',
        body: DCS.ui.charts.careerChart(state.history, null)
      });
    }

    html += c.card({
      title: 'La carrera en números',
      body: c.kpis([
        c.kpi('Años pro', l.proYears),
        c.kpi('Mapas', cr.maps),
        c.kpi('Winrate', fmt.pct(l.winrate), cr.wins + '-' + cr.losses, null, { v: l.winrate, fmt: 'pct' }),
        c.kpi('Títulos', cr.titles, null, 'gold'),
        c.kpi('TI', cr.tiPlayed, cr.tiWon + ' ganados', cr.tiWon ? 'gold' : null),
        c.kpi('Earnings', fmt.money(totalEarn), null, 'gold', { v: totalEarn, fmt: 'money' })
      ]) +
        '<div class="mt">' + c.tiles([
          c.tile('Equipos', l.teams),
          c.tile('Series', cr.seriesPlayed, cr.seriesWon + '-' + cr.seriesLost),
          c.tile('Torneos', cr.tournaments),
          c.tile('Mejor rating', cr.bestRating === null ? '—' : cr.bestRating, cr.bestSeason || ''),
          c.tile('MMR máximo', fmt.int(p.peakMmr), null, null, { v: p.peakMmr, fmt: 'int' }),
          c.tile('Valoración máxima', p.peakOverall)
        ]) + '</div>',
      delay: 60
    });

    if (cr.acc.maps) {
      html += c.card({ title: 'Promedios · ' + D.ROLES[p.role].name, body: c.statGrid(p.role, avg), delay: 120 });
    }

    html += '<div class="grid grid-2">' +
      c.card({
        title: 'Momento álgido',
        body: (l.prime
          ? '<div class="kv"><span>Prime</span><span>' + l.prime.from + '–' + l.prime.to + '</span></div>' +
          '<div class="kv"><span>Rating medio en el prime</span><span>' + l.prime.avg + '</span></div>'
          : '<p class="muted">Nunca llegaste a encadenar un prime reconocible.</p>') +
          (l.mainTeam ? '<div class="kv"><span>Equipo más importante</span><span>' + c.esc(l.mainTeam.name) + '</span></div>' +
            '<div class="kv"><span>Temporadas allí</span><span>' + l.mainTeam.seasons + '</span></div>' : ''),
        delay: 180
      }) +
      c.card({
        title: 'Logros principales',
        body: '<ul class="lines">' + l.achievements.map(function (a) { return '<li>' + c.esc(a) + '</li>'; }).join('') + '</ul>' +
          (l.bigTitles.list.length ? '<p class="small muted mt">Títulos de prestigio:</p><ul class="lines">' +
            l.bigTitles.list.map(function (t) { return '<li>' + c.esc(t) + '</li>'; }).join('') + '</ul>' : ''),
        delay: 180
      }) + '</div>';

    html += c.card({
      title: 'Y ahora',
      body: '<p class="small muted">Cada carrera nueva genera una semilla distinta, un mundo distinto y un techo distinto. ' +
        'Esta fue la tuya: <span class="seed">' + c.esc(state.seed) + '</span></p>' +
        '<div class="row">' + c.btn('Empezar una carrera nueva', 'new-career', { variant: 'primary' }) + '</div>',
      delay: 240
    });

    return html;
  };
})(window.DCS = window.DCS || {});
</script>
<script>
/* ============================================================
   UI / APP — router, acciones, teclado y arranque
   ============================================================ */
(function (DCS) {
  'use strict';

  var c = DCS.ui.c, fmt = DCS.ui.fmt, D = DCS.data;
  var S = DCS.ui.screens;

  var NAV = [
    { id: 'dashboard', label: 'Dashboard' },
    { id: 'profile', label: 'Perfil' },
    { id: 'team', label: 'Equipo' },
    { id: 'season', label: 'Temporada' },
    { id: 'offers', label: 'Ofertas' },
    { id: 'career', label: 'Carrera' },
    { id: 'legacy', label: 'Legado' }
  ];

  var PHASES = [
    { id: 'preseason', label: 'Pretemporada' },
    { id: 'competition', label: 'Competición' },
    { id: 'review', label: 'Cierre' },
    { id: 'market', label: 'Mercado' },
    { id: 'yearEnd', label: 'Fin de año' }
  ];

  var app = {
    view: 'home',
    openYear: null,
    openTourn: null,
    tab: { profile: 'attrs', season: 'summary', career: 'timeline' },
    draft: null,
    root: null,

    newDraft: function () {
      return {
        name: '', nick: '', region: 'eeu',
        nationality: D.REGIONS.eeu.nationalities[0],
        role: 'mid', archetype: 'mechanical'
      };
    },

    go: function (view) {
      app.view = view;
      app.render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },

    toast: function (msg) {
      var old = document.querySelector('.toast');
      if (old) old.remove();
      var el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(function () { if (el.parentNode) el.remove(); }, 2800);
    },

    /* ------------------------------------------------------- */
    render: function () {
      var state = DCS.game.state;
      var html;

      if (app.view === 'home') html = S.home();
      else if (app.view === 'create') html = S.create(app.draft || (app.draft = app.newDraft()));
      else if (!state) { app.view = 'home'; html = S.home(); }
      else html = app.shell(state);

      app.root.innerHTML = html;
      if (app.view === 'create') app.wireCreate();
      if (state && state.pending) app.renderModal(state);
      DCS.ui.anim.countUp(app.root);
    },

    shell: function (state) {
      var p = state.player;
      var team = DCS.game.team();
      var body;
      switch (app.view) {
        case 'profile': body = S.profile(state, app.tab.profile); break;
        case 'team': body = S.team(state); break;
        case 'season': body = S.season(state, app.tab.season); break;
        case 'offers': body = S.offers(state); break;
        case 'career': body = S.career(state, app.tab.career, app.openYear); break;
        case 'legacy': body = S.legacy(state); break;
        default: body = S.dashboard(state);
      }

      var nav = NAV.map(function (n) {
        var badge = '';
        if (n.id === 'offers' && state.offers && state.offers.length) {
          badge = ' <span class="badge badge-gold">' + state.offers.length + '</span>';
        }
        return '<button data-action="nav" data-value="' + n.id + '" class="' +
          (app.view === n.id ? 'active' : '') + '">' + n.label + badge + '</button>';
      }).join('');

      var last = state.career.lastRating;
      var hud = '<div class="hud">' +
        '<div class="hud-item"><span class="hud-k">Edad</span><span class="hud-v">' + p.age + '</span></div>' +
        '<div class="hud-item"><span class="hud-k">Val</span><span class="hud-v" style="color:var(--gold)">' + p.overall + '</span></div>' +
        '<div class="hud-item"><span class="hud-k">MMR</span><span class="hud-v">' + fmt.int(p.mmr) + '</span></div>' +
        '<div class="hud-item"><span class="hud-k">Rating</span><span class="hud-v">' + (last === null ? '—' : last) + '</span></div>' +
        '<div class="hud-item"><span class="hud-k">Rep</span><span class="hud-v">' + Math.round(p.reputation) + '</span></div>' +
        '</div>';

      return '<div class="app">' +
        '<header class="topbar">' +
        '<div class="brand"><i></i><span>DOTA 2</span><b>CAREER</b></div>' +
        '<div class="identity"><span class="nick">' + c.esc(p.nick) + '</span>' +
        c.posChip(p.role) +
        '<span class="meta">' + (team ? c.esc(team.name) : 'Agente libre') + '</span></div>' +
        '<div class="topbar-right">' + hud +
        c.badge(state.year, 'info') + '</div></header>' +

        '<div class="shell"><nav class="nav">' + nav +
        '<div class="nav-sep"></div>' +
        '<button data-action="go-home">Inicio</button>' +
        '</nav><main class="main">' + body + '</main></div>' +

        app.advanceBar(state) +
        '</div>';
    },

    phaseTrack: function (state) {
      var current = state.season ? state.season.phase : 'preseason';
      if (current === 'done') current = 'preseason';
      var idx = 0;
      PHASES.forEach(function (ph, i) { if (ph.id === current) idx = i; });
      var html = '<div class="phase-track">';
      PHASES.forEach(function (ph, i) {
        var cls = i < idx ? 'done' : (i === idx ? 'now' : '');
        html += '<span class="phase-step ' + cls + '">' +
          (i ? '<span class="phase-line"></span>' : '') +
          '<span class="phase-dot" title="' + c.esc(ph.label) + '"></span></span>';
      });
      return html + '</div><span class="phase-name">' + c.esc(PHASES[idx].label) + '</span>';
    },

    advanceBar: function (state) {
      if (state.finished) {
        return '<div class="advance">' +
          '<span class="hint">Carrera finalizada · ' + (state.legacy ? c.esc(state.legacy.category) : '') + '</span>' +
          '<span class="spacer"></span>' +
          c.btn('Ver legado', 'nav', { value: 'legacy' }) +
          c.btn('Nueva carrera', 'new-career', { variant: 'primary' }) +
          '</div>';
      }
      if (state.pending) {
        return '<div class="advance"><span class="hint">Tienes una decisión pendiente</span>' +
          '<span class="spacer"></span>' + c.btn('Resolver', 'show-pending', { variant: 'primary' }) + '</div>';
      }
      var offersPending = state.offers && state.offers.length;
      return '<div class="advance">' +
        app.phaseTrack(state) +
        '<span class="spacer"></span>' +
        (offersPending
          ? '<span class="hint gold">' + state.offers.length + ' oferta(s) sin responder</span>' +
          c.btn('Ver ofertas', 'nav', { value: 'offers', variant: 'gold' })
          : c.btn('Saltar al mercado', 'advance-fast', { variant: 'ghost' })) +
        c.btn(DCS.game.nextLabel(), 'advance', { variant: 'primary', key: 'espacio' }) +
        '</div>';
    },

    /* ------------------------------------------------------- */
    renderModal: function (state) {
      var pend = state.pending;
      var html = '';
      if (pend.type === 'event') {
        var ev = DCS.engine.season.findUnresolvedEvent(state);
        if (!ev) { state.pending = null; return; }
        html = '<div class="modal-bg"><div class="modal">' +
          '<div class="modal-head"><div class="modal-kicker">Decisión</div><h3>' + c.esc(ev.title) + '</h3></div>' +
          '<div class="modal-body"><p>' + c.esc(ev.text) + '</p><div class="choices">' +
          ev.options.map(function (o, i) {
            return '<button class="choice" data-action="choose" data-value="' + i + '">' +
              '<b>' + c.esc(o.label) + '</b><span>' + c.esc(o.hint || '') + '</span></button>';
          }).join('') +
          '</div><p class="small muted mt">Nadie te va a decir qué pasa después.</p></div></div></div>';
      } else if (pend.type === 'retirement') {
        var d = pend.data;
        html = '<div class="modal-bg"><div class="modal">' +
          '<div class="modal-head"><div class="modal-kicker">Fin de ciclo</div><h3>¿Ha llegado el momento?</h3></div>' +
          '<div class="modal-body"><p>' + c.esc(d.text) + '</p>' +
          '<ul class="lines">' + d.reasons.map(function (r) { return '<li>' + c.esc(r) + '</li>'; }).join('') + '</ul>' +
          '<div class="choices">' +
          '<button class="choice" data-action="retire-no"><b>Continuar mi carrera</b>' +
          '<span>Seguir intentándolo: bajar de tier, cambiar de región o de rol, reconstruirte.</span></button>' +
          '<button class="choice" data-action="retire-yes"><b>Retirarme</b>' +
          '<span>Cerrar la carrera aquí y descubrir tu legado.</span></button>' +
          '</div></div></div></div>';
      }
      if (html) app.root.insertAdjacentHTML('beforeend', html);
    },

    /* ------------------------------------------------------- */
    wireCreate: function () {
      var reg = document.getElementById('f-region');
      if (!reg) return;
      reg.addEventListener('change', function () {
        app.readDraft();
        app.draft.region = reg.value;
        app.draft.nationality = D.REGIONS[reg.value].nationalities[0];
        app.render();
      });
    },

    readDraft: function () {
      var g = function (id) { var el = document.getElementById(id); return el ? el.value : null; };
      var d = app.draft;
      if (g('f-name') !== null) d.name = g('f-name');
      if (g('f-nick') !== null) d.nick = g('f-nick');
      if (g('f-region') !== null) d.region = g('f-region');
      if (g('f-nat') !== null) d.nationality = g('f-nat');
      return d;
    },

    /* ------------------------------------------------------- */
    handle: function (action, value) {
      var state = DCS.game.state;

      switch (action) {
        case 'new-career':
          if (DCS.store.hasSave() && !confirm('Ya existe una carrera guardada. Empezar una nueva la borrará. ¿Continuar?')) return;
          DCS.game.reset();
          app.draft = app.newDraft();
          app.go('create');
          return;

        case 'wipe':
          if (!confirm('Se borrará la carrera guardada. ¿Seguro?')) return;
          DCS.game.reset();
          app.render();
          return;

        case 'continue':
          if (DCS.game.resume()) app.go(DCS.game.state.finished ? 'legacy' : 'dashboard');
          else app.toast('No hay ninguna partida guardada.');
          return;

        case 'go-home':
          app.go('home');
          return;

        case 'pick-role':
          app.readDraft(); app.draft.role = value; app.render(); return;

        case 'pick-arch':
          app.readDraft(); app.draft.archetype = value; app.render(); return;

        case 'create-submit': {
          var d = app.readDraft();
          if (!d.nick || !d.nick.trim()) { app.toast('Necesitas un nickname.'); return; }
          if (!d.name || !d.name.trim()) d.name = d.nick.trim();
          DCS.game.start({
            name: d.name.trim(), nick: d.nick.trim(), nationality: d.nationality,
            region: d.region, role: d.role, archetype: d.archetype
          });
          app.openYear = null; app.openTourn = null;
          app.toast('Carrera creada. Semilla ' + DCS.game.state.seed);
          app.go('dashboard');
          return;
        }

        case 'nav':
          app.go(value); return;

        case 'tab-profile': app.tab.profile = value; app.render(); return;
        case 'tab-season': app.tab.season = value; app.render(); return;
        case 'tab-career': app.tab.career = value; app.render(); return;

        case 'set-training':
          DCS.game.setTraining(value);
          app.toast(value === 'balanced' ? 'Entrenamiento equilibrado.' : 'Entrenamiento enfocado.');
          app.render();
          return;

        case 'advance': {
          var before = state.season ? state.season.phase : null;
          var r = DCS.game.advance();
          if (r && r.blocked && r.reason === 'offers') {
            app.toast('Responde al mercado antes de cerrar el año.');
            app.go('offers');
            return;
          }
          if (r && r.legacy) { app.go('legacy'); return; }
          app.openTourn = null;
          if (app.view !== 'dashboard' && !(DCS.game.state.offers || []).length) app.view = 'dashboard';
          if (before === 'market' && DCS.game.state.offers.length) app.view = 'offers';
          app.render();
          if (r && r.type === 'competition') DCS.ui.anim.celebrateFromReport(r);
          return;
        }

        case 'advance-fast': {
          var reports = DCS.game.advanceUntilInput(6);
          var st = DCS.game.state;
          if (st.finished) { app.go('legacy'); return; }
          app.openTourn = null;
          app.view = (st.offers && st.offers.length) ? 'offers' : 'dashboard';
          app.render();
          for (var i = 0; i < reports.length; i++) {
            if (reports[i] && reports[i].type === 'competition') DCS.ui.anim.celebrateFromReport(reports[i]);
          }
          return;
        }

        case 'accept-offer': {
          var offer = null;
          (state.offers || []).forEach(function (o) { if (o.id === value) offer = o; });
          if (!offer) return;
          if (DCS.game.acceptOffer(value)) {
            app.toast('Has firmado con ' + offer.teamName + '.');
            app.go('dashboard');
          }
          return;
        }

        case 'decline-offers':
          DCS.game.declineOffers();
          app.toast('Has rechazado todas las ofertas.');
          app.go('dashboard');
          return;

        case 'choose': {
          var out = DCS.game.resolveEvent(parseInt(value, 10));
          app.render();
          if (out && out.outcome) app.toast(out.outcome.slice(0, 110));
          return;
        }

        case 'retire-yes':
          DCS.game.answerRetirement(true);
          app.go('legacy');
          return;

        case 'retire-no':
          DCS.game.answerRetirement(false);
          app.toast('Sigues adelante.');
          app.render();
          return;

        case 'retire-now':
          if (!confirm('¿Retirarte ahora y cerrar la carrera?')) return;
          DCS.game.retireNow();
          app.go('legacy');
          return;

        case 'show-pending':
          app.render();
          return;

        case 'toggle-year':
          app.openYear = (app.openYear === parseInt(value, 10)) ? null : parseInt(value, 10);
          if (app.view === 'career') app.tab.career = 'timeline';
          app.render();
          return;

        case 'toggle-tourn':
          app.openTourn = (app.openTourn === value) ? null : value;
          app.render();
          return;
      }
    },

    /* ------------------------------------------------------- */
    keydown: function (e) {
      var tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
      var state = DCS.game.state;
      var modal = document.querySelector('.modal');

      if (modal) {
        /* en una decisión, 1 y 2 eligen opción */
        if (e.key === '1' || e.key === '2' || e.key === '3') {
          var choices = modal.querySelectorAll('.choice');
          var idx = parseInt(e.key, 10) - 1;
          if (choices[idx]) { e.preventDefault(); choices[idx].click(); }
        }
        return;
      }

      if (e.code === 'Space' || e.key === 'Enter') {
        var btn = document.querySelector('.advance [data-action="advance"]');
        if (btn && !btn.disabled) { e.preventDefault(); btn.click(); }
        return;
      }
      /* 1-7 saltan de pantalla */
      if (state && /^[1-7]$/.test(e.key)) {
        var n = NAV[parseInt(e.key, 10) - 1];
        if (n) { e.preventDefault(); app.go(n.id); }
      }
    },

    boot: function () {
      app.root = document.getElementById('root');
      document.addEventListener('click', function (e) {
        var el = e.target.closest ? e.target.closest('[data-action]') : null;
        if (!el) return;
        e.preventDefault();
        app.handle(el.getAttribute('data-action'), el.getAttribute('data-value'));
      });
      document.addEventListener('keydown', app.keydown);
      app.render();
    }
  };

  DCS.ui.app = app;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', app.boot);
  else app.boot();
})(window.DCS = window.DCS || {});
</script>
