<title>Dota Career Sim</title>
<meta name="description" content="Simulador de carrera profesional de Dota 2: crea un jugador de 16 anos y descubre hasta donde llega.">
<style>
/* ============================================================
   DOTA 2 CAREER SIMULATOR — sistema visual
   ------------------------------------------------------------
   Oscuro, competitivo, con identidad propia.
   Color con SIGNIFICADO: cada tier, cada posición y cada banda
   de rendimiento tienen su propio tono y se distinguen de un
   vistazo. Nada de gradientes decorativos ni neón gratuito.
   ============================================================ */

:root {
  /* --- superficies --- */
  --bg: #080a0f;
  --bg-2: #0c1016;
  --panel: #131922;
  --panel-2: #172029;
  --panel-3: #1d2733;
  --line: #2a3646;
  --line-soft: #1f2833;

  /* --- texto (contraste alto) --- */
  --text: #f0f4f9;
  --text-2: #b3c1d1;
  --text-3: #8494a7;

  /* --- acentos semánticos --- */
  --ember: #ff6b3d;
  --ember-2: #cc4a22;
  --gold: #ffc247;
  --teal: #1fd9b0;
  --red: #ff5a75;
  --blue: #4d9dff;
  --violet: #a78bfa;
  --steel: #8496ab;

  /* --- tiers: escala de calor --- */
  --tier1: #ff6b3d;
  --tier2: #4d9dff;
  --tier3: #7f8fa4;

  /* --- posiciones: cinco tonos inconfundibles --- */
  --pos1: #ff6b3d;
  --pos2: #ffc247;
  --pos3: #1fd9b0;
  --pos4: #4d9dff;
  --pos5: #a78bfa;

  --radius: 12px;
  --radius-s: 7px;
  --mono: ui-monospace, "Cascadia Mono", "Consolas", "SF Mono", monospace;
  --sans: "Segoe UI", Inter, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --shadow: 0 16px 40px rgba(0, 0, 0, .5);
  --shadow-s: 0 4px 14px rgba(0, 0, 0, .3);
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}

/* Fondo: rejilla técnica muy tenue + dos focos fríos/cálidos */
body::before {
  content: "";
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    linear-gradient(rgba(255, 255, 255, .016) 1px, transparent 1px) 0 0 / 100% 44px,
    linear-gradient(90deg, rgba(255, 255, 255, .016) 1px, transparent 1px) 0 0 / 44px 100%,
    radial-gradient(1000px 520px at 8% -12%, rgba(255, 107, 61, .10), transparent 62%),
    radial-gradient(900px 520px at 102% 2%, rgba(77, 157, 255, .07), transparent 58%);
  mask-image: linear-gradient(180deg, #000 0%, #000 60%, transparent 100%);
}

button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; font-weight: 660; letter-spacing: -.01em; }
p { margin: 0 0 .6rem; }
a { color: var(--ember); }
::selection { background: rgba(255, 107, 61, .32); }

/* Scrollbar propia */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg-2); }
::-webkit-scrollbar-thumb { background: #253040; border-radius: 6px; border: 2px solid var(--bg-2); }
::-webkit-scrollbar-thumb:hover { background: #33445a; }

/* ============================================================
   LAYOUT
   ============================================================ */
.app { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }

.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 16px;
  padding: 0 18px; height: 58px;
  background: rgba(8, 10, 15, .9);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}

.brand { display: flex; align-items: center; gap: 9px; font-weight: 800; letter-spacing: .16em; font-size: 11px; text-transform: uppercase; }
.brand i { width: 4px; height: 20px; background: var(--ember); display: block; transform: skewX(-14deg); box-shadow: 6px 0 0 -1px rgba(255, 107, 61, .35); }
.brand span { color: var(--text-3); }
.brand b { color: var(--text); }

.identity { display: flex; align-items: center; gap: 10px; min-width: 0; }
.identity .nick { font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.identity .meta { color: var(--text-3); font-size: 12.5px; white-space: nowrap; }

.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }

/* Micro-marcadores siempre visibles en la barra superior */
.hud { display: flex; gap: 2px; align-items: stretch; }
.hud-item {
  display: flex; flex-direction: column; justify-content: center;
  padding: 0 12px; border-left: 1px solid var(--line-soft); min-width: 62px;
}
.hud-item:first-child { border-left: 0; }
.hud-k { font-size: 9.5px; text-transform: uppercase; letter-spacing: .14em; color: var(--text-3); }
.hud-v { font-family: var(--mono); font-size: 14px; font-weight: 700; line-height: 1.2; }

.shell { flex: 1; display: flex; align-items: flex-start; }

.nav {
  width: 194px; flex: none; padding: 18px 10px; position: sticky; top: 58px;
  border-right: 1px solid var(--line-soft); min-height: calc(100vh - 58px);
}
.nav button {
  position: relative; display: flex; align-items: center; gap: 10px; width: 100%;
  background: none; border: 0; border-radius: var(--radius-s);
  color: var(--text-2); padding: 10px 12px; cursor: pointer; text-align: left;
  font-size: 13.5px; font-weight: 550; letter-spacing: .01em;
  transition: background .16s, color .16s, transform .16s;
}
.nav button:hover { background: var(--panel); color: var(--text); transform: translateX(2px); }
.nav button.active {
  background: linear-gradient(90deg, rgba(255, 107, 61, .18), rgba(255, 107, 61, .02));
  color: var(--text);
}
.nav button.active::before {
  content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px;
  background: var(--ember); border-radius: 0 3px 3px 0; box-shadow: 0 0 12px rgba(255, 107, 61, .6);
}
.nav .nav-sep { height: 1px; background: var(--line-soft); margin: 12px 8px; }

.main { flex: 1; min-width: 0; padding: 22px 26px 110px; max-width: 1200px; }

.page-head { margin-bottom: 18px; display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.page-head h2 { font-size: 23px; letter-spacing: -.02em; }
.page-head .sub { color: var(--text-3); font-size: 13px; }
.page-head .head-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }

/* ============================================================
   CARDS
   ============================================================ */
.card {
  position: relative;
  background: linear-gradient(180deg, var(--panel), var(--panel-2));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  margin-bottom: 14px;
  box-shadow: var(--shadow-s);
}
.card > .card-accent {
  position: absolute; left: 14px; right: 14px; top: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255, 107, 61, .55), transparent);
}
.card-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 0; }
.card-head h3 {
  font-size: 11.5px; text-transform: uppercase; letter-spacing: .16em;
  color: var(--text-3); font-weight: 700;
}
.card-meta { margin-left: auto; font-size: 12px; color: var(--text-3); display: flex; gap: 8px; align-items: center; }
.card-sub { padding: 8px 16px 0; color: var(--text-2); font-size: 13.5px; }
.card-body { padding: 15px 16px; }
.card-foot { padding: 13px 16px; border-top: 1px solid var(--line-soft); display: flex; gap: 8px; flex-wrap: wrap; }

.grid { display: grid; gap: 14px; }
.grid-2 { grid-template-columns: 1fr 1fr; }
.grid-3 { grid-template-columns: repeat(3, 1fr); }

/* ============================================================
   TILES / KPI
   ============================================================ */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 8px; }

/* Rejillas equilibradas: nada de un dato huérfano estirado al final.
   El número de columnas se elige según cuántos elementos hay. */
@media (min-width: 700px) {
  .tiles[data-n="1"] { grid-template-columns: repeat(1, 1fr); }
  .tiles[data-n="2"] { grid-template-columns: repeat(2, 1fr); }
  .tiles[data-n="3"] { grid-template-columns: repeat(3, 1fr); }
  .tiles[data-n="4"], .tiles[data-n="8"], .tiles[data-n="12"] { grid-template-columns: repeat(4, 1fr); }
  .tiles[data-n="5"], .tiles[data-n="10"], .tiles[data-n="15"] { grid-template-columns: repeat(5, 1fr); }
  .tiles[data-n="6"], .tiles[data-n="9"] { grid-template-columns: repeat(3, 1fr); }
  .tiles[data-n="7"], .tiles[data-n="11"] { grid-template-columns: repeat(4, 1fr); }
  .tiles[data-n="13"], .tiles[data-n="14"] { grid-template-columns: repeat(5, 1fr); }

  .kpis[data-n="2"] { grid-template-columns: repeat(2, 1fr); }
  .kpis[data-n="3"] { grid-template-columns: repeat(3, 1fr); }
  .kpis[data-n="4"] { grid-template-columns: repeat(4, 1fr); }
  .kpis[data-n="5"] { grid-template-columns: repeat(5, 1fr); }
  .kpis[data-n="6"] { grid-template-columns: repeat(6, 1fr); }
}
@media (max-width: 699px) {
  .tiles[data-n="5"], .tiles[data-n="6"] { grid-template-columns: repeat(2, 1fr); }
  .kpis[data-n="5"], .kpis[data-n="6"] { grid-template-columns: repeat(3, 1fr); }
  .kpis[data-n="4"] { grid-template-columns: repeat(2, 1fr); }
}
.tile {
  background: rgba(255, 255, 255, .026);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-s);
  padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; min-width: 0;
  transition: border-color .16s, background .16s;
}
.tile:hover { border-color: var(--line); background: rgba(255, 255, 255, .04); }
.tile-label { font-size: 10px; text-transform: uppercase; letter-spacing: .13em; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile-value { font-family: var(--mono); font-size: 19px; font-weight: 700; letter-spacing: -.03em; line-height: 1.2; }
.tile-sub { font-size: 11px; color: var(--text-3); }
.tile.tone-good .tile-value { color: var(--teal); }
.tile.tone-bad .tile-value { color: var(--red); }
.tile.tone-gold .tile-value { color: var(--gold); }
.tile.tone-ember .tile-value { color: var(--ember); }
.tile.tone-blue .tile-value { color: var(--blue); }

/* Cabecera de estado con números grandes.
   auto-fill (y no auto-fit) evita que el último dato se estire solo
   ocupando toda una fila cuando el número de KPIs no cuadra. */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 6px; }
.kpi {
  background: rgba(255, 255, 255, .026); border: 1px solid var(--line-soft);
  border-radius: var(--radius-s); padding: 11px 13px;
  display: flex; flex-direction: column; gap: 2px; min-width: 0;
}
.kpi-k { font-size: 9.5px; text-transform: uppercase; letter-spacing: .15em; color: var(--text-3); }
.kpi-v { font-family: var(--mono); font-size: 24px; font-weight: 700; letter-spacing: -.04em; line-height: 1.1; }
.kpi-s { font-size: 11px; color: var(--text-3); }

/* ============================================================
   BARRAS Y ATRIBUTOS
   ============================================================ */
.bar { display: block; flex: 1; height: 7px; border-radius: 4px; background: rgba(255, 255, 255, .07); overflow: hidden; }
.bar-fill { display: block; height: 100%; border-radius: 4px; background: var(--steel); transition: width .7s cubic-bezier(.2, .85, .3, 1); }
.bar-fill.tone-hi { background: linear-gradient(90deg, var(--ember), var(--gold)); }
.bar-fill.tone-mid { background: linear-gradient(90deg, var(--blue), var(--teal)); }
.bar-fill.tone-lo { background: #55697f; }
.bar-fill.tone-min { background: #3b4757; }

.attr { display: flex; align-items: center; gap: 12px; padding: 6px 0; }
.attr-name { width: 112px; flex: none; font-size: 12.5px; color: var(--text-2); }
.attr-val { width: 30px; text-align: right; font-family: var(--mono); font-size: 13.5px; font-weight: 600; }
.attr-delta { width: 34px; text-align: right; font-family: var(--mono); font-size: 11.5px; }
.attr-delta.up { color: var(--teal); }
.attr-delta.down { color: var(--red); }

/* Barra de estadística contra el baremo del rol */
.statbar { padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
.statbar:last-child { border-bottom: 0; }
.statbar-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.statbar-name { font-size: 12.5px; color: var(--text-2); }
.statbar-val { margin-left: auto; font-family: var(--mono); font-size: 13.5px; font-weight: 700; }
.statbar-track {
  position: relative; height: 8px; border-radius: 4px; overflow: hidden;
  background: linear-gradient(90deg, rgba(255, 90, 117, .22) 0%, rgba(132, 150, 171, .18) 45%, rgba(31, 217, 176, .22) 78%, rgba(255, 194, 71, .28) 100%);
}
.statbar-mark {
  position: absolute; top: -3px; width: 3px; height: 14px; border-radius: 2px;
  background: var(--text); box-shadow: 0 0 0 2px rgba(8, 10, 15, .85), 0 0 12px rgba(255, 255, 255, .35);
  transition: left .8s cubic-bezier(.2, .85, .3, 1);
}
.statbar-scale { display: flex; justify-content: space-between; font-size: 9.5px; color: var(--text-3); margin-top: 5px; letter-spacing: .06em; text-transform: uppercase; }

/* ============================================================
   BADGES / CHIPS
   ============================================================ */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 10px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase;
  padding: 4px 9px; border-radius: 5px;
  background: rgba(255, 255, 255, .06); color: var(--text-2); border: 1px solid var(--line);
  white-space: nowrap;
}
.badge-t1 { color: #ffd9c9; border-color: rgba(255, 107, 61, .55); background: rgba(255, 107, 61, .16); }
.badge-t2 { color: #cfe4ff; border-color: rgba(77, 157, 255, .5); background: rgba(77, 157, 255, .14); }
.badge-t3 { color: #ccd6e2; border-color: rgba(127, 143, 164, .45); background: rgba(127, 143, 164, .12); }
.badge-gold { color: #ffe6ad; border-color: rgba(255, 194, 71, .55); background: rgba(255, 194, 71, .15); }
.badge-good { color: #adf5e3; border-color: rgba(31, 217, 176, .45); background: rgba(31, 217, 176, .13); }
.badge-bad { color: #ffc4cf; border-color: rgba(255, 90, 117, .45); background: rgba(255, 90, 117, .13); }
.badge-info { color: #cfe4ff; border-color: rgba(77, 157, 255, .4); background: rgba(77, 157, 255, .1); }
.badge-muted { color: var(--text-3); }

/* Chip de posición, con color propio por rol */
.pos-chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
  padding: 4px 9px; border-radius: 5px; white-space: nowrap;
  border: 1px solid currentColor; background: rgba(255, 255, 255, .04);
}
.pos-chip::before { content: ""; width: 6px; height: 6px; border-radius: 2px; background: currentColor; }
.pos-carry { color: var(--pos1); }
.pos-mid { color: var(--pos2); }
.pos-offlane { color: var(--pos3); }
.pos-pos4 { color: var(--pos4); }
.pos-pos5 { color: var(--pos5); }

/* Rating con seis bandas claramente distintas */
.rating-chip {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 42px; padding: 3px 8px; border-radius: 6px;
  font-family: var(--mono); font-weight: 800; font-size: 13.5px;
  border: 1px solid var(--line); background: rgba(255, 255, 255, .05); color: var(--text-2);
}
.rating-chip.r-elite { color: #10161f; background: var(--gold); border-color: var(--gold); box-shadow: 0 0 16px rgba(255, 194, 71, .35); }
.rating-chip.r-great { color: #14100d; background: var(--ember); border-color: var(--ember); }
.rating-chip.r-good { color: #06201b; background: var(--teal); border-color: var(--teal); }
.rating-chip.r-ok { color: #cfe4ff; background: rgba(77, 157, 255, .18); border-color: rgba(77, 157, 255, .5); }
.rating-chip.r-mid { color: var(--text-2); background: rgba(132, 150, 171, .16); border-color: rgba(132, 150, 171, .4); }
.rating-chip.r-bad { color: #ffc4cf; background: rgba(255, 90, 117, .16); border-color: rgba(255, 90, 117, .45); }
.rating-chip.none { color: var(--text-3); }

/* ============================================================
   BOTONES
   ============================================================ */
.btn {
  position: relative;
  background: var(--panel-3); color: var(--text);
  border: 1px solid var(--line); border-radius: var(--radius-s);
  padding: 10px 17px; cursor: pointer; font-size: 13.5px; font-weight: 650;
  letter-spacing: .01em; transition: transform .12s, border-color .16s, background .16s, box-shadow .16s;
  white-space: nowrap;
}
.btn:hover { border-color: #3d4f66; background: #222d3b; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .42; cursor: not-allowed; }
.btn-primary {
  background: linear-gradient(180deg, #ff7a4f, var(--ember-2));
  border-color: #ff8a63; color: #fff;
  box-shadow: 0 6px 20px rgba(255, 107, 61, .28);
}
.btn-primary:hover { filter: brightness(1.08); background: linear-gradient(180deg, #ff7a4f, var(--ember-2)); }
.btn-gold { background: linear-gradient(180deg, #ffce68, #d99a1f); border-color: #ffd77f; color: #1a1206; box-shadow: 0 6px 20px rgba(255, 194, 71, .25); }
.btn-ghost { background: none; }
.btn-danger { border-color: rgba(255, 90, 117, .5); color: #ffc4cf; background: rgba(255, 90, 117, .08); }
.btn-block { display: block; width: 100%; }
.btn-lg { padding: 14px 24px; font-size: 15px; }
.btn kbd {
  margin-left: 8px; font-family: var(--mono); font-size: 10.5px; opacity: .7;
  border: 1px solid currentColor; border-radius: 3px; padding: 0 4px;
}

/* ============================================================
   BARRA DE AVANCE + PROGRESO DE TEMPORADA
   ============================================================ */
.advance {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: flex; align-items: center; gap: 16px;
  padding: 11px 20px;
  background: rgba(8, 10, 15, .94); backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
}
.advance .hint { color: var(--text-3); font-size: 12.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.advance .spacer { flex: 1; }

.phase-track { display: flex; align-items: center; gap: 0; }
.phase-step { display: flex; align-items: center; gap: 0; }
.phase-dot {
  width: 9px; height: 9px; border-radius: 50%; flex: none;
  background: #2a3646; border: 1px solid #38475b; transition: all .3s;
}
.phase-step.done .phase-dot { background: var(--teal); border-color: var(--teal); }
.phase-step.now .phase-dot {
  background: var(--ember); border-color: var(--ember); transform: scale(1.35);
  box-shadow: 0 0 0 4px rgba(255, 107, 61, .18);
}
.phase-line { width: 22px; height: 2px; background: #2a3646; }
.phase-step.done .phase-line { background: rgba(31, 217, 176, .55); }
.phase-name { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--text-2); margin-left: 12px; white-space: nowrap; }

/* ============================================================
   PESTAÑAS
   ============================================================ */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
.tab {
  position: relative; background: none; border: 0; cursor: pointer;
  padding: 10px 15px; color: var(--text-3); font-size: 13px; font-weight: 620;
  letter-spacing: .02em; white-space: nowrap; transition: color .16s;
}
.tab:hover { color: var(--text-2); }
.tab.active { color: var(--text); }
.tab.active::after {
  content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px;
  background: var(--ember); border-radius: 2px 2px 0 0; box-shadow: 0 0 12px rgba(255, 107, 61, .6);
}

/* ============================================================
   TABLAS
   ============================================================ */
.table-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th {
  text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .13em;
  color: var(--text-3); font-weight: 700; padding: 8px 11px; border-bottom: 1px solid var(--line);
  white-space: nowrap; background: rgba(255, 255, 255, .015);
}
.tbl td { padding: 9px 11px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr { transition: background .14s; }
.tbl tbody tr:hover td { background: rgba(255, 255, 255, .028); }
.tbl td.num, .tbl th.num { text-align: right; font-family: var(--mono); }
.tbl .you td { background: rgba(255, 107, 61, .07); }
.tbl .you .nick { color: var(--ember); font-weight: 700; }

/* ============================================================
   RESULTADOS DE TORNEO
   ============================================================ */
.result-row {
  display: flex; align-items: center; gap: 12px; padding: 12px 12px;
  border: 1px solid var(--line-soft); border-radius: var(--radius-s);
  background: rgba(255, 255, 255, .018); margin-bottom: 8px; cursor: pointer;
  transition: border-color .16s, background .16s, transform .16s;
}
.result-row:hover { border-color: var(--line); background: rgba(255, 255, 255, .035); transform: translateX(2px); }
.result-row:last-child { margin-bottom: 0; }
.result-row .rmark { width: 3px; align-self: stretch; border-radius: 2px; background: var(--steel); flex: none; }
.result-row.win .rmark { background: var(--teal); }
.result-row.champion .rmark { background: var(--gold); box-shadow: 0 0 14px rgba(255, 194, 71, .5); }

/* ============================================================
   CORE / RNG  —  Motor de azar controlado y determinista
   ------------------------------------------------------------
   El azar NUNCA es "azar puro -> resultado". Estas primitivas
   solo generan numeros; las probabilidades las deciden las capas
   de simulacion a partir del contexto (habilidad, edad, forma...).

   Determinismo: el generador no guarda estado interno propio.
   Cada valor se deriva de (seed, cursor). El cursor vive en el
   estado de la partida y se persiste tras cada accion, por lo que
   recargar la pagina NO permite volver a tirar los dados.
   ============================================================ */
(function (DCS) {
  'use strict';

  function hashString(str) {
    var h = 2166136261 >>> 0;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  /* splitmix32: buena dispersion a partir de un unico entero */
  function splitmix32(a) {
    a |= 0;
    a = (a + 0x9e3779b9) | 0;
    var t = a ^ (a >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t = t ^ (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    t = t ^ (t >>> 15);
    return (t >>> 0) / 4294967296;

      window.crypto.getRandomValues(bytes);

      bytes[0] = (Math.random() * 4294967296) >>> 0;
      bytes[1] = (Date.now() * 1.618) >>> 0;

    return (bytes[0].toString(36) + bytes[1].toString(36)).toUpperCase().slice(0, 12);

  /**
   * @param {string|number} seed  semilla de la carrera
   * @param {number} cursor       nº de valores ya consumidos (persistido)
   */
  function Rng(seed, cursor) {
    this.seed = String(seed);
    this.seedNum = hashString(this.seed);
    this.cursor = cursor | 0;
  }

  Rng.prototype.float = function () {
    var v = splitmix32((this.seedNum + Math.imul(this.cursor + 1, 0x9e3779b9)) | 0);
    this.cursor++;
    return v;
  };

  /** entero en [min, max] inclusive */
  Rng.prototype.int = function (min, max) {
    if (max < min) { var t = min; min = max; max = t; }
    return min + Math.floor(this.float() * (max - min + 1));

  /** flotante en [min, max) */
  Rng.prototype.range = function (min, max) {
    return min + this.float() * (max - min);
  };

  Rng.prototype.chance = function (p) {
    return this.float() < p;
  };

  Rng.prototype.pick = function (arr) {
    return arr[Math.floor(this.float() * arr.length)];
  };

  /** elige n elementos distintos */
  Rng.prototype.sample = function (arr, n) {
    var copy = arr.slice();
    this.shuffle(copy);
    return copy.slice(0, Math.min(n, copy.length));

  Rng.prototype.shuffle = function (arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(this.float() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;

   * @param {Array} items
   * @param {Function} weightFn  item -> peso (>=0)
   */
  Rng.prototype.weighted = function (items, weightFn) {
    var total = 0, i, w, weights = [];
    for (i = 0; i < items.length; i++) {

      weights.push(w);
      total += w;
    }
    if (total <= 0) return null;
    var roll = this.float() * total;
    for (i = 0; i < items.length; i++) {

      if (roll <= 0) return items[i];
    }
    return items[items.length - 1];
  };

  /** gaussiana truncada (Box-Muller) */
  Rng.prototype.gauss = function (mean, sd, min, max) {

<script>
/* ============================================================
   UI / FORMAT — formateo de números y estadísticas (es-ES)
   ============================================================ */
(function (DCS) {
  'use strict';

  function group(n) {
    var s = String(Math.abs(n));
    var out = '', c = 0;
    for (var i = s.length - 1; i >= 0; i--) {
      out = s[i] + out;
      if (++c % 3 === 0 && i > 0) out = '.' + out;
    }
    return (n < 0 ? '-' : '') + out;
  }

  function int(n) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    return group(Math.round(n));
  }

  function dec(n, d) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    var v = Math.round(n * Math.pow(10, d)) / Math.pow(10, d);
    var s = v.toFixed(d).replace('.', ',');
    var parts = s.split(',');
    return group(parseInt(parts[0], 10)) + (parts[1] ? ',' + parts[1] : '');
  }

  function money(n) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    var v = Math.round(n);
    if (Math.abs(v) >= 1000000) return '$' + dec(v / 1000000, 2) + 'M';
    if (Math.abs(v) >= 10000) return '$' + group(Math.round(v / 1000)) + 'K';
    return '$' + group(v);
  }

  function moneyFull(n) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    return '$' + group(Math.round(n));
  }

  function pct(v, d) {
    if (v === null || v === undefined || isNaN(v)) return '—';
    return dec(v * 100, d === undefined ? 1 : d) + '%';
  }

  function signed(v) {
    if (v === null || v === undefined || isNaN(v)) return '—';
    var r = Math.round(v);
    return (r > 0 ? '+' : '') + r;
  }

  /** aplica el formato declarado en ROLES[].display */
  function stat(kind, value) {
    switch (kind) {
      case 'money': return money(value);
      case 'moneyFull': return moneyFull(value);
      case 'int': return int(value);
      case 'dec1': return dec(value, 1);
      case 'dec2': return dec(value, 2);
      case 'pct': return pct(value, 1);
      case 'signed': return signed(value);
      case 'score': return int(value);
      default: return int(value);
    }
  }

  function ordinal(n) {
    return n + 'º';
  }

  DCS.ui = DCS.ui || {};
  DCS.ui.fmt = {
    int: int, dec: dec, money: money, moneyFull: moneyFull,
    pct: pct, signed: signed, stat: stat, ordinal: ordinal, group: group
  };

<script>
/* ============================================================
   ENGINE / STATS — acumulación y cierre de estadísticas
   ------------------------------------------------------------
   Regla de oro: se guardan SUMAS por mapa. Los promedios se
   calculan al vuelo. Así victorias+derrotas siempre cuadran con
   los mapas jugados y ningún histórico se sobrescribe.
   ============================================================ */
(function (DCS) {
  'use strict';

  var U = DCS.util;

  function statKeys(role) {
    return Object.keys(DCS.data.ROLES[role].statModel);
  }

  function blank(role) {
    /* keyMaps cuenta en cuántos mapas se registró cada dato: si el
       jugador cambia de posición a mitad de carrera, cada estadística
       se promedia solo sobre los mapas en los que existía.          */
    var acc = { maps: 0, wins: 0, losses: 0, sums: {}, keyMaps: {} };
    statKeys(role).forEach(function (k) { acc.sums[k] = 0; acc.keyMaps[k] = 0; });
    return acc;
  }

  function add(acc, line, win) {
    acc.maps++;
    if (win) acc.wins++; else acc.losses++;
    if (!acc.keyMaps) acc.keyMaps = {};
    for (var k in line) {
      if (acc.sums[k] === undefined) acc.sums[k] = 0;
      if (acc.keyMaps[k] === undefined) acc.keyMaps[k] = 0;
      acc.sums[k] += line[k];
      acc.keyMaps[k]++;
    }
    return acc;
  }

  /** suma dos acumuladores (temporada + temporada, o etapa + etapa) */
  function merge(a, b) {
    if (!a) return b ? clone(b) : null;
    if (!b) return a;
    a.maps += b.maps; a.wins += b.wins; a.losses += b.losses;
    if (!a.keyMaps) a.keyMaps = {};
    for (var k in b.sums) {
      if (a.sums[k] === undefined) a.sums[k] = 0;
      a.sums[k] += b.sums[k];
      var bn = (b.keyMaps && b.keyMaps[k] !== undefined) ? b.keyMaps[k] : b.maps;
      a.keyMaps[k] = (a.keyMaps[k] || 0) + bn;
    }
    return a;
  }

  function clone(a) { return JSON.parse(JSON.stringify(a)); }

  /** promedios por mapa + derivados (KDA, winrate) */
  function averages(acc) {
    var out = {};
    var n = acc.maps || 1;
    for (var k in acc.sums) {
      var kn = (acc.keyMaps && acc.keyMaps[k]) ? acc.keyMaps[k] : n;
      out[k] = acc.sums[k] / kn;
    }
    var d = out.deaths === undefined ? 0 : out.deaths;
    out.kda = ((out.kills || 0) + (out.assists || 0)) / Math.max(1, d);
    out.winrate = acc.maps ? acc.wins / acc.maps : 0;
    return out;
  }

  DCS.engine = DCS.engine || {};
  DCS.engine.stats = {
    statKeys: statKeys,
    blank: blank,
    add: add,
    merge: merge,
    clone: clone,
    averages: averages
  };
})(window.DCS = window.DCS || {});
</script>
<script>
/* ============================================================
   ENGINE / PLAYER — creación, valoración y nivel efectivo
   ------------------------------------------------------------
   El potencial es interno: nunca se muestra su valor. El usuario
   solo recibe opiniones de scouting con ruido, y ese ruido se
   reduce a medida que la carrera avanza.
   ============================================================ */
(function (DCS) {
  'use strict';

  var U = DCS.util;
  var ATTR_KEYS = DCS.data.ATTR_KEYS;

  /* Bandas de potencial. Deliberadamente sesgadas hacia abajo:
     la mayoría de los aspirantes no tienen techo de Tier 1.      */
  function rollPotential(rng) {
    var r = rng.float();
    if (r < 0.32) return rng.range(50, 65);
    if (r < 0.64) return rng.range(65, 76);
    if (r < 0.86) return rng.range(76, 85);
    if (r < 0.965) return rng.range(85, 92);
    return rng.range(92, 99);
  }

  function createPlayer(opts, rng) {
    var role = DCS.data.ROLES[opts.role];
    var arch = DCS.data.ARCHETYPES[opts.archetype];

    var potential = U.clamp(rollPotential(rng) + arch.ceilingBonus, 45, 99);

    /* Techo individual por atributo: el potencial global se reparte
       según el sesgo del rol y del arquetipo, con dispersión propia. */
    var caps = {};
    ATTR_KEYS.forEach(function (k) {
      var bias = (role.growthBias[k] - 1) * 20 + (arch.growth[k] - 1) * 14;
      caps[k] = U.clamp(Math.round(potential + bias + rng.gauss(0, 5.5)), 30, 99);
    });

    /* Atributos a los 16: bajos, incompletos y solo levemente
       correlacionados con el potencial (una joya puede no parecerlo). */
    var attrs = {};
    ATTR_KEYS.forEach(function (k) {
      var v = rng.gauss(27, 5.2) + (arch.attr[k] || 0) * 0.9 + (potential - 70) * 0.11 +
        (role.growthBias[k] - 1) * 8;
      attrs[k] = U.clamp(Math.round(v), 8, Math.max(12, caps[k] - 4));
    });

    var player = {
      name: opts.name,
      nick: opts.nick,
      nationality: opts.nationality,
      region: opts.region,
      homeRegion: opts.region,
      role: opts.role,
      archetype: opts.archetype,
      age: 16,
      attrs: attrs,

      /* --- ocultos --- */
      caps: caps,
      potential: Math.round(potential),
      growth: U.clamp(rng.gauss(1.0, 0.17), 0.62, 1.48),
      /* Cuánto de ese techo llegará a materializarse de verdad.
         Tener potencial de élite no garantiza nada: hay carreras
         que se quedan a medio camino sin que nadie sepa por qué. */
      realization: U.clamp(rng.gauss(0.945, 0.07), 0.70, 1.04),
      peakAge: U.clamp(rng.gaussInt(25, 2.5), 21, 30),
      declineDelay: rng.int(1, 5),
      variance: arch.variance,
      slumpResist: arch.slumpResist,

      /* --- estado --- */
      form: 50,
      morale: 62,
      reputation: 4,
      experience: 0,
      mmr: 0,
      peakMmr: 0,
      overall: 0,
      peakOverall: 0,
      isCaptain: false,
      trainingFocus: 'balanced',
      trainingMod: 0,

      /* --- situación --- */
      status: 'amateur',      /* amateur | signed | free | retired */
      teamId: null,
      contract: null,
      seasonsWithoutTeam: 0,
      teamChanges: 0,
      proYears: 0,
      tierYears: { 1: 0, 2: 0, 3: 0 },
      teamsPlayed: [],
      flags: {}
    };

    player.overall = overall(player);
    player.peakOverall = player.overall;
    player.mmr = Math.round(targetMmr(player, rng) * 0.92);
    player.peakMmr = player.mmr;
    return player;
  }

  /* Valoración general: NUNCA es una media simple.
     Cada rol pondera los atributos de forma distinta.            */
  function overall(player) {
    var w = DCS.data.ROLES[player.role].weights;
    var total = 0;
    ATTR_KEYS.forEach(function (k) { total += player.attrs[k] * w[k]; });
    return Math.round(U.clamp(total, 1, 99));
  }

  /* MMR: habilidad individual pura. Importa, pero no manda:
     mentalidad, teamplay y consistencia no entran aquí.          */
  function coreSkill(player) {
    var a = player.attrs;
    return 0.44 * a.mech + 0.28 * a.sense + 0.18 * a.pool + 0.10 * a.cons;
  }

  function targetMmr(player, rng) {
    var arch = DCS.data.ARCHETYPES[player.archetype];
    var base = 900 + coreSkill(player) * 106 + arch.mmrBias;
    base += (player.form - 50) * 6;
    if (player.age < 19) base -= (19 - player.age) * 120;
    if (player.age > 30) base -= (player.age - 30) * 90;
    return Math.max(600, base + (rng ? rng.gauss(0, 220) : 0));
  }

  /* Nivel efectivo en competición: lo que realmente rinde hoy.   */
  function effectiveLevel(player, team) {
    var lvl = player.overall;
    lvl += (player.form - 50) * 0.16;
    lvl += (player.morale - 55) * 0.07;
    lvl += Math.min(6, player.experience * 0.035);
    if (team) lvl += (team.synergy - 55) * 0.05;
    if (player.flags && player.flags.provisional) lvl -= 1.5;
    return U.clamp(lvl, 1, 99);
  }

  /* Estimación de scouting: lo que el mundo CREE que puede llegar
     a ser. Con ruido alto de joven y decreciente con la carrera.  */
  function perceivedPotential(player, rng) {
    var certainty = U.clamp((player.age - 15) / 12 + player.experience / 260, 0.12, 0.94);
    var noise = (1 - certainty) * 26;
    var seen = player.potential * certainty + Math.max(player.overall, player.potential * 0.7) * (1 - certainty);
    return U.clamp(seen + (rng ? rng.gauss(0, noise) : 0), 30, 99);
  }

  /* Texto vago para el usuario: nunca la etiqueta interna.        */
  function scoutingOpinion(value) {
    if (value < 58) return 'Perfil discreto';
    if (value < 68) return 'Proyecto a largo plazo';
    if (value < 76) return 'Jugador con recorrido';
    if (value < 84) return 'Talento a seguir';
    if (value < 91) return 'Perfil muy prometedor';
    return 'Talento excepcional';
  }

  DCS.engine = DCS.engine || {};
  DCS.engine.player = {
    createPlayer: createPlayer,
    overall: overall,
    coreSkill: coreSkill,
    targetMmr: targetMmr,
    effectiveLevel: effectiveLevel,
    perceivedPotential: perceivedPotential,
    scoutingOpinion: scoutingOpinion
  };
})(window.DCS = window.DCS || {});
</script>
<script>
/* ============================================================
   ENGINE / WORLD — ecosistema de equipos ficticios
   ------------------------------------------------------------
   El mundo NO es estático: cada año los equipos suben, bajan,
   fichan, se hunden o se disuelven. La carrera del jugador
   ocurre dentro de un circuito vivo.
   ============================================================ */
(function (DCS) {
  'use strict';

  var U = DCS.util;
  var D = DCS.data;

  var EXPECTATIONS = {
    3: ['Crecer y no descender', 'Pelear el ascenso', 'Ganar la división'],
    2: ['Consolidarse en la categoría', 'Clasificarse para eventos internacionales', 'Ascender a Tier 1'],
    1: ['Mantener la plaza', 'Entrar en playoffs internacionales', 'Clasificarse para The International', 'Pelear títulos internacionales']
  };
  var STYLES = ['Agresivo', 'Metódico', 'Caótico', 'Estratégico', 'Reactivo', 'Ultraofensivo', 'Paciente'];

  function genNick(rng, used) {
    for (var tries = 0; tries < 40; tries++) {
      var nick;
      if (rng.chance(0.22)) {
        nick = rng.pick(D.NICK_SOLO);
      } else {
        nick = rng.pick(D.NICK_HEADS) + rng.pick(D.NICK_TAILS);
        if (rng.chance(0.16)) nick = nick.toLowerCase();
        if (rng.chance(0.10)) nick += rng.int(1, 99);
      }
      if (!used[nick]) { used[nick] = true; return nick; }
    }
    return 'Player' + rng.int(1000, 9999);
  }

  function genOrgName(rng, used) {
    for (var tries = 0; tries < 40; tries++) {
      var head = rng.pick(D.ORG_HEADS);
      var name = rng.chance(0.45) ? head + ' ' + rng.pick(D.ORG_TAILS) : head;
      if (rng.chance(0.12)) name = 'Team ' + head;
      if (!used[name]) { used[name] = true; return name; }
    }
    return 'Org ' + rng.int(100, 999);
  }

  function genRealName(rng, region) {
    var f = D.FIRST_NAMES[region] || D.FIRST_NAMES.weu;
    var l = D.LAST_NAMES[region] || D.LAST_NAMES.weu;
    return rng.pick(f) + ' ' + rng.pick(l);
  }

  function tierQualityMean(tier, region) {
    var s = D.REGIONS[region].strength;
    var base = tier === 1 ? 76 : (tier === 2 ? 61 : 46);
    return base + (s - 0.9) * 16;
  }

  function makeNpc(rng, world, region, role, quality) {
    var age = U.clamp(rng.gaussInt(24, 4), 17, 35);
    var rating = U.clamp(Math.round(rng.gauss(quality, 4.5)), 15, 97);
    return {
      id: 'n' + (world.nextId++),
      nick: genNick(rng, world.usedNicks),
      name: genRealName(rng, region),
      role: role,
      age: age,
      rating: rating,
      isPlayer: false
    };
  }

  function makeTeam(rng, world, region, tier) {
    var q = U.clamp(rng.gauss(tierQualityMean(tier, region), tier === 1 ? 4 : 5), 12, 95);
    var team = {
      id: 't' + (world.nextId++),
      name: genOrgName(rng, world.usedOrgs),
      region: region,
      tier: tier,
      quality: Math.round(q),
      reputation: Math.round(U.clamp(rng.gauss(tier === 1 ? 74 : (tier === 2 ? 48 : 22), 12), 2, 99)),
      resources: Math.round(U.clamp(rng.gauss(tier === 1 ? 76 : (tier === 2 ? 50 : 24), 14), 3, 99)),
      synergy: Math.round(U.clamp(rng.gauss(58, 10), 20, 92)),
      expectation: rng.pick(EXPECTATIONS[tier]),
      style: rng.pick(STYLES),
      roster: [],
      points: 0,
      form: 0,
      lastResults: [],
      hasPlayer: false
    };
    D.ROLE_LIST.forEach(function (r) {
      team.roster.push(makeNpc(rng, world, region, r, q));
    });
    return team;
  }

  function createWorld(rng) {
    var world = { teams: [], nextId: 1, usedNicks: {}, usedOrgs: {} };
    D.REGION_LIST.forEach(function (reg) {
      var slots = D.REGIONS[reg].slots;
      [1, 2, 3].forEach(function (tier) {
        var n = slots['t' + tier];
        for (var i = 0; i < n; i++) world.teams.push(makeTeam(rng, world, reg, tier));
      });

  function getTeam(state, id) {

    for (var i = 0; i < t.length; i++) if (t[i].id === id) return t[i];

     El jugador aporta según el peso de impacto de su rol.        */
  function teamStrength(state, team, includePlayer) {
    var sum = 0, n = 0;
    for (var i = 0; i < team.roster.length; i++) {
      var m = team.roster[i];
      if (m.isPlayer) {
        if (includePlayer === false) continue;

        n++;

    return U.clamp(avg + (team.synergy - 55) * 0.10 + (team.resources - 50) * 0.03, 5, 99);
  }

  function rosterQuality(team) {
    var vals = team.roster.filter(function (m) { return !m.isPlayer; }).map(function (m) { return m.rating; });
    return vals.length ? Math.round(U.avg(vals)) : team.quality;
  }

  /* Llegar nuevo siempre cuesta química: más cuanto más se cambia. */
  function newcomerPenalty(state) {
    var p = state.player;
    return 6 + Math.min(10, p.teamChanges * 1.6) - (p.attrs.team + p.attrs.adapt) / 40;

  function joinTeam(state, team, contract) {

    var idx = -1;
    for (var i = 0; i < team.roster.length; i++) if (team.roster[i].role === p.role) idx = i;
    if (idx < 0) idx = 0;
    team.roster[idx] = { id: 'you', nick: p.nick, name: p.name, role: p.role, age: p.age, rating: p.overall, isPlayer: true };
    team.hasPlayer = true;
    team.synergy = Math.round(U.clamp(team.synergy - newcomerPenalty(state), 15, 95));
    p.teamId = team.id;
    p.status = 'signed';
    p.contract = contract;
    if (p.teamsPlayed.indexOf(team.id) < 0) p.teamsPlayed.push(team.id);

  function leaveTeam(state, reason) {

    var team = getTeam(state, p.teamId);
    if (team) {
      var rng = DCS.runtime.get();
      for (var i = 0; i < team.roster.length; i++) {
        if (team.roster[i].isPlayer) {
          team.roster[i] = makeNpc(rng, state.world, team.region, p.role, team.quality);
        }
      }
      team.hasPlayer = false;
    }
    p.teamId = null;
    p.contract = null;
    p.status = 'free';
    p.isCaptain = false;
    if (p.flags) delete p.flags.provisional;
    return reason;
  }

  /* Evolución anual del ecosistema ------------------------------ */
  function evolveWorld(state, rng, log) {
    var world = state.world;
    var replacements = [];

    world.teams.forEach(function (team) {
      /* NPCs envejecen y progresan o decaen */
      team.roster.forEach(function (m) {
        if (m.isPlayer) return;
        m.age++;
        var delta;
        if (m.age <= 21) delta = rng.gauss(3.6, 2.6);
        else if (m.age <= 25) delta = rng.gauss(1.5, 2.2);
        else if (m.age <= 28) delta = rng.gauss(0.2, 1.8);
        else if (m.age <= 31) delta = rng.gauss(-1.4, 2.0);
        else delta = rng.gauss(-3.2, 2.2);
        m.rating = Math.round(U.clamp(m.rating + delta, 12, 97));
        if (m.age > 32 && rng.chance(0.28 + (m.age - 32) * 0.12)) m.retiring = true;
      });

      /* Retiradas y fichajes NPC */
      for (var i = 0; i < team.roster.length; i++) {
        var m = team.roster[i];
        if (m.isPlayer) continue;
        if (m.retiring || (rng.chance(0.16) && !team.hasPlayer)) {
          team.roster[i] = makeNpc(rng, world, team.region, m.role, team.quality + rng.gauss(0, 4));
        }
      }

      team.quality = rosterQuality(team);
      team.synergy = Math.round(U.clamp(team.synergy + rng.gauss(1.5, 7), 15, 95));
      team.resources = Math.round(U.clamp(team.resources + rng.gauss(0, 7) + (team.points > 60 ? 5 : -2), 3, 99));
      team.reputation = Math.round(U.clamp(team.reputation + rng.gauss(0, 4) + (team.points > 60 ? 4 : (team.points < 15 ? -3 : 0)), 2, 99));

      /* Ascensos y descensos */
      var mean = tierQualityMean(team.tier, team.region);
      if (team.tier > 1 && team.quality > mean + 9 && rng.chance(0.45)) {
        team.tier--;
        team.expectation = rng.pick(EXPECTATIONS[team.tier]);
        if (log) log.push(team.name + ' asciende a Tier ' + team.tier + '.');
      } else if (team.tier < 3 && team.quality < mean - 9 && rng.chance(0.42)) {
        team.tier++;
        team.expectation = rng.pick(EXPECTATIONS[team.tier]);
        if (log) log.push(team.name + ' cae a Tier ' + team.tier + '.');
      }

         como evento propio para que tenga peso narrativo) */

      if (!team.hasPlayer && rng.chance(risk)) {
        replacements.push(team);
      }
      team.points = 0;
      team.lastResults = [];
    });

    replacements.forEach(function (team) {
      var idx = world.teams.indexOf(team);
      var fresh = makeTeam(rng, world, team.region, team.tier);
      world.teams[idx] = fresh;
      if (log) log.push(team.name + ' cierra su división de Dota 2. ' + fresh.name + ' ocupa su lugar.');
    });

  function teamsIn(state, region, tier) {
    return state.world.teams.filter(function (t) {
      return (!region || t.region === region) && (!tier || t.tier === tier);
    });
  }

  DCS.engine = DCS.engine || {};
  DCS.engine.world = {
    createWorld: createWorld,
    makeTeam: makeTeam,
    makeNpc: makeNpc,
    genNick: genNick,
    getTeam: getTeam,
    teamStrength: teamStrength,
    rosterQuality: rosterQuality,
    joinTeam: joinTeam,
    leaveTeam: leaveTeam,
    evolveWorld: evolveWorld,
    teamsIn: teamsIn,
    EXPECTATIONS: EXPECTATIONS
