<script>
/* ============================================================
   ENGINE / RETIREMENT — retirada anticipada y legado
   ------------------------------------------------------------
   La retirada no depende solo de la edad: una carrera colapsada
   a los 24 también puede llegar a su final. Pero la propuesta
   siempre se puede rechazar y seguir intentándolo.
   ============================================================ */
(function (DCS) {
  'use strict';

  var U = DCS.util;

  function lastRatings(state, n) {
    var out = [];
    for (var i = state.history.length - 1; i >= 0 && out.length < n; i--) {
      out.push(state.history[i].rating);
    }
    return out;
  }

  /** Devuelve una propuesta de retirada o null. */
  function evaluate(state, rng) {
    var p = state.player;
    if (p.age >= 38) return null;               /* lo gestiona el fin de año */
    if (p.age < 20) return null;                /* con 19 años nadie tira la toalla */
    if (state.career.lastRetirementPrompt && state.year - state.career.lastRetirementPrompt < 2) return null;

    var score = 0;
    var reasons = [];

    if (p.age >= 33) { score += (p.age - 32) * 1.3; reasons.push('Tienes ' + p.age + ' años.'); }
    else if (p.age >= 30) { score += 0.8; }

    var rs = lastRatings(state, 3);
    var bad = 0;
    rs.forEach(function (r) { if (r === null || r < 56) bad++; });
    if (bad >= 2) { score += bad * 1.6; reasons.push('Encadenas ' + bad + ' temporadas por debajo de tu nivel.'); }

    if (p.seasonsWithoutTeam >= 1) {
      score += p.seasonsWithoutTeam * 2.6;
      reasons.push(p.seasonsWithoutTeam === 1 ? 'Llevas un año sin equipo.' : 'Llevas ' + p.seasonsWithoutTeam + ' años sin equipo.');
    }
    if (!p.teamId && p.age >= 24) { score += 1.5; }

    var drop = p.peakOverall - p.overall;
    if (drop >= 7) { score += drop * 0.32; reasons.push('Tu nivel ha caído claramente desde tu mejor momento.'); }

    if (p.morale < 38) { score += 2; reasons.push('La motivación está por los suelos.'); }
    if (p.reputation < 12 && p.age >= 22) { score += 1.6; reasons.push('El circuito casi ha dejado de contar contigo.'); }

    var lastTier = null;
    for (var i = state.history.length - 1; i >= 0; i--) { if (state.history[i].tier) { lastTier = state.history[i].tier; break; } }
    var bestTier = 3;
    state.history.forEach(function (h) { if (h.tier && h.tier < bestTier) bestTier = h.tier; });
    if (lastTier && lastTier > bestTier) { score += (lastTier - bestTier) * 1.4; reasons.push('Has bajado de Tier respecto a tu mejor etapa.'); }

    /* A los veinti pocos hace falta un desastre real para plantearse dejarlo */
    if (p.age < 24) score *= 0.6;
    else if (p.age < 27) score *= 0.85;

    if (score < 6) return null;
    if (!rng.chance(U.clamp((score - 5) / 8, 0.12, 0.9))) return null;

    state.career.lastRetirementPrompt = state.year;
    return {
      age: p.age,
      score: Math.round(score * 10) / 10,
      reasons: reasons,
      text: 'Han pasado los años y el juego ya no te devuelve lo mismo. Nadie te va a decir cuándo parar.'
    };
  }

  /* --------------------------------------------------------
     LEGADO
     -------------------------------------------------------- */
  function bigTitles(state) {
    var n = 0, list = [];
    state.history.forEach(function (h) {
      h.tournaments.forEach(function (t) {
        if (t.placement === 1 && t.kind !== 'qualifier') {
          if (t.prestige >= 6) { n++; list.push(h.year + ' · ' + t.name); }
        }
      });
    });
    return { count: n, list: list };
  }

  function findPrime(state) {
    var h = state.history.filter(function (x) { return x.rating !== null; });
    if (h.length < 2) return h.length ? { from: h[0].year, to: h[0].year, avg: h[0].rating } : null;
    var best = null;
    for (var i = 0; i < h.length; i++) {
      for (var len = 2; len <= 5 && i + len <= h.length; len++) {
        var slice = h.slice(i, i + len);
        var avg = U.avg(slice, function (x) { return x.rating; });
        var scoreW = avg + len * 1.4;
        if (!best || scoreW > best.scoreW) {
          best = { from: slice[0].year, to: slice[slice.length - 1].year, avg: Math.round(avg), scoreW: scoreW };
        }
      }
    }
    return best;
  }

  function mainTeam(state) {
    var map = {};
    state.history.forEach(function (h) {
      h.stints.forEach(function (s) {
        if (!map[s.teamId]) map[s.teamId] = { name: s.teamName, seasons: 0, maps: 0, tier: s.tier, best: 0 };
        map[s.teamId].seasons++;
        map[s.teamId].maps += s.acc.maps;
        if (s.tier && s.tier < map[s.teamId].tier) map[s.teamId].tier = s.tier;
      });
      h.tournaments.forEach(function (t) {
        if (map[t.teamId]) {
          var q = DCS.engine.performance.tournamentQuality(t);
          if (q > map[t.teamId].best) map[t.teamId].best = q;
        }
      });
    });
    var best = null;
    for (var k in map) {
      var v = map[k];
      var w = v.seasons * 2 + v.best * 6 + (4 - (v.tier || 3));
      if (!best || w > best.w) best = { id: k, name: v.name, seasons: v.seasons, maps: v.maps, w: w };
    }
    return best;
  }

  /* Las categorías altas exigen logros reales, no solo puntuación:
     se puede ser leyenda sin ganar TI, pero no sin ganar nada.     */
  var CATEGORIES = [
    {
      min: 92, name: 'Candidato a GOAT', gate: function (x) { return x.tiWon >= 1 && x.bigTitles >= 2; },
      desc: 'Cuando se discuta quién fue el mejor de la historia, tu nombre estará en la conversación.'
    },
    {
      min: 86, name: 'Leyenda de Dota', gate: function (x) { return x.tiWon >= 1 || x.bigTitles >= 3; },
      desc: 'Tu carrera es parte del canon competitivo. Se te recordará mientras exista el juego.'
    },
    {
      min: 66, name: 'Superestrella', gate: function (x) { return x.bigTitles >= 1 || x.tiPlayed >= 1 || x.t1Years >= 4; },
      desc: 'Fuiste una de las grandes referencias mundiales de tu posición.'
    },
    {
      min: 55, name: 'Campeón', gate: function (x) { return x.titles >= 1; },
      desc: 'Levantaste trofeos que muy poca gente llega a tocar.'
    },
    {
      min: 46, name: 'Estrella internacional', gate: function (x) { return x.t1Years >= 1 || x.tiPlayed >= 1 || x.bigTitles >= 1; },
      desc: 'Competiste de tú a tú con los mejores del mundo durante años.'
    },
    { min: 38, name: 'Veterano respetado', desc: 'Una carrera larga y digna en la élite regional, con algún salto internacional.' },
    { min: 29, name: 'Journeyman', desc: 'Muchos equipos, muchos años, mucha carretera. Siempre encontraste dónde jugar.' },
    { min: 20, name: 'Profesional regional', desc: 'Viviste del juego dentro de tu región, sin llegar a dar el salto grande.' },
    { min: 9, name: 'Jugador de Tier 3', desc: 'Estuviste dentro del circuito, pero nunca cruzaste la puerta.' },
    { min: 0, name: 'Promesa que nunca explotó', desc: 'Talento, ilusión y un final anticipado. Le pasa a la mayoría.' }
  ];

  function computeLegacy(state, reason) {
    var p = state.player;
    var c = state.career;
    var bt = bigTitles(state);
    var prime = findPrime(state);
    var team = mainTeam(state);
    var wr = c.maps ? c.wins / c.maps : 0;
    var t1Years = p.tierYears[1] || 0;
    var totalEarn = c.earnings.salary + c.earnings.prize + c.earnings.other;

    var score = 0;
    score += U.norm(c.bestRating || 0, 40, 92) * 30;
    score += U.norm(p.peakOverall, 42, 90) * 20;
    score += Math.min(12, t1Years) * 1.3;
    score += Math.min(8, bt.count) * 3.0;
    score += Math.min(5, c.tiPlayed) * 2.0;
    score += Math.min(3, c.tiWon) * 9;
    score += U.norm(c.peakReputation || p.reputation, 10, 85) * 8;
    score += U.clamp((wr - 0.5) * 26, -4, 5);
    score += Math.min(5, totalEarn / 3000000) * 1.0;
    score += Math.min(14, p.proYears) * 0.55;
    if (p.proYears < 3) score -= 10;

    score = U.clamp(score, 0, 110);

    var gateCtx = {
      tiWon: c.tiWon, tiPlayed: c.tiPlayed, bigTitles: bt.count,
      titles: c.titles, t1Years: t1Years
    };
    var cat = CATEGORIES[CATEGORIES.length - 1];
    for (var i = 0; i < CATEGORIES.length; i++) {
      if (score >= CATEGORIES[i].min && (!CATEGORIES[i].gate || CATEGORIES[i].gate(gateCtx))) {
        cat = CATEGORIES[i];
        break;
      }
    }
    /* matices que el número no capta */
    if (p.age <= 23 && p.proYears <= 4 && score < 40) {
      cat = { name: 'Promesa que nunca explotó', desc: 'Te retiraste antes de descubrir hasta dónde podías llegar.' };
    } else if (p.proYears <= 4 && score < 29) {
      cat = { name: 'Carrera corta', desc: 'Pasaste por el circuito y te fuiste antes de dejar huella.' };
    }

    var achievements = [];
    if (c.tiWon > 0) achievements.push('Campeón de The International (' + c.tiWon + ')');
    if (c.tiPlayed > 0) achievements.push('Participaciones en The International: ' + c.tiPlayed);
    if (bt.count) achievements.push('Títulos de prestigio: ' + bt.count);
    if (c.titles) achievements.push('Torneos ganados: ' + c.titles);
    if (t1Years) achievements.push('Temporadas en Tier 1: ' + t1Years);
    if (c.bestRating) achievements.push('Mejor rating de temporada: ' + c.bestRating + ' (' + c.bestSeason + ')');
    achievements.push('MMR máximo: ' + DCS.ui.fmt.int(p.peakMmr));

    return {
      reason: reason,
      retireAge: p.age,
      proYears: p.proYears,
      score: Math.round(score),
      category: cat.name,
      categoryDesc: cat.desc,
      prime: prime,
      mainTeam: team,
      bigTitles: bt,
      achievements: achievements,
      teams: p.teamsPlayed.length,
      winrate: wr
    };
  }

  function retire(state, reason) {
    var p = state.player;
    p.status = 'retired';
    state.finished = true;
    state.legacy = computeLegacy(state, reason);
    state.pending = null;
    return state.legacy;
  }

  DCS.engine = DCS.engine || {};
  DCS.engine.retirement = {
    evaluate: evaluate,
    retire: retire,
    computeLegacy: computeLegacy,
    findPrime: findPrime,
    bigTitles: bigTitles
  };
})(window.DCS = window.DCS || {});
</script>
<script>
/* ============================================================
   ENGINE / SEASON — máquina de fases del año competitivo
   ------------------------------------------------------------
   Fases: preparación → competición → cierre → mercado → fin de año.
   Cada llamada a advance() ejecuta UNA fase y devuelve su informe.
   Todo lo generado se escribe en el estado inmediatamente: el
   informe que ves tras recargar es exactamente el mismo.
   ============================================================ */
(function (DCS) {
  'use strict';

  var U = DCS.util;
  var D = DCS.data;
  var W = function () { return DCS.engine.world; };

  var PHASES = ['preseason', 'competition', 'review', 'market', 'yearEnd'];

  var PHASE_LABEL = {
    preseason: 'Pretemporada',
    competition: 'Competición',
    review: 'Cierre de temporada',
    market: 'Mercado',
    yearEnd: 'Fin de año'
  };

  function startSeason(state) {
    var p = state.player;
    var team = W().getTeam(state, p.teamId);
    state.season = {
      year: state.year,
      age: p.age,
      phase: 'preseason',
      teamId: p.teamId,
      acc: DCS.engine.stats.blank(p.role),
      stints: [],
      tournaments: [],
      events: [],
      seriesPlayed: 0, seriesWon: 0, seriesLost: 0,
      earnings: { salary: 0, prize: 0, other: 0 },
      oppLevels: [],
      report: null,
      titles: 0,
      role: p.role
    };
    if (team) openStint(state, team);
    return state.season;
  }

  function openStint(state, team) {
    state.season.stints.push({
      teamId: team.id,
      teamName: team.name,
      tier: team.tier,
      region: team.region,
      acc: DCS.engine.stats.blank(state.player.role),
      seriesPlayed: 0, seriesWon: 0, seriesLost: 0
    });
  }

  function currentStint(state) {
    var st = state.season.stints;
    return st.length ? st[st.length - 1] : null;
  }

  function absorb(state, acc, record) {
    DCS.engine.stats.merge(state.season.acc, acc);
    var stint = currentStint(state);
    if (stint) {
      DCS.engine.stats.merge(stint.acc, acc);
      stint.seriesPlayed += record.seriesPlayed;
      stint.seriesWon += record.seriesWon;
      stint.seriesLost += record.seriesLost;
    }
    state.season.seriesPlayed += record.seriesPlayed;
    state.season.seriesWon += record.seriesWon;
    state.season.seriesLost += record.seriesLost;
    state.season.earnings.prize += record.prize;
    state.season.oppLevels.push(record.avgOpp);
    state.season.tournaments.push(record);
    if (record.placement === 1 && record.kind !== 'qualifier') state.season.titles++;
  }

  /* ---------------------------------------------------------
     FASE 1 · PRETEMPORADA
     --------------------------------------------------------- */
  function phasePreseason(state, rng) {
    var p = state.player;
    var team = W().getTeam(state, p.teamId);
    p.trainingMod = 0;

    var ev = DCS.engine.events.draw(state, rng, 'pre', state.season, team ? 0.55 : 0.35);
    var report = {
      type: 'preseason',
      title: 'Pretemporada ' + state.year,
      team: team ? summarizeTeam(state, team) : null,
      plan: [],
      lines: []
    };

    if (team) {
      report.lines.push('Arranca el año con ' + team.name + ' (Tier ' + team.tier + ', ' +
        D.REGIONS[team.region].name + ').');
      report.lines.push('Objetivo del club: ' + (p.contract ? p.contract.expectation : team.expectation) + '.');
      var plan = DCS.engine.tournaments.planSeason(state, rng, team);
      report.plan = plan.map(function (t) { return t.label; });
      state.season.plan = plan.map(function (t) { return t.id; });
    } else {
      report.lines.push(p.age <= 17
        ? 'Sin equipo. Grindeas pubs, entras en ligas amateur y esperas que alguien se fije en ti.'
        : 'Sigues sin equipo. Pubs, tryouts y llamadas que no siempre se devuelven.');
      state.season.plan = [];
    }

    if (ev) { state.season.events.push(ev); report.event = ev; }
    state.season.phase = 'competition';
    return report;
  }

  /* ---------------------------------------------------------
     FASE 2 · COMPETICIÓN
     --------------------------------------------------------- */
  function phaseCompetition(state, rng) {
    var p = state.player;
    var team = W().getTeam(state, p.teamId);
    var report = { type: 'competition', title: 'Temporada ' + state.year, tournaments: [], lines: [], ti: null };

    if (!team) {
      /* Sin equipo: no hay mapas oficiales, pero la carrera no se detiene */
      var gain = rng.int(120, 620);
      p.mmr = Math.round(U.clamp(p.mmr + gain, 500, 16000));
      if (p.mmr > p.peakMmr) p.peakMmr = p.mmr;
      p.form = U.clamp(p.form + rng.int(-6, 8), 0, 100);
      report.lines.push('Sin competición oficial. Cierras el año con ' + DCS.ui.fmt.int(p.mmr) + ' de MMR.');
      if (rng.chance(0.35)) report.lines.push('Un par de equipos te han probado en scrims. Nada firmado.');
      state.season.phase = 'review';
      return report;
    }

    var plan = (state.season.plan || []).map(function (id) { return D.TOURNAMENT_TEMPLATES[id]; });
    var midEvent = null;
    var qualifiedIntl = false;

    for (var i = 0; i < plan.length; i++) {
      var tpl = plan[i];
      if (!tpl) continue;
      if (p.flags.missEvent && tpl.kind !== 'league' && rng.chance(0.8)) {
        p.flags.missEvent = false;
        report.lines.push('Te pierdes ' + tpl.label + '.');
        continue;
      }
      var out = DCS.engine.tournaments.runTournament(state, rng, team, tpl, state.year);
      absorb(state, out.acc, out.record);
      report.tournaments.push(out.record);

      if (tpl.kind === 'qualifier' && out.record.qualified) qualifiedIntl = true;

      /* evento de media temporada */
      if (i === Math.floor(plan.length / 2)) {
        midEvent = DCS.engine.events.draw(state, rng, 'mid', state.season, 0.45);
        if (midEvent) { state.season.events.push(midEvent); report.event = midEvent; }
        /* el roster puede romperse en plena temporada */
        if (rng.chance(disbandRisk(team))) {
          var newTeam = midSeasonMove(state, rng, team);
          report.lines.push(team.name + ' disuelve su roster en mitad del año.');
          if (newTeam) {
            report.lines.push('Terminas la temporada como stand-in en ' + newTeam.name + '.');
            team = newTeam;
          } else {
            report.lines.push('Nadie te recoge. Terminas el año sin equipo.');
            break;
          }
        }
      }
    }

    /* --- acceso a torneos internacionales cerrados --- */
    if (team && qualifiedIntl && team.tier === 2) {
      var t2 = DCS.engine.tournaments.runTournament(state, rng, team, D.TOURNAMENT_TEMPLATES.t2_intl, state.year);
      absorb(state, t2.acc, t2.record);
      report.tournaments.push(t2.record);
    }

    /* --- The International --- */
    if (team) {
      var ti = tiPath(state, rng, team, report);
      if (ti) report.ti = ti;
    }

    var totals = DCS.engine.stats.averages(state.season.acc);
    report.totals = { acc: state.season.acc, avg: totals };
    state.season.phase = 'review';
    return report;
  }

  function disbandRisk(team) {
    var r = 0.03;
    if (team.resources < 30) r += 0.05;
    if (team.synergy < 40) r += 0.04;
    if (team.tier === 3) r += 0.03;
    return r;
  }

  function midSeasonMove(state, rng, team) {
    var oldId = team.id;
    W().leaveTeam(state, 'disband');
    var candidates = state.world.teams.filter(function (t) {
      return !t.hasPlayer && t.id !== oldId && t.region === state.player.region &&
        t.tier >= Math.min(3, team.tier);
    });
    if (!candidates.length || !rng.chance(0.6)) return null;
    candidates.sort(function (a, b) { return a.quality - b.quality; });
    var pick = candidates[Math.min(candidates.length - 1, rng.int(0, Math.floor(candidates.length / 2)))];
    W().joinTeam(state, pick, {
      years: 0, salary: Math.round((state.player.contract ? state.player.contract.salary : 20000) * 0.5),
      signedYear: state.year, expectation: pick.expectation
    });
    openStint(state, pick);
    return pick;
  }

  /* Camino a The International: invitación directa o clasificatorio.
     Deliberadamente difícil: es el techo del juego.               */
  function tiPath(state, rng, team, report) {
    var qualified = false, via = null;

    if (team.tier === 1) {
      var pts = team.points;
      var chance = pts >= 185 ? 0.70 : (pts >= 135 ? 0.32 : (pts >= 95 ? 0.11 : 0.015));
      if (rng.chance(chance)) { qualified = true; via = 'Invitación directa'; }
    }
    /* al clasificatorio solo llegan los que han hecho algo durante el año */
    var eligible = (team.tier === 1 && team.points >= 40) || (team.tier === 2 && team.quality > 70 && team.points >= 55);
    if (!qualified && eligible) {
      var q = DCS.engine.tournaments.runTournament(state, rng, team, D.TOURNAMENT_TEMPLATES.ti_qual, state.year);
      absorb(state, q.acc, q.record);
      report.tournaments.push(q.record);
      if (q.record.placement === 1) { qualified = true; via = 'Clasificatorio regional'; }
    }
    if (!qualified) return null;

    var ti = DCS.engine.tournaments.runTournament(state, rng, team, D.TOURNAMENT_TEMPLATES.ti, state.year);
    absorb(state, ti.acc, ti.record);
    report.tournaments.push(ti.record);
    ti.record.via = via;
    state.career.tiPlayed++;
    if (ti.record.placement === 1) {
      state.career.tiWon++;
      state.player.reputation = U.clamp(state.player.reputation + 22, 0, 100);
      state.player.morale = U.clamp(state.player.morale + 20, 0, 100);
    }
    return ti.record;
  }

  /* ---------------------------------------------------------
     FASE 3 · CIERRE DE TEMPORADA
     --------------------------------------------------------- */
  function phaseReview(state, rng) {
    var p = state.player;
    var team = W().getTeam(state, p.teamId);
    var s = state.season;
    var acc = s.acc;

    var rating = acc.maps
      ? DCS.engine.performance.rate(state, acc, {
        role: p.role,
        tournaments: s.tournaments.map(function (t) {
          return { placement: t.placement, field: t.field, prestige: t.prestige };
        }),
        oppLevel: s.oppLevels.length ? U.avg(s.oppLevels) : 50,
        tier: team ? team.tier : 3
      })
      : null;

    /* salario del año */
    if (p.contract && p.contract.salary) s.earnings.salary += p.contract.salary;
    state.career.earnings.salary += s.earnings.salary;
    state.career.earnings.prize += s.earnings.prize;

    /* reputación: sube con nivel, títulos y prestigio; baja sin nada que enseñar */
    var repDelta = 0;
    if (rating !== null) {
      /* el listón se mide contra lo esperable en su tier, no en abstracto:
         un buen año en Tier 3 también construye nombre, solo que más despacio */
      var tier = team ? team.tier : 3;
      var bar = tier === 1 ? 62 : (tier === 2 ? 55 : 48);
      repDelta += (rating - bar) * 0.12;
      repDelta += tier === 1 ? 2.2 : (tier === 2 ? 1.5 : 0.9);
      s.tournaments.forEach(function (t) {
        var q = DCS.engine.performance.tournamentQuality(t);
        repDelta += q * t.prestige * 0.18;
      });
    } else {
      repDelta -= 4 + p.seasonsWithoutTeam * 1.5;
    }
    repDelta -= p.reputation * 0.09;                       /* la fama se evapora sola */
    p.reputation = U.clamp(p.reputation + repDelta, 0, 100);

    /* moral: expectativas cumplidas o no */
    if (rating !== null) {
      var moraleDelta = (rating - 60) * 0.35 + (s.titles * 5);
      p.morale = U.clamp(p.morale + moraleDelta * rng.range(0.6, 1.4), 3, 100);
      p.form = U.clamp(50 + (rating - 60) * 0.5 + rng.gauss(0, 8), 5, 98);
    } else {
      p.morale = U.clamp(p.morale - rng.int(3, 12), 3, 100);
      p.form = U.clamp(p.form - rng.int(0, 8), 5, 98);
    }

    /* desarrollo */
    var mates = team ? team.roster.filter(function (m) { return !m.isPlayer; }) : [];
    var dev = DCS.engine.progression.develop(state, rng, {
      rating: rating,
      teammateLevel: mates.length ? U.avg(mates, function (m) { return m.rating; }) : null,
      mapsPlayed: acc.maps,
      played: !!team && acc.maps > 0
    });

    if (team) {
      p.proYears++;
      p.tierYears[team.tier] = (p.tierYears[team.tier] || 0) + 1;
      team.roster.forEach(function (m) { if (m.isPlayer) m.rating = p.overall; });
      /* la química crece con el tiempo juntos */
      team.synergy = U.clamp(team.synergy + rng.int(1, 7), 10, 96);
      team.quality = W().rosterQuality(team);
    } else {
      p.seasonsWithoutTeam++;
    }

    /* histórico permanente */
    var record = buildSeasonRecord(state, rating, dev, team);
    state.history.push(record);
    state.career.lastRating = rating;
    updateCareerTotals(state, record);

    var ev = DCS.engine.events.draw(state, rng, 'post', state.season, 0.45);
    if (ev) { s.events.push(ev); }

    s.rating = rating;
    s.phase = 'market';

    return {
      type: 'review',
      title: 'Cierre de ' + state.year,
      rating: rating,
      record: record,
      dev: dev,
      repDelta: Math.round(repDelta * 10) / 10,
      event: ev || null
    };
  }

  function buildSeasonRecord(state, rating, dev, team) {
    var s = state.season;
    var p = state.player;
    var best = null;
    s.tournaments.forEach(function (t) {
      if (t.kind === 'qualifier') return;
      var q = DCS.engine.performance.tournamentQuality(t);
      if (!best || q > best.q) best = { q: q, label: t.result + ' · ' + t.name, placement: t.placement, name: t.name };
    });
    /* una etapa sin un solo mapa no cuenta como etapa */
    var stints = s.stints.filter(function (x) { return x.acc.maps > 0; });
    if (!stints.length) stints = s.stints;

    return {
      year: s.year,
      age: s.age,
      role: s.role,
      teamId: s.teamId,
      teamName: stints.length ? stints.map(function (x) { return x.teamName; }).join(' / ') : 'Sin equipo',
      tier: team ? team.tier : null,
      stints: stints.map(function (x) {
        return {
          teamId: x.teamId, teamName: x.teamName, tier: x.tier, region: x.region,
          acc: x.acc, seriesPlayed: x.seriesPlayed, seriesWon: x.seriesWon, seriesLost: x.seriesLost
        };
      }),
      acc: s.acc,
      seriesPlayed: s.seriesPlayed,
      seriesWon: s.seriesWon,
      seriesLost: s.seriesLost,
      tournaments: s.tournaments,
      titles: s.titles,
      bestResult: best ? best.label : (s.tournaments.length ? 'Sin resultados destacados' : 'Sin competición oficial'),
      rating: rating,
      earnings: { salary: s.earnings.salary, prize: s.earnings.prize, other: s.earnings.other },
      mmrEnd: p.mmr,
      overallEnd: p.overall,
      reputationEnd: Math.round(p.reputation),
      events: s.events.map(function (e) {
        return { title: e.title, text: e.text, outcome: e.outcome, chosen: e.chosen, tone: e.tone };
      }),
      devNotes: dev ? dev.notes : []
    };
  }

  function updateCareerTotals(state, r) {
    var c = state.career;
    if (!c.rolesPlayed) c.rolesPlayed = {};
    if (r.acc.maps) c.rolesPlayed[r.role] = (c.rolesPlayed[r.role] || 0) + r.acc.maps;
    c.maps += r.acc.maps;
    c.wins += r.acc.wins;
    c.losses += r.acc.losses;
    c.seriesPlayed += r.seriesPlayed;
    c.seriesWon += r.seriesWon;
    c.seriesLost += r.seriesLost;
    c.titles += r.titles;
    c.tournaments += r.tournaments.filter(function (t) { return t.kind !== 'qualifier'; }).length;
    DCS.engine.stats.merge(c.acc, DCS.engine.stats.clone(r.acc));
    if (r.rating !== null && (c.bestRating === null || r.rating > c.bestRating)) {
      c.bestRating = r.rating;
      c.bestSeason = r.year;
    }
  }

  /* ---------------------------------------------------------
     FASE 4 · MERCADO
     --------------------------------------------------------- */
  function phaseMarket(state, rng) {
    var p = state.player;
    var team = W().getTeam(state, p.teamId);
    var contractOver = !p.contract || p.contract.years <= 1;

    var wantOffers = !team || contractOver || rng.chance(0.30);
    var offers = wantOffers ? DCS.engine.market.generateOffers(state, rng, { renewal: contractOver }) : [];

    state.offers = offers;
    state.season.phase = 'yearEnd';

    return {
      type: 'market',
      title: 'Mercado ' + state.year,
      offers: offers,
      contractOver: contractOver,
      hasTeam: !!team,
      marketScore: Math.round(DCS.engine.market.marketScore(state, rng))
    };
  }

  /* ---------------------------------------------------------
     FASE 5 · FIN DE AÑO
     --------------------------------------------------------- */
  function phaseYearEnd(state, rng) {
    var p = state.player;
    var notes = [];
    var team = W().getTeam(state, p.teamId);

    /* contrato: el año de la firma todavía no cuenta */
    if (p.contract && p.contract.years > 0 && p.contract.signedYear !== state.year) {
      p.contract.years--;
      if (p.contract.years <= 0 && team) {
        if (rng.chance(0.45)) {
          notes.push('Tu contrato con ' + team.name + ' expira. Sales al mercado.');
          W().leaveTeam(state, 'contract');
        } else {
          p.contract.years = 1;
          notes.push('Sigues bajo contrato con ' + team.name + ' un año más.');
        }
      }
    } else if (team && !p.contract) {
      W().leaveTeam(state, 'no-contract');
    }

    /* el mundo se mueve */
    W().evolveWorld(state, rng, notes);
    state.offers = [];
    delete p.flags.provisional;

    /* edad */
    p.age++;
    state.year++;

    var result = { type: 'yearEnd', title: 'Fin de ' + (state.year - 1), notes: notes, age: p.age };

    if (p.age >= 38) {
      result.forcedRetirement = true;
      return result;
    }

    var prop = DCS.engine.retirement.evaluate(state, rng);
    if (prop) {
      state.pending = { type: 'retirement', data: prop };
      result.retirementPrompt = prop;
    }
    return result;
  }

  function summarizeTeam(state, team) {
    return {
      id: team.id, name: team.name, tier: team.tier, region: team.region,
      quality: W().rosterQuality(team), synergy: team.synergy,
      reputation: team.reputation, expectation: team.expectation, style: team.style,
      roster: team.roster
    };
  }

  /* ---------------------------------------------------------
     API
     --------------------------------------------------------- */
  function advance(state) {
    if (state.pending) return { blocked: true, pending: state.pending };
    if (state.finished) return { finished: true };

    var rng = DCS.runtime.get();
    if (!state.season || state.season.phase === 'done') startSeason(state);

    var phase = state.season.phase;
    /* el mercado es una decisión: no se cierra el año dejándolo sin responder */
    if (phase === 'yearEnd' && state.offers && state.offers.length) {
      return { blocked: true, reason: 'offers', offers: state.offers.length };
    }

    var report;
    if (phase === 'preseason') report = phasePreseason(state, rng);
    else if (phase === 'competition') report = phaseCompetition(state, rng);
    else if (phase === 'review') report = phaseReview(state, rng);
    else if (phase === 'market') report = phaseMarket(state, rng);
    else if (phase === 'yearEnd') {
      report = phaseYearEnd(state, rng);
      state.season.phase = 'done';
      if (report.forcedRetirement) {
        DCS.engine.retirement.retire(state, 'age');
        report.legacy = state.legacy;
      }
    }

    /* si el evento generado exige decisión, bloquea el avance */
    var pendingEvent = findUnresolvedEvent(state);
    if (pendingEvent && !state.pending) {
      state.pending = { type: 'event', eventId: pendingEvent.id };
    }

    state.season.report = report;
    state.lastReport = report;
    return report;
  }

  function findUnresolvedEvent(state) {
    if (!state.season) return null;
    var evs = state.season.events;
    for (var i = 0; i < evs.length; i++) if (!evs[i].resolved) return evs[i];
    return null;
  }

  function resolvePendingEvent(state, optionIndex) {
    var ev = findUnresolvedEvent(state);
    if (!ev) { state.pending = null; return null; }
    var rng = DCS.runtime.get();
    var text = DCS.engine.events.resolve(state, rng, ev, optionIndex, state.season);
    state.pending = null;
    return { event: ev, outcome: text };
  }

  DCS.engine = DCS.engine || {};
  DCS.engine.season = {
    PHASES: PHASES,
    PHASE_LABEL: PHASE_LABEL,
    startSeason: startSeason,
    advance: advance,
    resolvePendingEvent: resolvePendingEvent,
    findUnresolvedEvent: findUnresolvedEvent,
    summarizeTeam: summarizeTeam
  };
})(window.DCS = window.DCS || {});
</script>
<script>
/* ============================================================
   STATE / STORE — creación del estado y persistencia
   ------------------------------------------------------------
   La seed se genera una vez por carrera y viaja con la partida.
   El cursor del RNG se guarda con cada escritura: cerrar la web,
   recargar o volver mañana continúa la misma secuencia. No hay
   forma de refrescar para conseguir otro resultado.
   ============================================================ */
(function (DCS) {
  'use strict';

  var KEY = 'dcs.career.v1';
  var VERSION = 1;

  var available = (function () {
    try {
      var k = '__dcs_test__';
      window.localStorage.setItem(k, '1');
      window.localStorage.removeItem(k);
      return true;
    } catch (e) { return false; }
  })();

  var memory = null;   /* respaldo si el navegador bloquea localStorage */
  var silent = false;  /* modo herramienta: no tocar la partida del usuario */

  function newState(opts) {
    var seed = opts.seed || DCS.rng.newSeed();
    var startYear = (new Date()).getFullYear();

    var state = {
      version: VERSION,
      seed: seed,
      cursor: 0,
      createdAt: Date.now(),
      year: startYear,
      finished: false,
      pending: null,
      legacy: null,
      lastReport: null,
      offers: [],
      history: [],
      usedEvents: {},
      counters: { event: 1, offer: 1 },
      career: {
        maps: 0, wins: 0, losses: 0,
        seriesPlayed: 0, seriesWon: 0, seriesLost: 0,
        titles: 0, tournaments: 0,
        tiPlayed: 0, tiWon: 0,
        earnings: { salary: 0, prize: 0, other: 0 },
        acc: null,
        rolesPlayed: {},
        bestRating: null, bestSeason: null, lastRating: null,
        peakReputation: 0,
        lastChangeYear: null,
        lastRetirementPrompt: null
      }
    };

    DCS.runtime.bind(state);
    var rng = DCS.runtime.get();

    state.player = DCS.engine.player.createPlayer(opts, rng);
    state.career.acc = DCS.engine.stats.blank(state.player.role);
    state.world = DCS.engine.world.createWorld(rng);
    DCS.engine.season.startSeason(state);

    save(state);
    return state;
  }

  function save(state) {
    if (!state) return false;
    DCS.runtime.sync(state);
    if (silent) return false;
    state.savedAt = Date.now();
    var json;
    try { json = JSON.stringify(state); } catch (e) { return false; }
    memory = json;
    if (!available) return false;
    try { window.localStorage.setItem(KEY, json); return true; }
    catch (e) { return false; }
  }

  function load() {
    var json = null;
    if (available) {
      try { json = window.localStorage.getItem(KEY); } catch (e) { json = null; }
    }
    if (!json) json = memory;
    if (!json) return null;
    var state;
    try { state = JSON.parse(json); } catch (e) { return null; }
    if (!state || state.version !== VERSION) return null;
    DCS.runtime.bind(state);
    return state;
  }

  function hasSave() {
    if (available) {
      try { if (window.localStorage.getItem(KEY)) return true; } catch (e) { }
    }
    return !!memory;
  }

  function clear() {
    memory = null;
    if (available) { try { window.localStorage.removeItem(KEY); } catch (e) { } }
  }

  /** Resumen rápido para la pantalla de inicio */
  function peek() {
    var s = load();
    if (!s) return null;
    return {
      nick: s.player.nick,
      age: s.player.age,
      year: s.year,
      role: s.player.role,
      overall: s.player.overall,
      finished: s.finished,
      teamName: (function () {
        var t = DCS.engine.world.getTeam(s, s.player.teamId);
        return t ? t.name : 'Sin equipo';
      })(),
      tier: (function () {
        var t = DCS.engine.world.getTeam(s, s.player.teamId);
        return t ? t.tier : null;
      })(),
      seed: s.seed
    };
  }

  DCS.store = {
    KEY: KEY,
    VERSION: VERSION,
    persistent: available,
    /** las herramientas de simulación masiva lo activan para no pisar la partida */
    setSilent: function (v) { silent = !!v; },
    newState: newState,
    save: save,
    load: load,
    hasSave: hasSave,
    clear: clear,
    peek: peek
  };
})(window.DCS = window.DCS || {});
</script>
<script>
/* ============================================================
   STATE / GAME — fachada única entre la interfaz y el motor
   ------------------------------------------------------------
   La UI no toca el motor directamente. Cada acción muta el estado
   y lo persiste al instante, para que el juego sea idéntico tras
   cerrar la pestaña.
   ============================================================ */
(function (DCS) {
  'use strict';

  var U = DCS.util;

  var game = {
    state: null,

    start: function (opts) {
      game.state = DCS.store.newState(opts);
      return game.state;
    },

    resume: function () {
      game.state = DCS.store.load();
      return game.state;
    },

    persist: function () {
      if (!game.state) return;
      var p = game.state.player;
      var c = game.state.career;
      if (p.reputation > c.peakReputation) c.peakReputation = Math.round(p.reputation);
      DCS.store.save(game.state);
    },

    /** Ejecuta la siguiente fase de la temporada */
    advance: function () {
      var s = game.state;
      if (!s || s.finished) return null;
      var report = DCS.engine.season.advance(s);
      game.persist();
      return report;
    },

    /** Avanza fases hasta que algo requiera al usuario */
    advanceUntilInput: function (maxSteps) {
      var out = [];
      var steps = maxSteps || 6;
      for (var i = 0; i < steps; i++) {
        var s = game.state;
        if (!s || s.finished || s.pending) break;
        var phase = s.season ? s.season.phase : null;
        var r = game.advance();
        if (!r || r.blocked) break;
        out.push(r);
        if (game.state.pending) break;
        if (phase === 'market' && r.offers && r.offers.length) break;
        if (phase === 'yearEnd') break;
      }
      return out;
    },

    setTraining: function (focus) {
      if (!game.state) return;
      game.state.player.trainingFocus = focus;
      game.persist();
    },

    acceptOffer: function (offerId) {
      var s = game.state;
      var offer = null;
      for (var i = 0; i < s.offers.length; i++) if (s.offers[i].id === offerId) offer = s.offers[i];
      if (!offer) return false;
      var ok = DCS.engine.market.acceptOffer(s, offer);
      if (ok) {
        s.offers = [];
        /* si el fichaje ocurre con la temporada ya cerrada, la nueva
           etapa se abrirá al arrancar el próximo año */
        game.persist();
      }
      return ok;
    },

    declineOffers: function () {
      var s = game.state;
      s.offers = [];
      game.persist();
      return true;
    },

    resolveEvent: function (optionIndex) {
      var s = game.state;
      var out = DCS.engine.season.resolvePendingEvent(s, optionIndex);
      game.persist();
      return out;
    },

    /** Respuesta a la propuesta de retirada */
    answerRetirement: function (accept) {
      var s = game.state;
      if (!s.pending || s.pending.type !== 'retirement') return null;
      s.pending = null;
      if (accept) {
        DCS.engine.retirement.retire(s, 'choice');
      } else {
        s.player.morale = U.clamp(s.player.morale + 8, 0, 100);
        s.career.lastRetirementPrompt = s.year;
      }
      game.persist();
      return s.finished ? s.legacy : null;
    },

    retireNow: function () {
      var s = game.state;
      if (!s || s.finished) return null;
      DCS.engine.retirement.retire(s, 'choice');
      game.persist();
      return s.legacy;
    },

    reset: function () {
      DCS.store.clear();
      game.state = null;
    },

    /* --------- lecturas de conveniencia para la UI --------- */
    team: function () {
      var s = game.state;
      return s ? DCS.engine.world.getTeam(s, s.player.teamId) : null;
    },

    phaseLabel: function () {
      var s = game.state;
      if (!s || s.finished) return 'Carrera finalizada';
      if (s.pending && s.pending.type === 'retirement') return '¿Ha llegado el momento?';
      if (s.pending && s.pending.type === 'event') return 'Decisión pendiente';
      var ph = s.season ? s.season.phase : 'preseason';
      if (ph === 'done') return 'Pretemporada';
      return DCS.engine.season.PHASE_LABEL[ph] || ph;
    },

    nextLabel: function () {
      var s = game.state;
      if (!s) return '';
      var ph = s.season ? s.season.phase : 'preseason';
      var map = {
        preseason: 'Iniciar pretemporada',
        competition: 'Jugar la temporada',
        review: 'Cerrar la temporada',
        market: 'Abrir el mercado',
        yearEnd: 'Terminar el año',
        done: 'Empezar ' + s.year
      };
      return map[ph] || 'Continuar';
    }
  };

  DCS.game = game;
})(window.DCS = window.DCS || {});
</script>
<script>
/* ============================================================
   UI / COMPONENTS — piezas de interfaz reutilizables
   ------------------------------------------------------------
   Todo devuelve HTML como string. El color siempre significa algo:
   tier, posición y banda de rendimiento tienen tono propio.
   ============================================================ */
(function (DCS) {
  'use strict';

  var fmt = DCS.ui.fmt;
  var U = DCS.util;

  function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function cls(list) { return list.filter(Boolean).join(' '); }

  /* --------------------------------------------------------
     Contenedores
     -------------------------------------------------------- */
  function card(o) {
    return '<section class="' + cls(['card', 'reveal', o.className]) + '"' +
      (o.delay ? ' style="animation-delay:' + o.delay + 'ms"' : '') + '>' +
      '<span class="card-accent"></span>' +
      (o.title ? '<header class="card-head">' +
        '<h3>' + esc(o.title) + '</h3>' +
        (o.meta ? '<span class="card-meta">' + o.meta + '</span>' : '') +
        '</header>' : '') +
      (o.subtitle ? '<p class="card-sub">' + o.subtitle + '</p>' : '') +
      '<div class="card-body">' + (o.body || '') + '</div>' +
      (o.footer ? '<footer class="card-foot">' + o.footer + '</footer>' : '') +
      '</section>';
  }

  /* --------------------------------------------------------
     Números
     -------------------------------------------------------- */
  /**
   * Un número suelto se anima al aparecer; una cadena ya formateada, no.
   * El valor final se escribe YA en el HTML: si el navegador pausa las
   * animaciones (pestaña en segundo plano), el dato sigue siendo correcto.
   */
  function valueHtml(value, count) {
    if (count && typeof count.v === 'number' && isFinite(count.v)) {
      var k = count.fmt || 'int';
      return '<span class="tile-value" data-count="' + count.v + '" data-fmt="' + k + '">' +
        fmt.stat(k, count.v) + '</span>';
    }
    if (typeof value === 'number' && isFinite(value)) {
      return '<span class="tile-value" data-count="' + value + '" data-fmt="int">' + fmt.int(value) + '</span>';

  function tile(label, value, sub, tone, count) {

      v = '<span class="kpi-v ' + (tone || '') + '" data-count="' + value + '" data-fmt="int">' + fmt.int(value) + '</span>';
    } else {
      v = '<span class="kpi-v ' + (tone || '') + '">' + value + '</span>';

    return '<div class="kpi"><span class="kpi-k">' + esc(label) + '</span>' + v +

  function kpis(list) { return '<div class="kpis" data-n="' + list.length + '">' + list.join('') + '</div>'; }

  /* --------------------------------------------------------

  function bar(value, max, tone) {

      '" style="width:' + p.toFixed(1) + '%"></span></span>';

  function attrRow(label, value, delta) {
    var tone = value >= 80 ? 'hi' : (value >= 60 ? 'mid' : (value >= 40 ? 'lo' : 'min'));
    var d = '';

      d = '<span class="attr-delta ' + (delta > 0 ? 'up' : 'down') + '">' + fmt.signed(delta) + '</span>';
    } else if (delta !== undefined) {

      '<span class="attr-name">' + esc(label) + '</span>' +
      bar(value, 100, tone) +
      '<span class="attr-val">' + Math.round(value) + '</span>' + d +
      '</div>';
  }

  /**
   * Barra de estadística contra el baremo REAL del rol: dónde cae
   * tu número entre "flojo" y "élite" para tu posición.
   */
  function statBar(label, value, low, high, fmtKind) {
    var pos = U.clamp(U.norm(value, low, high), 0, 1) * 100;
    return '<div class="statbar" title="Baremo de tu posición: ' +
      esc(fmt.stat(fmtKind, low)) + ' → ' + esc(fmt.stat(fmtKind, high)) + '">' +
      '<div class="statbar-head"><span class="statbar-name">' + esc(label) + '</span>' +
      '<span class="statbar-val">' + fmt.stat(fmtKind, value) + '</span></div>' +
      '<div class="statbar-track"><span class="statbar-mark" style="left:calc(' + pos.toFixed(1) + '% - 1.5px)"></span></div>' +
      '<div class="statbar-scale"><span>Flojo</span><span>Media</span><span>Élite</span></div>' +
      '</div>';
  }

  /** Todas las barras que realmente pesan en el rating de ese rol */
  function statBars(role, avg) {
    var spec = DCS.data.ROLES[role].ratingSpec;
    var display = DCS.data.ROLES[role].display;
    var labels = {}, fmts = {};
    display.forEach(function (d) { labels[d.key] = d.label; fmts[d.key] = d.fmt; });
    labels.kda = 'KDA'; fmts.kda = fmts.kda || 'dec2';
    return spec.map(function (s) {
      var v = avg[s.key];

  /* --------------------------------------------------------

  function posChip(role) {

  function ratingBand(r) {

    if (r >= 80) return 'r-great';
    if (r >= 70) return 'r-good';
    if (r >= 60) return 'r-ok';
    if (r >= 50) return 'r-mid';
    return 'r-bad';

  function ratingChip(r) {

    return '<span class="rating-chip ' + ratingBand(r) + '">' + r + '</span>';

  /* --------------------------------------------------------
     Navegación interna
     -------------------------------------------------------- */
  function tabs(items, active, action) {
    return '<div class="tabs">' + items.map(function (it) {
      return '<button class="tab' + (it.id === active ? ' active' : '') +
        '" data-action="' + action + '" data-value="' + esc(it.id) + '">' + esc(it.label) + '</button>';
    }).join('') + '</div>';
  }

  /* --------------------------------------------------------
     Tablas y botones
     -------------------------------------------------------- */
  function table(headers, rows, opts) {
    opts = opts || {};
    var h = '<thead><tr>' + headers.map(function (x) {
      return '<th' + (/^\s*<b>?\s*$/.test(x) ? '' : '') + '>' + x + '</th>';
    }).join('') + '</tr></thead>';
    var b = '<tbody>' + rows.map(function (r) {
      var attrs = r.attrs || '';
      var cells = (r.cells || r).map(function (c) { return '<td>' + c + '</td>'; }).join('');
      return '<tr ' + attrs + '>' + cells + '</tr>';
    }).join('') + '</tbody>';
    return '<div class="table-wrap"><table class="' + cls(['tbl', opts.className]) + '">' + h + b + '</table></div>';
  }

  function btn(label, action, o) {
    o = o || {};
    return '<button class="' + cls(['btn', o.variant ? 'btn-' + o.variant : '', o.block ? 'btn-block' : '', o.size ? 'btn-' + o.size : '']) +
      '" data-action="' + esc(action) + '"' +
      (o.value !== undefined ? ' data-value="' + esc(o.value) + '"' : '') +
      (o.disabled ? ' disabled' : '') + '>' + label +
      (o.key ? '<kbd>' + esc(o.key) + '</kbd>' : '') + '</button>';
  }

  function empty(text) { return '<p class="empty">' + esc(text) + '</p>'; }

  /* --------------------------------------------------------
     Estadísticas del rol en formato ficha
     -------------------------------------------------------- */
  function statGrid(role, avg) {
    var spec = DCS.data.ROLES[role].display;
    return tiles(spec.map(function (s) {
      return tile(s.label, fmt.stat(s.fmt, avg[s.key]), null, null, { v: avg[s.key], fmt: s.fmt });
    }));
  }

  /* --------------------------------------------------------
     Resultados de torneo (fila desplegable) y desglose de series
     -------------------------------------------------------- */
  function resultRow(t, open, index) {
    var champion = t.placement === 1 && t.kind !== 'qualifier';
    var win = t.wins > t.losses;
    var state = champion ? 'champion' : (win ? 'win' : 'loss');
    var hasLog = t.log && t.log.length;
    return '<div class="' + cls(['result-row', state, t.kind === 'ti' ? 'ti' : '', open ? 'open' : '', 'reveal']) + '"' +
      (index !== undefined ? ' style="animation-delay:' + (index * 70) + 'ms"' : '') +
      (hasLog ? ' data-action="toggle-tourn" data-value="' + esc(t.id) + '"' : '') + '>' +
      '<span class="rmark"></span>' +
      '<div><div class="rname">' + esc(t.name) + '</div>' +
      '<div class="rmeta">' + esc(t.teamName) + ' · ' + t.wins + '-' + t.losses + ' mapas · ' +
      t.seriesWon + '-' + t.seriesLost + ' series · ' + t.field + ' equipos</div></div>' +
      '<div class="rright">' +
      '<span class="rres">' + esc(t.result) + '</span>' +
      (t.prize ? badge(fmt.money(t.prize), 'gold') : '') +
      ratingChip(t.rating) +
      (hasLog ? '<span class="rchev">▶</span>' : '') +
      '</div></div>' +
      (open && hasLog ? seriesList(t.log) : '');
  }

  function seriesList(log) {
    var html = '<div class="series-list">';
    var stage = null;
    log.forEach(function (s) {
      if (s.stage !== stage) {
        stage = s.stage;
        html += '<div class="series-stage">' + esc(stage) + '</div>';
      }
      var cl = s.won === true ? 'w' : (s.won === false ? 'l' : 'd');
      html += '<div class="series-row ' + cl + '">' +
        '<span class="sopp">vs ' + esc(s.opp) + '</span>' +
        '<span class="sfmt">' + esc(s.fmt) + '</span>' +
        '<span class="maps">' + (s.maps || '').split('').map(function (m) {
          return '<span class="map-pill ' + m.toLowerCase() + '">' + m + '</span>';
        }).join('') + '</span>' +
        '<span class="sscore">' + s.w + '-' + s.l + '</span>' +
        '</div>';
    });
    return html + '</div>';
  }

  function toneClass(tone) {
    return tone === 'great' ? 'ev-great' : tone === 'good' ? 'ev-good' : tone === 'bad' ? 'ev-bad' : 'ev-neutral';
  }

  DCS.ui.c = {
    esc: esc, cls: cls, card: card,
    tile: tile, tiles: tiles, kpi: kpi, kpis: kpis,
    bar: bar, attrRow: attrRow, statBar: statBar, statBars: statBars,
    badge: badge, tierBadge: tierBadge, posChip: posChip, posChipFull: posChipFull,
    ratingChip: ratingChip, ratingBand: ratingBand,
